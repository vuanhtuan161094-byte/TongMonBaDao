name: VFX POI06 R11 | native Godot owner preview gate
on:
  workflow_dispatch:
  push:
    branches: [integration/pve-p0-playable-ui-20261103]
    paths:
      - 'godot/labs/combat_lab/poison06/r11_candidate/**'
      - 'godot/tests/labs/combat_lab/vfx_poi06_r11_contract_test.gd'
      - '.github/workflows/vfx-poi-06-r11-native.yml'
permissions:
  contents: read
jobs:
  r11-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_AUDIO_DRIVER: Dummy
      GODOT_RENDERING_DRIVER: opengl3
    steps:
      - uses: actions/checkout@v4
      - name: Install official SHA256-pinned Godot 4.7.2 and video dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg unzip python3-pil
          curl --fail --location --retry 3 -o /tmp/godot472.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot472.zip' | sha256sum --check --strict
          unzip -q /tmp/godot472.zip -d /tmp
          sudo install -m0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p "$RUNNER_TEMP/vfx-poi06-r11"
          godot --version | tee "$RUNNER_TEMP/vfx-poi06-r11/engine.txt"
          printf 'SOURCE_SHA=%s\nOWNER_R11_PREVIEW_ACCEPTED\nNATIVE_GODOT_GATE_REQUIRED\nPVE_HOLD\nV63_OFF\n' "$GITHUB_SHA" > "$RUNNER_TEMP/vfx-poi06-r11/metadata.txt"
      - name: Restore pinned Stage A baseline asset pack
        shell: bash
        run: |
          set -euo pipefail
          cat .github/assets/p3/female_stage_a/part{01..14}.b64 .github/assets/p3/female_stage_a/part15a.b64 .github/assets/p3/female_stage_a/part15b.b64 .github/assets/p3/female_stage_a/part{16..20}.b64 | tr -d '\r\n\t ' | base64 --decode > /tmp/tmb_stage_a_pack.zip
          test "$(stat -c%s /tmp/tmb_stage_a_pack.zip)" -eq 44838
          echo '6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  /tmp/tmb_stage_a_pack.zip' | sha256sum --check --strict
          unzip -q /tmp/tmb_stage_a_pack.zip -d .
      - name: Require EXACT R11 owner-preview alpha atlas (never substitute R10)
        shell: bash
        run: |
          set -euo pipefail
          p=godot/labs/combat_lab/poison06/r11_candidate/assets/realm_vortex_r11_48.png
          test -s "$p" || { echo R11_ATLAS_MISSING; exit 1; }
          echo "1d3c8adbee16e48973998a66f3692f12366dd64e8b9582ecf090ccfcb00299f8  $p" | sha256sum --check --strict
          python3 - <<'PY'
          from PIL import Image
          im=Image.open("godot/labs/combat_lab/poison06/r11_candidate/assets/realm_vortex_r11_48.png").convert("RGBA")
          assert im.size==(2048,1536)
          for i in range(48):
              x=(i%8)*256; y=(i//8)*256
              a=im.crop((x,y,x+256,y+256)).getchannel("A")
              assert a.getbbox(), f"R11 sprite frame {i} empty"
              for rect in [(0,0,256,1),(0,255,256,256),(0,0,1,256),(255,0,256,256)]:
                  assert a.crop(rect).getextrema()[1]==0, f"R11 sprite cell {i} alpha border bleeding"
          print("R11_RGBA_ALPHA_PASS frames=48")
          PY
      - name: Strict import, scene script parser, focused contract
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-poi06-r11"
          bash tools/qa/run_godot_strict.sh --headless --path godot --import 2>&1 | tee "$d/import.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/combat_lab/poison06/r11_candidate/van_co_phe_gioi_r11.gd 2>&1 | tee "$d/parse.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/labs/combat_lab/vfx_poi06_r11_contract_test.gd 2>&1 | tee "$d/focused.log"
          grep -Fxq 'VFX_POI06_R11_RESULT=PASS failures=0' "$d/focused.log"
      - name: Capture actual native 1280x720 Godot 333-frame movie, 14 phase stills and GIF
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-poi06-r11"
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 --write-movie "$d/R11-godot-native.avi" --quit-after 333 res://labs/combat_lab/poison06/r11_candidate/van_co_phe_gioi_r11.tscn 2>&1 | tee "$d/movie.log"
          grep -Fq 'POI06_R11_READY atlas=48' "$d/movie.log"
          test -s "$d/R11-godot-native.avi"
          ffmpeg -y -hide_banner -loglevel error -i "$d/R11-godot-native.avi" -pix_fmt yuv420p -c:v libx264 -crf 16 "$d/R11-godot-native.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of default=noprint_wrappers=1 "$d/R11-godot-native.mp4" | tee "$d/dimensions.txt"
          grep -Fxq 'width=1280' "$d/dimensions.txt"
          grep -Fxq 'height=720' "$d/dimensions.txt"
          for at in 0.38 0.75 1.06 1.31 1.71 2.11 2.38 2.66 2.98 3.30 3.73 4.21 4.72 5.20; do
            ffmpeg -y -hide_banner -loglevel error -ss "$at" -i "$d/R11-godot-native.mp4" -frames:v 1 "$d/frame-$at.png"
          done
          ffmpeg -y -hide_banner -loglevel error -i "$d/R11-godot-native.mp4" -vf 'fps=5,scale=320:180,tile=5x4:nb_frames=20' -frames:v 1 "$d/timeline.png"
          ffmpeg -y -hide_banner -loglevel error -i "$d/R11-godot-native.mp4" -vf 'fps=8,scale=640:-1:flags=lanczos' -loop 0 "$d/R11-godot-native.gif"
          sha256sum "$d/"*.mp4 "$d/"*.png "$d/"*.gif > "$d/SHA256SUMS.txt"
          rm -f "$d/R11-godot-native.avi"
      - name: Upload exact-SHA logs and genuine Godot art proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfx-poi06-r11-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/vfx-poi06-r11/*.log
            ${{ runner.temp }}/vfx-poi06-r11/*.txt
            ${{ runner.temp }}/vfx-poi06-r11/*.png
            ${{ runner.temp }}/vfx-poi06-r11/*.mp4
            ${{ runner.temp }}/vfx-poi06-r11/*.gif
