name: VFX-CAL-00 | Classic Thunder Godot 4.7.2 1280x720 evidence
on:
  workflow_dispatch:
  push:
    branches: [integration/pve-p0-playable-ui-20261103]
    paths:
      - '.github/workflows/vfx-cal-00-thunder.yml'
      - 'godot/labs/combat_lab/calibration00/**'
      - 'godot/tests/labs/combat_lab/vfx_cal00_thunder_contract_test.gd'
permissions:
  contents: read
jobs:
  classic-thunder:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_AUDIO_DRIVER: Dummy
      GODOT_RENDERING_DRIVER: opengl3
    steps:
      - uses: actions/checkout@v4
      - name: Official pinned Godot 4.7.2 / Xvfb / ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg unzip
          curl --fail --location --retry 3 -o /tmp/godot472.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot472.zip" | sha256sum --check --strict
          unzip -q /tmp/godot472.zip -d /tmp
          sudo install -m0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p "$RUNNER_TEMP/vfx-cal00"
          d="$RUNNER_TEMP/vfx-cal00"
          godot --version | tee "$d/engine.txt"
          printf 'SOURCE_SHA=%s\nSCENE=res://labs/combat_lab/calibration00/thunder_calibration.tscn\nRENDERER=gl_compatibility\nOWNER_VISUAL_PENDING\nPVE_INTEGRATION_HOLD\n' "$GITHUB_SHA" > "$d/metadata.txt"
      - name: Restore existing Combat Lab Stage A source asset
        shell: bash
        run: |
          set -euo pipefail
          cat .github/assets/p3/female_stage_a/part{01..14}.b64 .github/assets/p3/female_stage_a/part15a.b64 .github/assets/p3/female_stage_a/part15b.b64 .github/assets/p3/female_stage_a/part{16..20}.b64 | tr -d '\r\n\t ' | base64 --decode > /tmp/tmb_stage_a_pack.zip
          test "$(stat -c%s /tmp/tmb_stage_a_pack.zip)" -eq 44838
          echo "6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  /tmp/tmb_stage_a_pack.zip" | sha256sum --check --strict
          unzip -q /tmp/tmb_stage_a_pack.zip -d .
      - name: Track pre-existing project summon parse failure separately
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("godot/src/simulation/combat/v63_summon_skill_combat_system.gd")
          s=p.read_text()
          old="var candidate := origin+offset"
          new="var candidate: Vector2 = origin+(offset as Vector2)"
          if s.count(old)!=1:
              raise SystemExit("Pre-existing summon parse changed. Fail rather than masking baseline.")
          p.write_text(s.replace(old,new))
          print("EPHEMERAL_SUMMON_SHIM_CHECKOUT_ONLY—not a production fix")
          PY
      - name: Strict Godot focused import / parse / contract
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-cal00"
          bash tools/qa/run_godot_strict.sh --headless --path godot --import 2>&1 | tee "$d/import.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/combat_lab/calibration00/thunder_calibration.gd 2>&1 | tee "$d/script.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/labs/combat_lab/vfx_cal00_thunder_contract_test.gd 2>&1 | tee "$d/test.log"
          grep -Fq 'VFX_CAL00_THUNDER_FOCUSED_RESULT=PASS failures=0' "$d/test.log"
      - name: Genuine Godot 1280x720 Compatibility movie and 10 frames
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-cal00"
          xvfb-run -a -s "-screen 0 1280x720x24"             bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720             --fixed-fps 60 --write-movie "$d/classic-thunder.avi" --quit-after 279             res://labs/combat_lab/calibration00/thunder_calibration.tscn             2>&1 | tee "$d/movie.log"
          test -s "$d/classic-thunder.avi"
          ffmpeg -y -hide_banner -loglevel error -i "$d/classic-thunder.avi"             -pix_fmt yuv420p -c:v libx264 -crf 16 "$d/classic-thunder.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,avg_frame_rate             -of default=noprint_wrappers=1 "$d/classic-thunder.mp4" | tee "$d/movie_dimensions.txt"
          grep -Fxq 'width=1280' "$d/movie_dimensions.txt"
          grep -Fxq 'height=720' "$d/movie_dimensions.txt"
          for at in 0.20 0.60 1.13 1.22 1.31 1.52 1.85 2.16 2.78 3.12; do
            ffmpeg -y -hide_banner -loglevel error -ss "$at" -i "$d/classic-thunder.mp4"               -frames:v 1 "$d/frame-$at.png"
          done
          ffmpeg -y -hide_banner -loglevel error -i "$d/classic-thunder.mp4"             -vf "fps=6,scale=320:180,tile=5x4:nb_frames=20" -frames:v 1 "$d/timeline.png"
          sha256sum "$d/"*.mp4 "$d/"*.png > "$d/SHA256SUMS.txt"
          rm "$d/classic-thunder.avi"
      - name: Upload evidence even on earlier QA failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfx-cal00-classic-thunder-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/vfx-cal00/*.log
            ${{ runner.temp }}/vfx-cal00/*.txt
            ${{ runner.temp }}/vfx-cal00/*.png
            ${{ runner.temp }}/vfx-cal00/*.mp4
