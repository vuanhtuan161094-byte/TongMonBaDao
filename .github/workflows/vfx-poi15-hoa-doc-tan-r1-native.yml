name: VFX POI15 R1 Hóa Độc Tán - three moving monster AOE six-sec poison
on:
  workflow_dispatch:
  push:
    branches: [integration/pve-p0-playable-ui-20261103]
    paths:
      - 'tools/vfx/generate_poi15_hoa_doc_tan_r1.py'
      - 'godot/labs/combat_lab/poison15_hoa_doc_tan/**'
      - 'godot/tests/labs/combat_lab/vfx_poi15_hoa_doc_tan_r1_contract_test.gd'
      - 'docs/operations/vfx_packets/POI15_R1_V4_PREFLIGHT.json'
      - 'docs/operations/VFX_POI15_HOA_DOC_TAN_R1_20261117.md'
      - '.github/workflows/vfx-poi15-hoa-doc-tan-r1-native.yml'
permissions:
  contents: write
jobs:
  poi15-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_AUDIO_DRIVER: Dummy
      GODOT_RENDERING_DRIVER: opengl3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Official Godot 4.7.2 and original-alpha generation libraries
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y unzip ffmpeg xvfb python3-pil python3-numpy
          python3 -c 'import numpy; from PIL import Image; print("POI15_R1_RGBA_TOOLS_READY")'
          curl --fail --location --retry 3 -o /tmp/godot472.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot472.zip' | sha256sum --check --strict
          unzip -q /tmp/godot472.zip -d /tmp
          sudo install -m0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p "$RUNNER_TEMP/poi15"
          godot --version | tee "$RUNNER_TEMP/poi15/engine.txt"
          printf 'EXACT_SHA=%s\nNO_GIF\nNO_RIG\nOWNER_VISUAL_PENDING\nPVE_HOLD\nV63_OFF\n' "$GITHUB_SHA" > "$RUNNER_TEMP/poi15/metadata.txt"
      - name: Bake original area toxin RGB/alpha source, validate V4 schema and soft alpha
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/poi15"
          python3 tools/vfx/generate_poi15_hoa_doc_tan_r1.py 2>&1 | tee "$d/bake.log"
          python3 tools/qa/validate_vfx_v4_packet.py --stage packet --packet docs/operations/vfx_packets/POI15_R1_V4_PREFLIGHT.json | tee "$d/v4-packet.log"
          python3 tools/qa/validate_vfx_v4_packet.py --stage assets --packet docs/operations/vfx_packets/POI15_R1_V4_PREFLIGHT.json | tee "$d/v4-assets.log"
          python3 - <<'PY'
          import numpy as np
          from PIL import Image
          from pathlib import Path
          root=Path('godot/labs/combat_lab/poison15_hoa_doc_tan/r1/assets')
          for f in root.glob('*.png'):
              rgba=np.asarray(Image.open(f).convert('RGBA'))
              assert int(rgba[:,:,3].max())>65,(f,'blank')
              assert np.any((rgba[:,:,3]>0)&(rgba[:,:,3]<250)),(f,'not translucent')
              assert int(rgba[0,:,3].max())==0 and int(rgba[-1,:,3].max())==0,(f,'hard square')
          print('POI15_R1_TRUE_ALPHA_COLOR_BORDER_PASS')
          PY
          find godot/labs/combat_lab/poison15_hoa_doc_tan/r1/assets -name '*.png' -print0 | sort -z | xargs -0 sha256sum > "$d/original-source-sha256.txt"
      - name: Restore existing approved actor fixture for LAB preview only
        run: |
          set -euo pipefail
          cat .github/assets/p3/female_stage_a/part{01..14}.b64 .github/assets/p3/female_stage_a/part15a.b64 .github/assets/p3/female_stage_a/part15b.b64 .github/assets/p3/female_stage_a/part{16..20}.b64 | tr -d '\r\n\t ' | base64 --decode > /tmp/tmb_stage_a_pack.zip
          echo '6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  /tmp/tmb_stage_a_pack.zip' | sha256sum --check --strict
          unzip -q /tmp/tmb_stage_a_pack.zip -d .
      - name: Godot strict parse and 4 MOVING monsters (3 poisoned + 1 out-of-area) contract
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/poi15"
          bash tools/qa/run_godot_strict.sh --headless --path godot --import 2>&1 | tee "$d/import.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/combat_lab/poison15_hoa_doc_tan/r1/hoa_doc_tan.gd 2>&1 | tee "$d/parse.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/labs/combat_lab/vfx_poi15_hoa_doc_tan_r1_contract_test.gd 2>&1 | tee "$d/godot-focused.log"
          grep -Fq 'POI15_HOA_DOC_TAN_R1_RESULT=PASS failures=0' "$d/godot-focused.log"
      - name: Real Godot 1280x720 full 6s poison duration MP4, 3 phases + expiry probes
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/poi15"
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 --write-movie "$d/native.avi" --quit-after 450 res://labs/combat_lab/poison15_hoa_doc_tan/r1/hoa_doc_tan.tscn 2>&1 | tee "$d/godot-preflight.log"
          grep -Fq 'POI15_HOA_DOC_TAN_R1_READY' "$d/godot-preflight.log"
          ffmpeg -y -hide_banner -loglevel error -i "$d/native.avi" -pix_fmt yuv420p -c:v libx264 -crf 16 -movflags +faststart "$d/v4-poi15-r1-native.mp4"
          ffmpeg -y -hide_banner -loglevel error -ss 0.28 -i "$d/v4-poi15-r1-native.mp4" -frames:v 1 "$d/v4-charge.png"
          ffmpeg -y -hide_banner -loglevel error -ss 0.84 -i "$d/v4-poi15-r1-native.mp4" -frames:v 1 "$d/v4-peak.png"
          ffmpeg -y -hide_banner -loglevel error -ss 1.20 -i "$d/v4-poi15-r1-native.mp4" -frames:v 1 "$d/v4-contact.png"
          python3 tools/qa/validate_vfx_v4_packet.py --stage evidence --packet docs/operations/vfx_packets/POI15_R1_V4_PREFLIGHT.json --out "$d" --sha "$GITHUB_SHA" | tee "$d/v4-evidence.log"
          # A long movie is intentional: user must be able to see real 6-second poison mark expiry.
          for t in 0.08 0.22 0.28 0.54 0.62 0.84 0.99 1.12 1.20 1.48 2.25 3.95 5.40 6.90 7.20; do
            ffmpeg -y -hide_banner -loglevel error -ss "$t" -i "$d/v4-poi15-r1-native.mp4" -frames:v 1 "$d/check-$t.png"
          done
          ffmpeg -y -hide_banner -loglevel error -ss 1.50 -i "$d/v4-poi15-r1-native.mp4" -frames:v 1 "$d/v4-status-start.png"
          ffmpeg -y -hide_banner -loglevel error -ss 3.95 -i "$d/v4-poi15-r1-native.mp4" -frames:v 1 "$d/v4-status-mid.png"
          ffmpeg -y -hide_banner -loglevel error -ss 6.90 -i "$d/v4-poi15-r1-native.mp4" -frames:v 1 "$d/v4-status-pre-expiry.png"
          ffmpeg -y -hide_banner -loglevel error -ss 7.20 -i "$d/v4-poi15-r1-native.mp4" -frames:v 1 "$d/v4-status-expired.png"
          ffprobe -v error -show_entries stream=width,height,nb_frames,duration -of default=noprint_wrappers=1 "$d/v4-poi15-r1-native.mp4" | tee "$d/movie-metadata.txt"
          sha256sum "$d/v4-poi15-r1-native.mp4" "$d/v4-"*.png > "$d/NATIVE-G35-SHA256.txt"
          rm "$d/native.avi"
      - name: Preserve original master and atlas PNGs on current PR branch
        if: success() && github.event_name == 'push'
        run: |
          set -euo pipefail
          branch='integration/pve-p0-playable-ui-20261103'
          folder='godot/labs/combat_lab/poison15_hoa_doc_tan/r1/assets'
          mkdir -p "$RUNNER_TEMP/poi15/saved"
          cp -R "$folder"/. "$RUNNER_TEMP/poi15/saved/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin "$branch"
            latest="$(git rev-parse FETCH_HEAD)"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" "$latest"; then echo POI15_REWRITE_ABORT; exit 0; fi
            if test -n "$(git diff --name-only "$GITHUB_SHA" "$latest" -- tools/vfx/generate_poi15_hoa_doc_tan_r1.py godot/labs/combat_lab/poison15_hoa_doc_tan/ .github/workflows/vfx-poi15-hoa-doc-tan-r1-native.yml)"; then
              echo POI15_CONCURRENT_SOURCE_CHANGE_ABORT; exit 0
            fi
            git reset --hard "$latest"
            mkdir -p "$folder"; cp -R "$RUNNER_TEMP/poi15/saved"/. "$folder/"
            git add "$folder"
            if git diff --cached --quiet; then echo POI15_ALREADY_ARCHIVED; exit 0; fi
            git commit -m 'art(poi15): preserve original area-poison source PNG masters and RGBA atlases'
            if git push origin "HEAD:refs/heads/$branch"; then echo "POI15_ART_COMMIT=$(git rev-parse HEAD)" | tee "$RUNNER_TEMP/poi15/saved-commit.txt"; exit 0; fi
          done
          echo POI15_ART_SAVE_CONFLICT; exit 1
      - name: Upload MP4 and native proof, NO GIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poi15-r1-poison-native-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/poi15/*.log
            ${{ runner.temp }}/poi15/*.txt
            ${{ runner.temp }}/poi15/*.json
            ${{ runner.temp }}/poi15/*.png
            ${{ runner.temp }}/poi15/*.mp4
            godot/labs/combat_lab/poison15_hoa_doc_tan/r1/assets/**/*.png
            godot/labs/combat_lab/poison15_hoa_doc_tan/r1/assets/*.png
