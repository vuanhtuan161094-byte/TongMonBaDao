name: P3 O8 Alchemy Field Pill Consumer

on:
  workflow_dispatch:
  push:
    paths:
      - 'godot/src/simulation/building/medicine_catalogue_v2.gd'
      - 'godot/src/simulation/building/medicine_allocation_v2.gd'
      - 'godot/src/simulation/building/spirit_crop_registry.gd'
      - 'godot/src/simulation/building/medicine_resource_source_v1.gd'
      - 'godot/src/simulation/building/sx01_pill_policy.gd'
      - 'godot/src/simulation/cultivation/b3_pill_satiety_v1.gd'
      - 'godot/src/simulation/cultivation/disciple_progression_balance_v2.gd'
      - 'godot/src/simulation/combat/b3_medical_autoplay_v1.gd'
      - 'godot/tests/simulation/sx01_pill_policy_test.gd'
      - 'godot/tests/simulation/sx02_medicine_catalogue_test.gd'
      - 'godot/tests/simulation/sx02_medicine_runtime_test.gd'
      - 'godot/tests/simulation/sx02_alchemy_profession_availability_test.gd'
      - 'godot/tests/simulation/sx03_source_consumer_stage_contract_test.gd'
      - 'godot/tests/simulation/sx03_bal04a_legacy_save_medicine_test.gd'
      - 'godot/tests/simulation/sx03_satiety_cap_migration_test.gd'
      - 'godot/tests/simulation/v57_sx_contract_guard_test.gd'
      - 'godot/src/simulation/building/alchemy_recipe_registry.gd'
      - 'godot/src/simulation/building/building_system.gd'
      - 'godot/src/simulation/state/building_state.gd'
      - 'godot/src/simulation/resource/resource_registry.gd'
      - 'godot/src/simulation/needs/needs_system.gd'
      - 'godot/src/simulation/workforce/workforce_system.gd'
      - 'godot/src/simulation/core/simulation_scheduler.gd'
      - 'godot/src/presentation/p3/sect_map_presentation.gd'
      - 'godot/src/presentation/p3_1_landscape_sect.gd'
      - 'godot/src/presentation/p3_2_landscape_sect.gd'
      - 'godot/tests/presentation/p3_o8_alchemy_loop_test.gd'
      - '.github/workflows/p3-o8-alchemy-loop.yml'

permissions:
  contents: read

jobs:
  p3-o8-focused:
    name: Godot 4.7.2 O8 Alchemy field-pill-consumer test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install official Godot 4.7.2 binary
        shell: bash
        run: |
          set -euo pipefail
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          GODOT_SHA256="cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
          curl --fail --location --retry 3 --output /tmp/godot.zip "$GODOT_URL"
          echo "$GODOT_SHA256  /tmp/godot.zip" | sha256sum --check --strict
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Confirm official version
        run: godot --version

      - name: Restore canonical female Stage A runtime pack
        shell: bash
        run: |
          set -euo pipefail
          PACK="/tmp/female_normal_v1_stageA_runtime_pack_v2_quant.zip"
          cat             .github/assets/p3/female_stage_a/part01.b64             .github/assets/p3/female_stage_a/part02.b64             .github/assets/p3/female_stage_a/part03.b64             .github/assets/p3/female_stage_a/part04.b64             .github/assets/p3/female_stage_a/part05.b64             .github/assets/p3/female_stage_a/part06.b64             .github/assets/p3/female_stage_a/part07.b64             .github/assets/p3/female_stage_a/part08.b64             .github/assets/p3/female_stage_a/part09.b64             .github/assets/p3/female_stage_a/part10.b64             .github/assets/p3/female_stage_a/part11.b64             .github/assets/p3/female_stage_a/part12.b64             .github/assets/p3/female_stage_a/part13.b64             .github/assets/p3/female_stage_a/part14.b64             .github/assets/p3/female_stage_a/part15a.b64             .github/assets/p3/female_stage_a/part15b.b64             .github/assets/p3/female_stage_a/part16.b64             .github/assets/p3/female_stage_a/part17.b64             .github/assets/p3/female_stage_a/part18.b64             .github/assets/p3/female_stage_a/part19.b64             .github/assets/p3/female_stage_a/part20.b64             | tr -d '\r\n\t ' | base64 --decode > "$PACK"
          test "$(stat -c%s "$PACK")" -eq 44838
          echo "6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  $PACK" | sha256sum --check --strict
          unzip -q "$PACK" -d .

      - name: Import project scripts and resources
        run: godot --headless --path godot --import

      - name: Parse O8 changed code and test
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            res://src/simulation/building/alchemy_recipe_registry.gd \
            res://src/simulation/building/building_system.gd \
            res://src/simulation/state/building_state.gd \
            res://src/simulation/resource/resource_registry.gd \
            res://src/simulation/needs/needs_system.gd \
            res://src/simulation/workforce/workforce_system.gd \
            res://src/simulation/core/simulation_scheduler.gd \
            res://src/presentation/p3/sect_map_presentation.gd \
            res://src/presentation/p3_1_landscape_sect.gd \
            res://src/presentation/p3_2_landscape_sect.gd \
            res://tests/presentation/p3_o8_alchemy_loop_test.gd; do
            godot --headless --path godot --check-only --script "$script"
          done

      - name: Run O8 Alchemy Field-Pill-Consumer acceptance
        run: godot --headless --path godot -s res://tests/presentation/p3_o8_alchemy_loop_test.gd

      - name: Run O7 Linh Lam regression
        run: godot --headless --path godot -s res://tests/presentation/p3_o7_linh_forest_test.gd

      - name: Run existing P3.6A scene regression
        run: godot --headless --path godot -s res://tests/presentation/p3_6a_playable_slice_test.gd

      - name: Parse BAL-04A medicine, economy and Save regression scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            res://src/simulation/building/medicine_catalogue_v2.gd \
            res://src/simulation/building/medicine_allocation_v2.gd \
            res://src/simulation/building/spirit_crop_registry.gd \
            res://src/simulation/building/medicine_resource_source_v1.gd \
            res://src/simulation/building/sx01_pill_policy.gd \
            res://src/simulation/cultivation/b3_pill_satiety_v1.gd \
            res://src/simulation/combat/b3_medical_autoplay_v1.gd \
            res://tests/simulation/sx01_pill_policy_test.gd \
            res://tests/simulation/sx02_medicine_catalogue_test.gd \
            res://tests/simulation/sx02_medicine_runtime_test.gd \
            res://tests/simulation/sx02_alchemy_profession_availability_test.gd \
            res://tests/simulation/sx03_source_consumer_stage_contract_test.gd \
            res://tests/simulation/sx03_bal04a_legacy_save_medicine_test.gd \
            res://tests/simulation/sx03_satiety_cap_migration_test.gd \
            res://tests/simulation/v57_sx_contract_guard_test.gd; do
            godot --headless --path godot --check-only --script "$script"
          done

      - name: Run BAL-04A source-to-consumer and medicine contract
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot -s res://tests/simulation/sx02_medicine_catalogue_test.gd
          godot --headless --path godot -s res://tests/simulation/sx03_source_consumer_stage_contract_test.gd
          godot --headless --path godot -s res://tests/simulation/sx03_bal04a_legacy_save_medicine_test.gd
          godot --headless --path godot -s res://tests/simulation/sx03_satiety_cap_migration_test.gd
          godot --headless --path godot -s res://tests/simulation/v57_sx_contract_guard_test.gd
          godot --headless --path godot -s res://tests/simulation/sx01_pill_policy_test.gd
          godot --headless --path godot -s res://tests/simulation/sx02_medicine_runtime_test.gd
          godot --headless --path godot -s res://tests/simulation/sx02_alchemy_profession_availability_test.gd

      - name: Run B3 satiety and CARE original regressions
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot -s res://tests/simulation/b3_pill_satiety_test.gd
          godot --headless --path godot -s res://tests/simulation/b3_care_pills_autohunt_test.gd
