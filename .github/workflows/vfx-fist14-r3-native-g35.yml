name: VFX FIST14 R3 original RGBA Godot G3.5 STOP
on:
  workflow_dispatch:
  push:
    branches: [integration/pve-p0-playable-ui-20261103]
    paths:
      - '.github/workflows/vfx-fist14-r3-native-g35.yml'
      - 'godot/labs/combat_lab/fist14/r3/**'
      - 'godot/tests/labs/combat_lab/vfx_fist14_r3_contract_test.gd'
      - 'docs/operations/vfx_packets/FIST14_R3_NATIVE_G35_V4.json'
permissions:
  contents: read
jobs:
  g35-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      GODOT_AUDIO_DRIVER: Dummy
      GODOT_RENDERING_DRIVER: opengl3
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 and proof dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Standard Ubuntu Actions images already ship with ffmpeg, xvfb and unzip.
          # Avoid apt-get update on every VFX proof when these are installed.
          for tool in ffmpeg xvfb-run unzip; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq ffmpeg xvfb unzip
              break
            fi
          done
          python3 -m venv /tmp/fist14-r3-venv
          /tmp/fist14-r3-venv/bin/python -m pip install --disable-pip-version-check --quiet 'pillow>=10' 'numpy>=1.26'
          echo '/tmp/fist14-r3-venv/bin' >> "$GITHUB_PATH"
          curl --fail --location --retry 3 -o /tmp/godot472.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot472.zip' | sha256sum --check --strict
          unzip -q /tmp/godot472.zip -d /tmp
          sudo install -m0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p "$RUNNER_TEMP/fist14-r3"
          godot --version | tee "$RUNNER_TEMP/fist14-r3/engine.txt"
          printf 'HEAD=%s\nG35_STOP_ONLY\nART_PENDING\nPVE_HOLD\n' "$GITHUB_SHA" > "$RUNNER_TEMP/fist14-r3/meta.txt"
      - name: Restore approved unchanged actor fixture for isolated LAB only
        shell: bash
        run: |
          set -euo pipefail
          cat .github/assets/p3/female_stage_a/part{01..14}.b64 .github/assets/p3/female_stage_a/part15a.b64 .github/assets/p3/female_stage_a/part15b.b64 .github/assets/p3/female_stage_a/part{16..20}.b64 | tr -d '\r\n\t ' | base64 --decode > /tmp/tmb_stage_a_pack.zip
          echo '6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  /tmp/tmb_stage_a_pack.zip' | sha256sum --check --strict
          unzip -q /tmp/tmb_stage_a_pack.zip -d .
      - name: Verify original SOURCE SHA and V4 packet and RGBA atlases
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/fist14-r3"
          echo 'e0006ceb6208cb7cb037d2909f2ca9d27e10f63b7d71871f53b6b55f4903b7b5  godot/labs/combat_lab/fist14/r3/source/fist14_original_rgba_1774x887.png' | sha256sum --check --strict
          python3 tools/qa/validate_vfx_v4_packet.py --stage packet --packet docs/operations/vfx_packets/FIST14_R3_NATIVE_G35_V4.json | tee "$d/packet.log"
          python3 tools/qa/validate_vfx_v4_packet.py --stage assets --packet docs/operations/vfx_packets/FIST14_R3_NATIVE_G35_V4.json | tee "$d/assets.log"
      - name: Strict native import and moving-target focused contract
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/fist14-r3"
          bash tools/qa/run_godot_strict.sh --headless --path godot --import 2>&1 | tee "$d/import.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/combat_lab/fist14/r3/liep_huyet_truy_da_r3.gd 2>&1 | tee "$d/parse.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/labs/combat_lab/vfx_fist14_r3_contract_test.gd 2>&1 | tee "$d/godot-focused.log"
          grep -Fq 'FIST14_R3_FOCUSED_RESULT=PASS failures=0' "$d/godot-focused.log"
      - name: G3.5 native STOP three true 1280x720 frames on moving WALK monster
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/fist14-r3"
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 --write-movie "$d/native.avi" --quit-after 108 res://labs/combat_lab/fist14/r3/liep_huyet_truy_da_r3.tscn 2>&1 | tee "$d/godot-preflight.log"
          grep -Fq 'FIST14_R3_G35_NATIVE_READY' "$d/godot-preflight.log"
          ffmpeg -y -hide_banner -loglevel error -i "$d/native.avi" -pix_fmt yuv420p -c:v libx264 -crf 16 "$d/v4-fist14-r3-native.mp4"
          ffmpeg -y -hide_banner -loglevel error -ss 0.22 -i "$d/v4-fist14-r3-native.mp4" -frames:v 1 "$d/v4-charge.png"
          ffmpeg -y -hide_banner -loglevel error -ss 0.65 -i "$d/v4-fist14-r3-native.mp4" -frames:v 1 "$d/v4-peak.png"
          ffmpeg -y -hide_banner -loglevel error -ss 0.90 -i "$d/v4-fist14-r3-native.mp4" -frames:v 1 "$d/v4-contact.png"
          python3 tools/qa/validate_vfx_v4_packet.py --stage evidence --packet docs/operations/vfx_packets/FIST14_R3_NATIVE_G35_V4.json --out "$d" --sha "$GITHUB_SHA" | tee "$d/v4-evidence.log"
          printf 'G3.5_TECH_EVIDENCE_CAPTURED\nG3.5_ART_MANUAL_STOP_PENDING\nG3.6_NOT_EXECUTED\nG3.7_NOT_EXECUTED\nG5_FULL_NATIVE_NOT_EXECUTED\nOWNER_PENDING\nPVE_HOLD\n' > "$d/GATES.txt"
          sha256sum "$d"/v4-*.png "$d"/v4-*.mp4 > "$d/SHA256SUMS.txt"
          rm "$d/native.avi"
      - name: Upload first native G3.5 evidence only; no false art PASS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fist14-r3-g35-native-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/fist14-r3/*.txt
            ${{ runner.temp }}/fist14-r3/*.log
            ${{ runner.temp }}/fist14-r3/*.json
            ${{ runner.temp }}/fist14-r3/*.png
            ${{ runner.temp }}/fist14-r3/*.mp4
