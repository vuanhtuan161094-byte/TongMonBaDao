name: DV2-03 Realm Body Progress

on:
  workflow_dispatch:
  push:
    paths:
      - 'godot/src/simulation/cultivation/disciple_realm_progress_v2.gd'
      - 'godot/src/simulation/cultivation/disciple_training_action_v2.gd'
      - 'godot/src/simulation/cultivation/disciple_tuvi_flow_v2.gd'
      - 'godot/src/simulation/cultivation/disciple_body_xp_source_v2.gd'
      - 'godot/src/simulation/cultivation/disciple_body_training_facility_v2.gd'
      - 'godot/src/simulation/building/building_system.gd'
      - 'godot/src/simulation/cultivation/disciple_progression_balance_v2.gd'
      - 'godot/src/simulation/cultivation/disciple_breakthrough_balance_v2.gd'
      - 'godot/src/simulation/cultivation/disciple_training_policy_v2.gd'
      - 'godot/src/simulation/cultivation/disciple_training_content_v2.gd'
      - 'godot/src/simulation/core/simulation_scheduler.gd'
      - 'godot/src/simulation/core/simulation_runtime_clock_v2.gd'
      - 'godot/src/simulation/core/simulation_runtime_owner_v2.gd'
      - 'godot/src/simulation/core/live_game_runtime_v2.gd'
      - 'godot/src/presentation/p3_1_landscape_sect.gd'
      - 'godot/src/presentation/p3_2_landscape_sect.gd'
      - 'godot/src/presentation/disciple_presentation_snapshot_v2.gd'
      - 'godot/src/simulation/ai/decision_system.gd'
      - 'godot/src/simulation/workforce/workforce_system.gd'
      - 'godot/src/simulation/needs/needs_system.gd'
      - 'godot/src/simulation/combat/combat_system.gd'
      - 'godot/src/simulation/recruitment/recruitment_system.gd'
      - 'godot/src/simulation/recruitment/disciple_birth_profile_v2.gd'
      - 'godot/src/simulation/state/sect_state.gd'
      - 'godot/src/simulation/state/disciple_state.gd'
      - 'godot/tests/simulation/dv2_03_realm_body_progress_test.gd'
      - 'godot/tests/simulation/dv2_03_training_actions_test.gd'
      - 'godot/tests/simulation/dv2_03_p2_isolation_test.gd'
      - 'godot/tests/simulation/dv2_03_training_policy_test.gd'
      - 'godot/tests/simulation/dv2_03_body_xp_source_test.gd'
      - 'godot/tests/simulation/dv2_03_f0_source_baseline_test.gd'
      - 'godot/tests/simulation/dv2_03_mine_body_xp_integration_test.gd'
      - 'godot/tests/simulation/dv2_03_ren_than_duong_integration_test.gd'
      - 'godot/tests/simulation/dv2_03_e3_1_training_priority_regression_test.gd'
      - 'godot/tests/presentation/dv2_03_p3_body_training_building_ui_test.gd'
      - 'godot/src/presentation/p3/sect_map_presentation.gd'
      - 'godot/src/presentation/p3_1_landscape_sect.gd'
      - 'godot/tests/simulation/dv2_03_progression_balance_test.gd'
      - 'godot/tests/simulation/dv2_03_breakthrough_balance_test.gd'
      - 'godot/tests/simulation/dv2_03_runtime_clock_test.gd'
      - 'godot/tests/simulation/dv2_03_live_runtime_integration_test.gd'
      - 'godot/tests/presentation/dv2_03_p3_live_runtime_binding_test.gd'
      - 'godot/tests/presentation/dv2_03_disciple_presentation_snapshot_v2_test.gd'
      - 'godot/tests/presentation/dv2_03_p3_v2_disciple_profile_test.gd'
      - 'godot/tests/presentation/p3_2_disciple_ui_test.gd'
      - '.github/workflows/dv2-03-realm-body-progress.yml'

permissions:
  contents: read

jobs:
  dv2-03:
    name: Godot 4.7.2 independent cultivation-body growth gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install official Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum --check --strict
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Print Godot version
        run: godot --version
      - name: Parse complete Godot project
        run: godot --headless --path godot --editor --quit
      - name: DV2-03 dual 30x10 realm progression, breakthrough, save
        run: godot --headless --path godot -s res://tests/simulation/dv2_03_realm_body_progress_test.gd
      - name: DV2-03 Tu Vi scheduler and Body consumer block
        run: godot --headless --path godot -s res://tests/simulation/dv2_03_training_actions_test.gd
      - name: DV2-03M P2 V2 progression and expedition stamina isolation
        run: godot --headless --path godot -s res://tests/simulation/dv2_03_p2_isolation_test.gd
      - name: DV2-03D1 autonomous Tu Vi policy and Body lock
        run: godot --headless --path godot -s res://tests/simulation/dv2_03_training_policy_test.gd
      - name: DV2-03 Body EXP source contract
        run: godot --headless --path godot -s res://tests/simulation/dv2_03_body_xp_source_test.gd
      - name: DV2-03F F0 audited real Body EXP, paid stones, earned map loot baseline
        run: godot --headless --path godot -s res://tests/simulation/dv2_03_f0_source_baseline_test.gd
      - name: DV2-03 real P3.7 mine active-minute Body XP integration
        run: godot --headless --path godot -s res://tests/simulation/dv2_03_mine_body_xp_integration_test.gd
      - name: DV2-03 Rèn Thân Đường paid two-slot consumer
        run: godot --headless --path godot -s res://tests/simulation/dv2_03_ren_than_duong_integration_test.gd
      - name: DV2-03E3.1 slot transfer exclusive training multi-minute ledger
        run: godot --headless --path godot -s res://tests/simulation/dv2_03_e3_1_training_priority_regression_test.gd
      - name: DV2-03E3 interactive map Rèn Thân building and paid slot UI
        run: godot --headless --path godot -s res://tests/presentation/dv2_03_p3_body_training_building_ui_test.gd
      - name: DV2-03 canonical progression balance
        run: godot --headless --path godot -s res://tests/simulation/dv2_03_progression_balance_test.gd
      - name: DV2-03 canonical 29-gate breakthrough balance
        run: godot --headless --path godot -s res://tests/simulation/dv2_03_breakthrough_balance_test.gd
      - name: DV2-03 online offline runtime clock equivalence
        run: godot --headless --path godot -s res://tests/simulation/dv2_03_runtime_clock_test.gd
      - name: DV2-03 live P3 save load offline runtime
        run: godot --headless --path godot -s res://tests/simulation/dv2_03_live_runtime_integration_test.gd
      - name: DV2-03 P3 main scene live runtime binding
        run: godot --headless --path godot -s res://tests/presentation/dv2_03_p3_live_runtime_binding_test.gd
      - name: DV2-03 unified disciple presentation snapshot
        run: godot --headless --path godot -s res://tests/presentation/dv2_03_disciple_presentation_snapshot_v2_test.gd
      - name: DV2-03 authentic V2 disciple profile UI
        run: godot --headless --path godot -s res://tests/presentation/dv2_03_p3_v2_disciple_profile_test.gd
      - name: P3.2 legacy disciple UI compatibility
        run: godot --headless --path godot -s res://tests/presentation/p3_2_disciple_ui_test.gd
