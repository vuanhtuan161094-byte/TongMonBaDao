name: Publish player encyclopedia (GitHub Pages)

on:
  push:
    branches:
      - integration/pve-p0-playable-ui-20261103
    paths:
      - 'wiki/guide.html'
      - 'wiki/guide.css'
      - 'wiki/unified.css'
      - 'wiki/guide.js'
      - 'wiki/characters.html'
      - 'wiki/characters.css'
      - 'wiki/characters.js'
      - 'wiki/traits.html'
      - 'wiki/traits.css'
      - 'wiki/traits.js'
      - 'wiki/audit.html'
      - 'wiki/audit.css'
      - 'wiki/audit.js'
      - 'wiki/data/game_system_audit.json'
      - 'wiki/data/game_items_audit.json'
      - 'wiki/data/combat_stats_reference.json'
      - 'wiki/data/mind_nature_reference.json'
      - 'wiki/data/trait_effect_audit.json'
      - 'tools/wiki/tests/test_trait_effect_audit.py'
      - 'tools/wiki/tests/test_game_audit.py'
      - 'tools/wiki/tests/test_unified_wiki.cjs'
      - 'wiki/data/character_reference.json'
      - 'wiki/data/catalog.json'
      - '.github/workflows/wiki-player-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-player-wiki-audit-20261118"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Player encyclopedia deploy is independent of the game release environment.
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate 101 trait audit and browser scripts
        shell: bash
        run: |
          python3 tools/wiki/tests/test_trait_effect_audit.py
          python3 tools/wiki/tests/test_game_audit.py
          node --check wiki/traits.js
          node --check wiki/audit.js
          node --check wiki/guide.js
          node --check tools/wiki/tests/test_unified_wiki.cjs
          node tools/wiki/tests/test_unified_wiki.cjs
          node --check wiki/characters.js
      - name: Assemble public player-only site
        shell: bash
        run: |
          mkdir -p _site/wiki/data
          cp wiki/guide.html wiki/guide.css wiki/guide.js _site/wiki/
          cp wiki/unified.css _site/wiki/
          cp wiki/characters.html _site/wiki/
          cp wiki/traits.html _site/wiki/
          cp wiki/audit.html _site/wiki/
          cp wiki/data/game_system_audit.json wiki/data/game_items_audit.json _site/wiki/data/
          cp wiki/data/combat_stats_reference.json _site/wiki/data/
          cp wiki/data/mind_nature_reference.json _site/wiki/data/
          cp wiki/data/trait_effect_audit.json _site/wiki/data/
          cp wiki/data/character_reference.json _site/wiki/data/
          cp wiki/data/catalog.json _site/wiki/data/
          printf '%s\n' '<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=wiki/guide.html"><title>Tàng Kinh Các</title></head><body><a href="wiki/guide.html">Mở Bách khoa Tông Môn Bá Đạo</a></body></html>' > _site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
