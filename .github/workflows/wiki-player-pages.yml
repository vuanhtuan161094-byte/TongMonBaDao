name: Publish canonical One Game and Tàng Kinh Các (GitHub Pages)

on:
  push:
    branches:
      - integration/pve-p0-playable-ui-20261103
    paths:
      - 'godot/**'
      # QA-only changes do not modify the exported game or canonical Web.
      - '!godot/tests/**'
      - '!godot/outputs/**'
      - 'wiki/**'
      - 'tools/wiki/tests/**'
      - 'tools/vfx/stage_vfx_web_review.py'
      - 'tools/vfx/build_native_video_review.py'
      - 'tools/vfx/build_sword_batch9.py'
      - 'tools/vfx/check_web_visual.cjs'
      - 'tools/vfx/check_web_sword02_r1e.cjs'
      - 'docs/operations/vfx_web_catalog_v1.json'
      - 'tools/qa/check_as48_sword_bridge_sources.py'
      - '.github/workflows/wiki-player-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Always deploy to the SAME canonical Pages site, never a second preview.
# Other PR #72 writers commit while the 4.7.2 Web export / VFX Chromium check
# is running. Do NOT cancel a running exact-SHA visual gate on every push.
# GitHub concurrency retains one active and the latest pending run; the pending
# run catches up to newest HEAD after the active run finishes.
concurrency:
  group: "pages-one-canonical-tongmonbadao"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout PR #72 canonical source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate current player encyclopedia
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/wiki/tests/test_trait_effect_audit.py
          python3 tools/wiki/tests/test_game_audit.py
          node --check wiki/traits.js
          node --check wiki/audit.js
          node --check wiki/guide.js
          node tools/wiki/tests/test_unified_wiki.cjs
          node --check wiki/characters.js

      - name: Assemble ONE Pages site (game + existing Wiki)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/wiki/data _site/play
          cp wiki/guide.html wiki/guide.css wiki/guide.js _site/wiki/
          cp wiki/unified.css _site/wiki/
          cp wiki/characters.html wiki/characters.css wiki/characters.js _site/wiki/
          cp wiki/traits.html wiki/traits.css wiki/traits.js _site/wiki/
          cp wiki/audit.html wiki/audit.css wiki/audit.js _site/wiki/
          cp wiki/data/game_system_audit.json wiki/data/game_items_audit.json _site/wiki/data/
          cp wiki/data/combat_stats_reference.json _site/wiki/data/
          cp wiki/data/mind_nature_reference.json _site/wiki/data/
          cp wiki/data/trait_effect_audit.json _site/wiki/data/
          cp wiki/data/character_reference.json _site/wiki/data/
          cp wiki/data/catalog.json _site/wiki/data/
          # ONE public play entry point; Wiki remains at its existing stable URL.
          printf '%s\n' '<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=play/"><title>Tông Môn Bá Đạo — Chơi Game</title></head><body><a href="play/">Chơi Tông Môn Bá Đạo</a></body></html>' > _site/index.html
          touch _site/.nojekyll

      - name: Cache verified Godot 4.7.2 Web no-threads template
        id: godot-template-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_release.zip
            ~/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_debug.zip
          key: tmb-godot-4.7.2-web-nothreads-release-debug-f298490b-v2

      - name: Download verified official Godot 4.7.2 Linux editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tmb-godot"
          curl -fL --retry 3 --connect-timeout 30 -o "$RUNNER_TEMP/tmb-godot/godot.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/tmb-godot/godot.zip" | sha256sum -c -
          unzip -oq "$RUNNER_TEMP/tmb-godot/godot.zip" -d "$RUNNER_TEMP/tmb-godot"
          chmod +x "$RUNNER_TEMP/tmb-godot/Godot_v4.7.2-stable_linux.x86_64"
          "$RUNNER_TEMP/tmb-godot/Godot_v4.7.2-stable_linux.x86_64" --headless --version

      - name: Download verified official 4.7.2 release and debug Web templates when not cached
        if: steps.godot-template-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 30 -o "$RUNNER_TEMP/tmb-godot/templates.tpz" \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  $RUNNER_TEMP/tmb-godot/templates.tpz" | sha256sum -c -
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          for variant in release debug; do
            template="$HOME/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_${variant}.zip"
            unzip -p "$RUNNER_TEMP/tmb-godot/templates.tpz" "templates/web_nothreads_${variant}.zip" > "$template"
            test -s "$template"
            unzip -tq "$template" | tail -n 1
          done

      - name: Verify both Godot Web templates before export (including cache hit)
        shell: bash
        run: |
          set -euo pipefail
          for variant in release debug; do
            test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_${variant}.zip"
          done

      - name: Import and export the CURRENT Godot main game to Web
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/tmb-godot/Godot_v4.7.2-stable_linux.x86_64"
          test -s godot/export_presets.cfg
          test -s godot/scenes/p3/p3_2_landscape_sect.tscn
          mkdir -p "$RUNNER_TEMP/one-game-export-proof"
          "$GODOT" --headless --path godot --editor --import 2>&1 | tee "$RUNNER_TEMP/one-game-export-proof/import.log"
          "$GODOT" --headless --path godot --export-release "Web" "$GITHUB_WORKSPACE/_site/play/index.html" 2>&1 | tee "$RUNNER_TEMP/one-game-export-proof/export.log"
          test -s _site/play/index.html
          test -s _site/play/index.js
          test -s _site/play/index.wasm
          test -s _site/play/index.pck
          # Keep the exported Godot files together, not as copy-by-commit releases.
          printf '%s\n' "Source PR #72 HEAD: $GITHUB_SHA" > _site/play/build-info.txt
          printf '%s\n' "Godot 4.7.2 / WebGL2 / single-thread" >> _site/play/build-info.txt
          du -h _site/play/index.*
          find _site/play -maxdepth 1 -type f | sort

      - name: Preserve main game export diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-game-export-proof-${{ github.sha }}
          path: ${{ runner.temp }}/one-game-export-proof/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload canonical playable Web export independently of review gate
        uses: actions/upload-artifact@v4
        with:
          name: one-game-playable-web-${{ github.sha }}
          path: _site/play/
          retention-days: 14
          if-no-files-found: error

      - name: Assemble mobile native video review on same site
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/vfx/build_native_video_review.py --source godot --destination _site/vfx/videos --sha "$GITHUB_SHA"
          test -s _site/vfx/videos/index.html

      - name: Export isolated VFX Web review into SAME canonical Pages site
        shell: bash
        run: |
          set -euo pipefail
          # Review is a small ephemeral build-only Godot staging project.
          # It does NOT create a second game, branch or published site.
          python3 tools/qa/check_as48_sword_bridge_sources.py
          python3 -m pip install Pillow==11.3.0
          python3 tools/vfx/stage_vfx_web_review.py \
            --source godot --destination "$RUNNER_TEMP/tmb-vfx-web-stage"
          GODOT="$RUNNER_TEMP/tmb-godot/Godot_v4.7.2-stable_linux.x86_64"
          STAGE="$RUNNER_TEMP/tmb-vfx-web-stage"
          "$GODOT" --headless --path "$STAGE" --editor --import 2>&1 | tee "$RUNNER_TEMP/vfx-web-import.log"
          if grep -Eiq 'SCRIPT ERROR|Parse Error|Failed to load script|Failed to load resource' "$RUNNER_TEMP/vfx-web-import.log"; then exit 1; fi
          "$GODOT" --headless --path "$STAGE" --check-only \
            --script res://labs/visual_bridge_v1/as48_sword_anchor_lab.gd
          "$GODOT" --headless --path "$STAGE" --check-only \
            --script res://labs/visual_bridge_v1/vfx_web_review_hub.gd
          "$GODOT" --headless --path "$STAGE" --check-only \
            --script res://labs/combat_lab/sword_human_phi_kiem_truy_anh/r2b/phi_kiem_r2b_lab.gd
          "$GODOT" --headless --path "$STAGE" --check-only \
            --script res://labs/combat_lab/sword_human_phi_kiem_truy_anh/r2b/phi_kiem_r2b_vfx_layer.gd
          # This short isolated logic check does not render a new MP4.
          "$GODOT" --headless --path "$STAGE" --fixed-fps 60 \
            --quit-after 216 res://labs/visual_bridge_v1/vfx_web_review_hub.tscn \
            2>&1 | tee "$RUNNER_TEMP/vfx-web-logic-smoke.log"
          grep -Fq 'BRIDGE_AS48_READY actor=AS48' "$RUNNER_TEMP/vfx-web-logic-smoke.log"
          grep -Fq 'BRIDGE_AS48_END=PASS' "$RUNNER_TEMP/vfx-web-logic-smoke.log"
          grep -Fq 'VFX_SWORD_R2B_SOURCE_LOADED=PASS' "$RUNNER_TEMP/vfx-web-logic-smoke.log"
          for phase in CHARGE PROJECTILE CONTACT; do
            grep -Fq "VFX_SWORD_R2B_PHASE_${phase}=PASS" "$RUNNER_TEMP/vfx-web-logic-smoke.log"
          done
          mkdir -p "$GITHUB_WORKSPACE/_site/vfx"
          "$GODOT" --headless --path "$STAGE" \
            --export-release "Web" "$GITHUB_WORKSPACE/_site/vfx/index.html"
          for ext in html js wasm pck; do
            test -s "$GITHUB_WORKSPACE/_site/vfx/index.$ext"
          done
          printf 'SOURCE_SHA=%s\nWEB_REVIEW_ONLY=true\nLAB_EVENT_SOURCE=SYNTHETIC\nFRONT_ONLY=true\nG3_SOURCE=ORIGINAL_RGBA_OWNER_PROVISIONAL\nOWNER_ART=PROVISIONAL_NOT_FINAL\nPVE=HOLD\n' \
            "$GITHUB_SHA" > "$GITHUB_WORKSPACE/_site/vfx/build-info.txt"
          du -h "$GITHUB_WORKSPACE"/_site/vfx/index.*
          echo "VFX_WEB_REVIEW_EXPORT_PASS exact_sha=$GITHUB_SHA"

      - name: Browser visual smoke — actual AS48 + monster pixels, never just UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vfx-web-browser-proof"
          npm install --silent --no-fund --no-audit \
            --prefix "$RUNNER_TEMP/vfx-browser-deps" \
            playwright-core@1.56.1 pngjs@7.0.0
          CHROME_EXECUTABLE="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_EXECUTABLE" || { echo "CHROMIUM_MISSING_FAIL_CLOSED"; exit 1; }
          python3 -m http.server 8679 --bind 127.0.0.1 \
            --directory "$GITHUB_WORKSPACE/_site" \
            > "$RUNNER_TEMP/vfx-web-browser-proof/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          NODE_PATH="$RUNNER_TEMP/vfx-browser-deps/node_modules" \
            CHROME_EXECUTABLE="$CHROME_EXECUTABLE" \
            VFX_REVIEW_URL="http://127.0.0.1:8679/vfx/" \
            VFX_BROWSER_PROOF="$RUNNER_TEMP/vfx-web-browser-proof" \
            node tools/vfx/check_web_visual.cjs
          # R1E is a second selector entry, not a new site. Test its own URL
          # and actual screenshot phase deltas before deploying the same /vfx/.
          NODE_PATH="$RUNNER_TEMP/vfx-browser-deps/node_modules" \
            CHROME_EXECUTABLE="$CHROME_EXECUTABLE" \
            VFX_REVIEW_URL="http://127.0.0.1:8679/vfx/" \
            VFX_BROWSER_PROOF="$RUNNER_TEMP/vfx-web-browser-proof" \
            node tools/vfx/check_web_sword02_r1e.cjs
          grep -Fq '"verdict": "R1E_BROWSER_REAL_AS48_VFX_PASS"' \
            "$RUNNER_TEMP/vfx-web-browser-proof/R1E-browser-result.json"
          grep -Fq '"verdict": "BROWSER_CANVAS_AND_VFX_PHASES_PASS"' \
            "$RUNNER_TEMP/vfx-web-browser-proof/result.json"
          echo "VFX_WEB_3_PHASE_VISUAL_GATE=PASS"

      - name: Upload minimal VFX browser screenshot proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfx-web-browser-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: ${{ runner.temp }}/vfx-web-browser-proof/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload ONE combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy ONE canonical Pages site after uploaded artifact is finalized
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: build
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Allow artifact metadata to become available across jobs
        shell: bash
        run: sleep 20
      - name: Deploy ONE canonical Web game + Wiki
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
