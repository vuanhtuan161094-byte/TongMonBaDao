name: VFX-TAL-07 | Lien Diem Phan Gioi original fire lotus Godot movie
on:
  workflow_dispatch:
  push:
    branches: [integration/pve-p0-playable-ui-20261103]
    paths:
      - '.github/workflows/vfx-tal-07-lien-diem-phan-gioi.yml'
      - 'tools/vfx/paint_tal07_lien_diem.py'
      - 'tools/vfx/hf02_r5_source_painted.py'
      - 'tools/vfx/hf02_r6_talisman_motion.py'
      - 'godot/labs/combat_lab/talisman07/**'
      - 'godot/tests/labs/combat_lab/vfx_tal07_contract_test.gd'
permissions:
  contents: read
jobs:
  fire-lotus-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_AUDIO_DRIVER: Dummy
      GODOT_RENDERING_DRIVER: opengl3
    steps:
      - uses: actions/checkout@v4
      - name: Install SHA-pinned Godot 4.7.2 and first-party art tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg unzip python3-pil python3-numpy
          curl --fail --location --retry 3 -o /tmp/godot472.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot472.zip' | sha256sum --check --strict
          unzip -q /tmp/godot472.zip -d /tmp
          sudo install -m0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p "$RUNNER_TEMP/vfx-tal07"
          godot --version | tee "$RUNNER_TEMP/vfx-tal07/engine.txt"
          printf 'SOURCE_SHA=%s\nSKILL_ID=tmb.skill.talisman.hoa_phu.active_02.human\nCIRCLE_CAP3_RADIUS2.1\nPROJECTILE_SPEED_ZERO\nOWNER_VISUAL_PENDING\nPVE_INTEGRATION_HOLD\nV63_OFF\nNO_RIG\n' "$GITHUB_SHA" > "$RUNNER_TEMP/vfx-tal07/metadata.txt"
      - name: Bake four original transparent sprite flipbooks and alpha/pose QA
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-tal07"
          /usr/bin/python3 tools/vfx/paint_tal07_lien_diem.py | tee "$d/sprite-bake.log"
          grep -Fxq 'HF02_SPRITE_ALPHA_GATE=PASS' "$d/sprite-bake.log"
          /usr/bin/python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib
          p=Path('godot/labs/combat_lab/talisman07/assets')
          specs=[
              ('tal07_lotus_flipbook.webp',2048,1152,512,384,12),
              ('tal07_seal_flipbook.webp',1024,768,256,256,12),
              ('tal07_ground_flipbook.webp',2048,512,512,256,8),
              ('tal07_contact_flipbook.webp',1024,512,256,256,8)]
          for name,w,h,cw,ch,frames in specs:
              im=Image.open(p/name).convert('RGBA')
              assert im.size == (w,h),name
              assert im.getchannel('A').getextrema()[0]==0,('alpha',name)
              hashes=set()
              for i in range(frames):
                  x=i%4*cw;y=i//4*ch
                  hashes.add(hashlib.sha256(im.crop((x,y,x+cw,y+ch)).tobytes()).hexdigest())
              assert len(hashes)==frames,(name,len(hashes))
              print('HF02_UNIQUE_ALPHA_FRAMES',name,len(hashes))
          print('HF02_ATLAS_QA=PASS')
          PY
          sha256sum godot/labs/combat_lab/talisman07/assets/tal07_*.webp > "$d/ATLAS_SHA256SUMS.txt"
          # Do not normalize or modify unrelated legacy CRLF files in this art-only runner.\n          git status --porcelain -- godot/labs/combat_lab/talisman07 tools/vfx/paint_tal07_lien_diem.py | tee \"$d/art_scope_status.txt\"
      - name: Bake R5 genuine luminous source-painted fire atlases and validate alpha
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-tal07"
          /usr/bin/python3 tools/vfx/hf02_r5_source_painted.py | tee "$d/r5-bake.log"
          grep -Fxq 'HF02_R5_PAINTED_REBUILD_PASS' "$d/r5-bake.log"
          /usr/bin/python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib,base64,io
          root=Path('godot/labs/combat_lab/talisman07')
          raw=base64.b64decode((root/'art_sources/hf02_r5_owner_fire_blast.webp.b64').read_text().strip(),validate=True)
          src=Image.open(io.BytesIO(raw))
          assert src.size==(320,91),src.size
          print('HF02_R5_MASTER_SOURCE_SHA256',hashlib.sha256(raw).hexdigest())
          specs=[
              ('tal07_r5_lotus_atlas.webp',2048,1152,512,384,12),
              ('tal07_r5_seal_atlas.webp',1024,768,256,256,12),
              ('tal07_r5_contact_atlas.webp',1024,512,256,256,8)]
          for name,w,h,cw,ch,n in specs:
              im=Image.open(root/'assets'/name).convert('RGBA')
              assert im.size==(w,h),name
              assert im.getchannel('A').getextrema()[0]==0,name
              hashes=set()
              for i in range(n):
                  x=i%4*cw;y=i//4*ch
                  crop=im.crop((x,y,x+cw,y+ch))
                  hashes.add(hashlib.sha256(crop.tobytes()).hexdigest())
                  assert crop.getchannel('A').getextrema()[1]>0,(name,i)
              assert len(hashes)==n,(name,len(hashes))
              print('HF02_R5_SOURCE_PAINTED_ALPHA_PASS',name,n)
          print('HF02_R5_ATLAS_GATE=PASS')
          PY
          sha256sum godot/labs/combat_lab/talisman07/assets/tal07_r5_*.webp > "$d/R5_ASSET_SHA256SUMS.txt"
      - name: Bake R6 gold-red talisman charge and cosmetic flight sprite atlases
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-tal07"
          /usr/bin/python3 tools/vfx/hf02_r6_talisman_motion.py 2>&1 | tee "$d/r6-charge-flight.log"
          grep -Fq 'HF02_R6_ART_ATLAS_GATE_PASS' "$d/r6-charge-flight.log"
          sha256sum godot/labs/combat_lab/talisman07/assets/tal07_r6_*.webp > "$d/R6_ATLAS_SHA256SUMS.txt"
      - name: Restore existing unchanged Stage A character asset overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .github/assets/p3/female_stage_a/part{01..14}.b64 .github/assets/p3/female_stage_a/part15a.b64 .github/assets/p3/female_stage_a/part15b.b64 .github/assets/p3/female_stage_a/part{16..20}.b64 | tr -d '\r\n\t ' | base64 --decode > /tmp/tmb_stage_a_pack.zip
          test "$(stat -c%s /tmp/tmb_stage_a_pack.zip)" -eq 44838
          echo '6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  /tmp/tmb_stage_a_pack.zip' | sha256sum --check --strict
          unzip -q /tmp/tmb_stage_a_pack.zip -d .
      - name: Godot 4.7.2 exact-SHA strict import parse focused contract
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-tal07"
          bash tools/qa/run_godot_strict.sh --headless --path godot --import 2>&1 | tee "$d/import.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/combat_lab/talisman07/lien_diem_phan_gioi.gd 2>&1 | tee "$d/parse.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/labs/combat_lab/vfx_tal07_contract_test.gd 2>&1 | tee "$d/test.log"
          grep -Fq 'VFX_TAL07_FOCUSED_RESULT=PASS failures=0' "$d/test.log"
      - name: Native Godot GL Compatibility 1280x720 198 frames GIF and 14 stills
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-tal07"
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 --write-movie "$d/lien-diem-phan-gioi.avi" --quit-after 198 res://labs/combat_lab/talisman07/lien_diem_phan_gioi.tscn 2>&1 | tee "$d/movie.log"
          test -s "$d/lien-diem-phan-gioi.avi"
          ffmpeg -y -hide_banner -loglevel error -i "$d/lien-diem-phan-gioi.avi" -pix_fmt yuv420p -c:v libx264 -crf 16 -movflags +faststart "$d/lien-diem-phan-gioi.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,avg_frame_rate -of default=noprint_wrappers=1 "$d/lien-diem-phan-gioi.mp4" | tee "$d/dimensions.txt"
          grep -Fxq 'width=1280' "$d/dimensions.txt"
          grep -Fxq 'height=720' "$d/dimensions.txt"
          for at in 0.12 0.30 0.43 0.58 0.70 0.86 1.10 1.28 1.38 1.49 1.62 1.84 2.22 2.75; do
            ffmpeg -y -hide_banner -loglevel error -ss "$at" -i "$d/lien-diem-phan-gioi.mp4" -frames:v 1 "$d/frame-$at.png"
          done
          ffmpeg -y -hide_banner -loglevel error -i "$d/lien-diem-phan-gioi.mp4" -vf 'fps=5,scale=320:180,tile=5x3:nb_frames=15' -frames:v 1 "$d/contact-sheet.png"
          ffmpeg -y -hide_banner -loglevel error -i "$d/lien-diem-phan-gioi.mp4" -vf 'fps=10,scale=640:-1:flags=lanczos' -loop 0 "$d/lien-diem-phan-gioi.gif"
          sha256sum "$d/"*.mp4 "$d/"*.gif "$d/"*.png > "$d/SHA256SUMS.txt"
          grep -Fq 'VFX_TAL07_READY' "$d/movie.log"
          rm "$d/lien-diem-phan-gioi.avi"
      - name: Upload exact-SHA genuine Godot evidence and generated source art
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfx-tal07-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/vfx-tal07/*.log
            ${{ runner.temp }}/vfx-tal07/*.txt
            ${{ runner.temp }}/vfx-tal07/*.png
            ${{ runner.temp }}/vfx-tal07/*.mp4
            ${{ runner.temp }}/vfx-tal07/*.gif
            godot/labs/combat_lab/talisman07/assets/tal07_*.webp
