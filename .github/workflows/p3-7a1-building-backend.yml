name: P3.7 Backend

on:
  workflow_dispatch:
  push:
    paths:
      - 'godot/src/simulation/state/building_state.gd'
      - 'godot/src/simulation/building/building_system.gd'
      - 'godot/src/simulation/building/spirit_crop_registry.gd'
      - 'godot/src/simulation/workforce/character_modifier_system.gd'
      - 'godot/src/simulation/workforce/profession_modifier_system.gd'
      - 'godot/src/simulation/traits/trait_system.gd'
      - 'godot/src/simulation/cultivation/cultivation_system.gd'
      - 'godot/src/simulation/core/p3_7_factory.gd'
      - 'godot/src/simulation/state/simulation_state.gd'
      - 'godot/src/simulation/state/disciple_state.gd'
      - 'godot/src/simulation/workforce/workforce_system.gd'
      - 'godot/src/simulation/core/simulation_scheduler.gd'
      - 'godot/src/simulation/equipment/equipment_system.gd'
      - 'godot/src/simulation/technique/technique_system.gd'
      - 'godot/src/simulation/cultivation/root_refinement_system.gd'
      - 'godot/src/simulation/bloodline/bloodline_system.gd'
      - 'godot/src/simulation/physique/physique_system.gd'
      - 'godot/src/simulation/state/sect_state.gd'
      - 'godot/src/simulation/save/save_service.gd'
      - 'godot/src/simulation/resource/resource_registry.gd'
      - 'godot/src/simulation/resource/warehouse_system.gd'
      - 'godot/tests/simulation/p3_7a1_building_authority_test.gd'
      - 'godot/tests/simulation/p3_7a2_spirit_field_test.gd'
      - 'godot/tests/simulation/p3_7b1_warehouse_test.gd'
      - 'tools/godot/Verify-P3-7A1-Building-Authority.ps1'
      - 'tools/godot/Verify-P3-7A2-Spirit-Field.ps1'
      - 'tools/godot/Verify-P3-7B1-Warehouse.ps1'
      - '.github/workflows/p3-7a1-building-backend.yml'

permissions:
  contents: read

jobs:
  p3-7a1-backend:
    name: Godot 4.7.2 P3.7 latest fast backend gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install official Godot 4.7.2 binary
        shell: bash
        run: |
          set -euo pipefail
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          GODOT_SHA256="cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
          curl --fail --location --retry 3 --output /tmp/godot.zip "$GODOT_URL"
          echo "$GODOT_SHA256  /tmp/godot.zip" | sha256sum --check --strict
          rm -rf /tmp/godot-4.7.2
          mkdir -p /tmp/godot-4.7.2
          unzip -q /tmp/godot.zip -d /tmp/godot-4.7.2
          sudo install -m 0755 /tmp/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Print Godot version
        run: godot --version

      - name: Run latest P3.7 fast backend gate
        shell: pwsh
        run: ./tools/godot/Verify-P3-7B1-Warehouse.ps1 -GodotBin /usr/local/bin/godot

      - name: Run P3.7 full cumulative gate
        shell: pwsh
        run: ./tools/godot/Verify-P3-7B1-Warehouse-Full.ps1 -GodotBin /usr/local/bin/godot
