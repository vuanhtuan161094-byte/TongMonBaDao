name: SX V55 ECO 30-Realm Source Feasibility Gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'godot/data/economy/v55d_30_realm_reference.json'
      - 'godot/tests/simulation/sx_v55_eco_source_gate_30cg_test.gd'
      - 'godot/tests/simulation/sx_v55_bulk_real_chain_save_test.gd'
      - 'godot/tests/simulation/sx_v55_eco_faucet_sink_30d_test.gd'
      - 'godot/tests/presentation/economy_a_landscape_ui_test.gd'
      - 'godot/src/simulation/building/building_system.gd'
      - 'godot/src/simulation/equipment/equipment_system.gd'
      - 'godot/src/simulation/state/sect_state.gd'
      - 'godot/src/simulation/combat/b3_medical_autoplay_v1.gd'
      - 'godot/src/presentation/p3_2_landscape_sect.gd'
      - '.github/workflows/sx-v55-eco-source-gate.yml'
  pull_request:
    paths:
      - 'godot/data/economy/v55d_30_realm_reference.json'
      - 'godot/tests/simulation/sx_v55_eco_source_gate_30cg_test.gd'
      - 'godot/tests/simulation/sx_v55_bulk_real_chain_save_test.gd'
      - 'godot/tests/simulation/sx_v55_eco_faucet_sink_30d_test.gd'
      - 'godot/tests/presentation/economy_a_landscape_ui_test.gd'
      - 'godot/src/simulation/building/building_system.gd'
      - 'godot/src/simulation/equipment/equipment_system.gd'
      - 'godot/src/simulation/state/sect_state.gd'
      - 'godot/src/simulation/combat/b3_medical_autoplay_v1.gd'
      - 'godot/src/presentation/p3_2_landscape_sect.gd'
      - '.github/workflows/sx-v55-eco-source-gate.yml'

permissions:
  contents: read

jobs:
  sx-v55-source-gate:
    name: Official Godot 4.7.2 30-realm design/runtime guard
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install official Godot 4.7.2 binary
        shell: bash
        run: |
          set -euo pipefail
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          GODOT_SHA256="cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
          curl --fail --location --retry 3 --output /tmp/godot.zip "$GODOT_URL"
          echo "$GODOT_SHA256  /tmp/godot.zip" | sha256sum --check --strict
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Confirm official version
        run: godot --version

      - name: Restore canonical female Stage A runtime pack
        shell: bash
        run: |
          set -euo pipefail
          PACK="/tmp/female_normal_v1_stageA_runtime_pack_v2_quant.zip"
          cat .github/assets/p3/female_stage_a/part01.b64 .github/assets/p3/female_stage_a/part02.b64 .github/assets/p3/female_stage_a/part03.b64 .github/assets/p3/female_stage_a/part04.b64 .github/assets/p3/female_stage_a/part05.b64 .github/assets/p3/female_stage_a/part06.b64 .github/assets/p3/female_stage_a/part07.b64 .github/assets/p3/female_stage_a/part08.b64 .github/assets/p3/female_stage_a/part09.b64 .github/assets/p3/female_stage_a/part10.b64 .github/assets/p3/female_stage_a/part11.b64 .github/assets/p3/female_stage_a/part12.b64 .github/assets/p3/female_stage_a/part13.b64 .github/assets/p3/female_stage_a/part14.b64 .github/assets/p3/female_stage_a/part15a.b64 .github/assets/p3/female_stage_a/part15b.b64 .github/assets/p3/female_stage_a/part16.b64 .github/assets/p3/female_stage_a/part17.b64 .github/assets/p3/female_stage_a/part18.b64 .github/assets/p3/female_stage_a/part19.b64 .github/assets/p3/female_stage_a/part20.b64 | tr -d '\r\n\t ' | base64 --decode > "$PACK"
          test "$(stat -c%s "$PACK")" -eq 44838
          echo "6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  $PACK" | sha256sum --check --strict
          unzip -q "$PACK" -d .

      - name: Import project scripts and resources
        run: bash tools/qa/run_godot_strict.sh --headless --path godot --import

      - name: Parse SX V55 ECO source test with strict diagnostics
        run: bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://tests/simulation/sx_v55_eco_source_gate_30cg_test.gd

      - name: Verify exact 30-realm design, 60/90/180 windows, and no fabricated income
        run: bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/simulation/sx_v55_eco_source_gate_30cg_test.gd

      - name: SX V55 real opt-in Five Producer Warehouse Alchemy cold Save
        shell: bash
        run: |
          set -euo pipefail
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://tests/simulation/sx_v55_bulk_real_chain_save_test.gd
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/simulation/sx_v55_bulk_real_chain_save_test.gd

      - name: 1/7/30-day exact-source faucet sink and W2 affordability model
        shell: bash
        run: |
          set -euo pipefail
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://tests/simulation/sx_v55_eco_faucet_sink_30d_test.gd
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/simulation/sx_v55_eco_faucet_sink_30d_test.gd

      - name: Canonical source provenance regression
        run: bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/simulation/sx07_source_provenance_test.gd

      - name: Hall W2 real-payment UI and canonical Save (strict)
        shell: bash
        run: |
          set -euo pipefail
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://tests/presentation/economy_a_landscape_ui_test.gd
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/presentation/economy_a_landscape_ui_test.gd

      - name: B3 legacy CARE intentional-corrupt-save regression
        shell: bash
        run: |
          set -euo pipefail
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://tests/simulation/b3_care_pills_autohunt_test.gd
          # This pre-existing negative-path suite intentionally calls
          # push_error for corrupted Save assertions. Its own 39 checks and
          # exit code are authoritative; strict log-clean mode is unsuitable.
          godot --headless --path godot -s res://tests/simulation/b3_care_pills_autohunt_test.gd

      - name: Existing Economy-A money-warehouse wage regression
        run: bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/simulation/sx_w2_wage_arrears_save_test.gd

      - name: Canonical full P3.7 cumulative regression after all bulk gates
        shell: pwsh
        run: ./tools/godot/Verify-P3-7C1-Foundation-Dan-Tien-Full.ps1 -GodotBin /usr/local/bin/godot
