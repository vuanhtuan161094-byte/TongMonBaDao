name: VIS-01/02 Quality Skin Godot 4.7.2
on:
  push:
    branches:
      - integration/pve-p0-playable-ui-20261103
    paths:
      - 'godot/src/presentation/art05_onegame_cinematic_ui.gd'
      - 'godot/src/presentation/uiux/dan_tien_screen_b1_v1.gd'
      - 'godot/src/presentation/uiux/sect_quality_visual_v1.gd'
      - 'godot/src/presentation/uiux/sect_prismatic_motes_v1.gd'
      - 'godot/src/presentation/uiux/shaders/vis0*.gdshader'
      - 'godot/tests/presentation/vis01_02_quality_visual_test.gd'
      - 'godot/tests/presentation/vis02_06_compact_material_test.gd'
      - 'godot/src/presentation/uiux/sect_equipment_material_v1.gd'
      - 'godot/src/presentation/p3/v63_combat_hud_v1.gd'
      - 'godot/art/uiux/quality/vis02_heaven_crystal_frame.svg'
      - 'godot/art/tmb_original_v1/**'
      - 'godot/art/tmb_approved_v4/**'
      - 'godot/art/tmb_original_buildings_v5/**'
      - 'godot/src/presentation/p3/tmb_original_building_art_v5.gd'
      - 'godot/tests/presentation/vis08_original_buildings_test.gd'
      - 'godot/src/presentation/p3/tmb_approved_building_art_v4.gd'
      - 'godot/tests/presentation/vis07_r4_owner_approved_paths_test.gd'
      - 'godot/src/presentation/p3/tmb_original_world_art_v1.gd'
      - 'godot/src/presentation/p3/sect_isometric_world_v1.gd'
      - 'godot/src/presentation/uiux/sect_facility_art_v2.gd'
      - 'godot/tests/presentation/vis07_original_environment_test.gd'
      - '.github/workflows/vis01-02-quality-skin.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum --check --strict
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Verify engine and exact SHA
        run: |
          godot --version
          git rev-parse HEAD
      - name: Import project on Compatibility
        run: godot --headless --path godot --import
      - name: Strict parse VIS test
        run: bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://tests/presentation/vis01_02_quality_visual_test.gd
      - name: Strict parse real B1 Dẫn Tiên UI dependency
        run: bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://src/presentation/uiux/dan_tien_screen_b1_v1.gd
      - name: Run VIS focused contract
        run: |
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/presentation/vis01_02_quality_visual_test.gd
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/presentation/vis02_06_compact_material_test.gd
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/presentation/vis07_original_environment_test.gd
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/presentation/vis07_r4_owner_approved_paths_test.gd
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/presentation/vis08_original_buildings_test.gd
