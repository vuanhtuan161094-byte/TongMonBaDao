name: P3.7A1 Full Regression Once

on:
  push:
    paths:
      - '.github/workflows/p3-7a1-full-once.yml'

permissions:
  contents: read

jobs:
  full-regression:
    name: Godot 4.7.2 P0-P2.12 + P3.7A1
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install official Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          GODOT_SHA256="cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
          curl --fail --location --retry 3 --output /tmp/godot.zip "$GODOT_URL"
          echo "$GODOT_SHA256  /tmp/godot.zip" | sha256sum --check --strict
          mkdir -p /tmp/godot-4.7.2
          unzip -q /tmp/godot.zip -d /tmp/godot-4.7.2
          sudo install -m 0755 /tmp/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Run cumulative full gate
        shell: pwsh
        env:
          GODOT_BIN: /usr/local/bin/godot
        run: ./tools/godot/Verify-P3-7A1-Building-Authority-Full.ps1
