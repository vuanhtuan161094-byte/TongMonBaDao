name: VFX RESEARCH 01 | isolated Godot 4.7.2 visual A/B/C
on:
  workflow_dispatch:
  push:
    branches:
      - integration/pve-p0-playable-ui-20261103
    paths:
      - '.github/workflows/vfx-research01-godot.yml'
      - 'godot/labs/combat_lab/research01/**'
      - 'godot/tests/labs/combat_lab/research01_contract_test.gd'
permissions:
  contents: read
jobs:
  research01:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_AUDIO_DRIVER: Dummy
      GODOT_RENDERING_DRIVER: opengl3
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official Godot 4.7.2, Xvfb and ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y xvfb ffmpeg
          curl -fL --retry 3 -o /tmp/Godot_4.7.2.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/Godot_4.7.2.zip" | sha256sum -c -
          unzip -q /tmp/Godot_4.7.2.zip -d /tmp
          sudo install -m0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
          mkdir -p "$RUNNER_TEMP/vfx_research01"
          printf 'CODE_SHA=%s\nGODOT=%s\nRENDERER=gl_compatibility\nQA_MODE=ISOLATED_SUMMON_SHIM_NON_COMMITTED\n' "$GITHUB_SHA" "$(godot --version)" > "$RUNNER_TEMP/vfx_research01/metadata.txt"
      - name: Restore canonical Stage A preview dependencies
        shell: bash
        run: |
          set -euo pipefail
          cat .github/assets/p3/female_stage_a/part{01..14}.b64 .github/assets/p3/female_stage_a/part15a.b64 .github/assets/p3/female_stage_a/part15b.b64 .github/assets/p3/female_stage_a/part{16..20}.b64 | tr -d '\r\n\t ' | base64 --decode > /tmp/tmb_stage_a_pack.zip
          test "$(stat -c%s /tmp/tmb_stage_a_pack.zip)" -eq 44838
          echo "6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  /tmp/tmb_stage_a_pack.zip" | sha256sum --check --strict
          unzip -q /tmp/tmb_stage_a_pack.zip -d .
      - name: Isolated upstream summon parse unblock - checkout only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("godot/src/simulation/combat/v63_summon_skill_combat_system.gd")
          s=p.read_text()
          before="var candidate := origin+offset"
          after="var candidate: Vector2 = origin+(offset as Vector2)"
          if s.count(before)!=1:
              raise SystemExit("Upstream summon code changed; remove temporary shim, do NOT overwrite gameplay")
          p.write_text(s.replace(before,after))
          print("Ephemeral CI-only parse shim, not code SHA and not full-project clean pass")
          PY
      - name: Strict import and focused LAB contract
        shell: bash
        run: |
          set -euo pipefail
          bash tools/qa/run_godot_strict.sh --headless --path godot --import 2>&1 | tee "$RUNNER_TEMP/vfx_research01/import.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/combat_lab/research01/research01_arena.gd 2>&1 | tee "$RUNNER_TEMP/vfx_research01/parse.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/labs/combat_lab/research01_contract_test.gd 2>&1 | tee "$RUNNER_TEMP/vfx_research01/contract.log"
          grep -q 'VFX_RESEARCH01_FOCUSED_RESULT=PASS' "$RUNNER_TEMP/vfx_research01/contract.log"
      - name: Godot actual 1280x720 scenes: baseline, crescent, afterimage
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx_research01"
          for mode in baseline crescent afterimage; do
            export TMB_VFX_RESEARCH_MODE="$mode"
            xvfb-run -a -s "-screen 0 1280x720x24" \
              bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 \
              --fixed-fps 60 --write-movie "$d/$mode.avi" --quit-after 168 \
              res://labs/combat_lab/research01/research01_arena.tscn \
              2>&1 | tee "$d/$mode.log"
            test -s "$d/$mode.avi"
            ffmpeg -y -hide_banner -loglevel error -i "$d/$mode.avi" -pix_fmt yuv420p -c:v libx264 -crf 17 "$d/$mode.mp4"
            ffmpeg -y -hide_banner -loglevel error -ss 1.67 -i "$d/$mode.mp4" -frames:v 1 "$d/$mode.png"
            ffmpeg -y -hide_banner -loglevel error -i "$d/$mode.mp4" -vf "fps=4,scale=320:180,tile=4x3:nb_frames=12" -frames:v 1 "$d/${mode}_timeline.png"
            test -s "$d/$mode.png"
            fps="$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of default=nw=1:nk=1 "$d/$mode.mp4")"
            echo "$mode fps=$fps" >> "$d/metadata.txt"
            test "$fps" = "60/1"
            rm "$d/$mode.avi"
          done
          ffmpeg -y -hide_banner -loglevel error -i "$d/baseline.png" -i "$d/crescent.png" -i "$d/afterimage.png" \
            -filter_complex "[0:v][1:v][2:v]hstack=inputs=3,scale=1920:360" -frames:v 1 "$d/three_way_impact_comparison.png"
          sha256sum "$d/"*.mp4 "$d/"*.png > "$d/SHA256SUMS.txt"
      - name: External repo source/demo compatibility probes (non-gating evidence)
        shell: bash
        run: |
          set -u
          d="$RUNNER_TEMP/vfx_research01"
          mkdir -p /tmp/vfx_sources
          cat > "$d/external_repos.tsv" <<'EOF'
          REEBOO|REEBO0/godot-stylized-2d-vfx-lite|0fb078c21e463fe16e93ee25dbb8ca970196e2d3|.|res://demo/demo.tscn|MIT
          GDQuest|gdquest-demos/godot-visual-effects|647a8f1bcecd0b8634f2abe045abb8433b3b3149|godot|res://main/demo_selector.tscn|code MIT / art CC-BY-NC-SA
          PSC|PSCactux/godot-effects-lab|6af3c856ad8745a655121d11d55a60a03201a145|.|res://effects/juice/juice.tscn|MIT
          Burst|uzkbwza/BurstParticles2D|f0fa6e06fa01d975bac0cc5f3f23375d0ae4360b|.|res://BurstParticles2D-demo/MultiParticleExample.tscn|MIT
          EOF
          while IFS='|' read -r name remote sha subdir scene license; do
            localdir="/tmp/vfx_sources/$name"
            echo "REFERENCE=$name PIN=$sha LICENSE=$license" >> "$d/metadata.txt"
            if ! timeout 75 git clone --quiet --depth 1 "https://github.com/$remote.git" "$localdir" 2>>"$d/external_demo.log"; then
              echo "$name CLONE_FAIL" >> "$d/external_demo.log"
              continue
            fi
            cd "$localdir"
            git fetch -q --depth 1 origin "$sha" 2>>"$d/external_demo.log" || true
            if ! git checkout -q --detach "$sha"; then
              echo "$name PIN_FAIL" >> "$d/external_demo.log"
              continue
            fi
            cd "$GITHUB_WORKSPACE"
            project="$localdir/$subdir"
            if timeout 95 godot --headless --rendering-method gl_compatibility --path "$project" --import > "$d/$name-import.log" 2>&1; then
              echo "$name Godot4.7.2_COMPAT_IMPORT_EXIT_0" >> "$d/external_demo.log"
              if timeout 55 xvfb-run -a -s "-screen 0 1280x720x24" godot --rendering-method gl_compatibility --path "$project" \
                --resolution 1280x720 --fixed-fps 60 --write-movie "$d/$name-demo.avi" --quit-after 80 "$scene" > "$d/$name-demo.log" 2>&1; then
                ffmpeg -y -hide_banner -loglevel error -ss 0.85 -i "$d/$name-demo.avi" -frames:v 1 "$d/$name-demo.png" || true
                echo "$name EXTERNAL_DEMO_RENDER_EXIT_0" >> "$d/external_demo.log"
              else
                echo "$name EXTERNAL_DEMO_RENDER_FAIL" >> "$d/external_demo.log"
              fi
              rm -f "$d/$name-demo.avi"
            else
              echo "$name COMPAT_IMPORT_FAIL" >> "$d/external_demo.log"
            fi
          done < "$d/external_repos.tsv"
          cd "$GITHUB_WORKSPACE"
      - name: Verify that VFX Lab did not alter external runtime
        shell: bash
        run: |
          set -euo pipefail
          # The *only* checkout modification is the declared disposable shim.
          git diff --name-only | tee "$RUNNER_TEMP/vfx_research01/checkout_diff.txt"
          test "$(git diff --name-only)" = "godot/src/simulation/combat/v63_summon_skill_combat_system.gd"
          echo "VISUAL_ART_APPROVAL=OWNER_PENDING" >> "$RUNNER_TEMP/vfx_research01/metadata.txt"
          echo "WINDOWS_ANDROID_PHYSICAL=PENDING_USER" >> "$RUNNER_TEMP/vfx_research01/metadata.txt"
      - name: Upload raw Godot movie, still, external demo and QA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfx-research01-${{ github.sha }}
          path: |
            ${{ runner.temp }}/vfx_research01/*.png
            ${{ runner.temp }}/vfx_research01/*.mp4
            ${{ runner.temp }}/vfx_research01/*.log
            ${{ runner.temp }}/vfx_research01/*.txt
            ${{ runner.temp }}/vfx_research01/*.tsv
            ${{ runner.temp }}/tmb_godot_strict/*.log
          retention-days: 14
          if-no-files-found: warn
