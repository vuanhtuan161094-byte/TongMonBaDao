name: Sword02 R1E focused Web Chromium pixel QA
on:
  push:
    branches: [integration/pve-p0-playable-ui-20261103]
    paths:
      - '.github/workflows/sword02-r1e-web-chromium.yml'
      - 'godot/labs/combat_lab/sword_human_kiem_vu_hoi_phong/r1e/**'
      - 'godot/labs/visual_bridge_v1/vfx_web_review_hub.gd'
      - 'tools/vfx/check_web_sword02_r1e.cjs'
      - 'docs/operations/vfx_web_catalog_v1.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout only R1E and existing canonical VFX hub sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            godot/labs/visual_bridge_v1
            godot/labs/combat_lab/sword_human_phi_kiem_truy_anh
            godot/labs/combat_lab/sword_human_kiem_vu_hoi_phong/r1e
            godot/labs/combat_lab/combat_lab_v16_impact_glow.gdshader
            godot/labs/character_family/aschar_v9_batch1
            godot/assets/actors/v5_sa_monster_1113031_1
            godot/tests/labs/combat_lab/vfx_sword02_r1e_contract_test.gd
            tools/vfx/stage_vfx_web_review.py
            tools/vfx/check_web_sword02_r1e.cjs
            tools/vfx/check_web_visual.cjs
            tools/qa/check_sword02_r1e_source.py
            docs/operations/vfx_web_catalog_v1.json
      - name: Validate exact owner-approved R1E source and stage existing single Web hub
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow==12.3.0
          python3 tools/qa/check_sword02_r1e_source.py
          python3 tools/vfx/stage_vfx_web_review.py --source godot --destination "$RUNNER_TEMP/r1e-web-stage"
      - name: Cache verified official Godot 4.7.2 Web no-threads templates
        id: templates-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_release.zip
            ~/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_debug.zip
          key: tmb-godot-4.7.2-web-nothreads-release-debug-f298490b-v2
      - name: Download official pinned Godot 4.7.2 editor and templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r1e-editor" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -fL --retry 3 -o "$RUNNER_TEMP/r1e-editor/editor.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/r1e-editor/editor.zip" | sha256sum -c -
          unzip -oq "$RUNNER_TEMP/r1e-editor/editor.zip" -d "$RUNNER_TEMP/r1e-editor"
          GODOT="$RUNNER_TEMP/r1e-editor/Godot_v4.7.2-stable_linux.x86_64"
          chmod +x "$GODOT"
          "$GODOT" --headless --version
          if [[ ! -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_release.zip" ]]; then
            curl -fL --retry 3 -o "$RUNNER_TEMP/r1e-editor/templates.tpz" \
              "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
            echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  $RUNNER_TEMP/r1e-editor/templates.tpz" | sha256sum -c -
            for variant in release debug; do
              unzip -p "$RUNNER_TEMP/r1e-editor/templates.tpz" "templates/web_nothreads_${variant}.zip" \
                > "$HOME/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_${variant}.zip"
            done
          fi
          for v in release debug; do test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_${v}.zip"; done
      - name: Strict isolated R1E Godot Web export — no second site deployed
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/r1e-editor/Godot_v4.7.2-stable_linux.x86_64"
          STAGE="$RUNNER_TEMP/r1e-web-stage"
          mkdir -p "$RUNNER_TEMP/r1e-only-web/vfx" "$RUNNER_TEMP/r1e-browser-proof"
          "$GODOT" --headless --path "$STAGE" --editor --import 2>&1 | tee "$RUNNER_TEMP/r1e-browser-proof/import.log"
          if grep -Eiq 'SCRIPT ERROR|Parse Error|Failed to load script|Failed to load resource' "$RUNNER_TEMP/r1e-browser-proof/import.log"; then
            echo R1E_WEB_IMPORT_ERROR
            exit 1
          fi
          "$GODOT" --headless --path "$STAGE" --check-only --script res://labs/visual_bridge_v1/vfx_web_review_hub.gd
          "$GODOT" --headless --path "$STAGE" --check-only --script res://labs/combat_lab/sword_human_kiem_vu_hoi_phong/r1e/r1e_lab.gd
          "$GODOT" --headless --path "$STAGE" --export-release Web "$RUNNER_TEMP/r1e-only-web/vfx/index.html"
          for ext in html js wasm pck; do test -s "$RUNNER_TEMP/r1e-only-web/vfx/index.$ext"; done
          printf 'SOURCE_SHA=%s\nR1E_WEB_CHECK_ONLY=true\nNOT_A_SECOND_DEPLOYMENT=true\nPVE=HOLD\n' "$GITHUB_SHA" \
            > "$RUNNER_TEMP/r1e-browser-proof/source-sha.txt"
      - name: Chromium actual canvas and phase-pixel differential — R1E exact SHA
        shell: bash
        run: |
          set -euo pipefail
          npm install --silent --no-audit --no-fund --prefix "$RUNNER_TEMP/r1e-webdeps" playwright-core@1.56.1 pngjs@7.0.0
          CHROME_EXECUTABLE="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_EXECUTABLE" || { echo 'CHROMIUM_UNAVAILABLE_FAIL_CLOSED'; exit 1; }
          python3 -m http.server 8681 --bind 127.0.0.1 --directory "$RUNNER_TEMP/r1e-only-web" \
            > "$RUNNER_TEMP/r1e-browser-proof/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          NODE_PATH="$RUNNER_TEMP/r1e-webdeps/node_modules" \
            CHROME_EXECUTABLE="$CHROME_EXECUTABLE" \
            VFX_REVIEW_URL="http://127.0.0.1:8681/vfx/" \
            VFX_BROWSER_PROOF="$RUNNER_TEMP/r1e-browser-proof" \
            node tools/vfx/check_web_sword02_r1e.cjs
          grep -Fq '"verdict": "R1E_BROWSER_REAL_AS48_VFX_PASS"' \
            "$RUNNER_TEMP/r1e-browser-proof/R1E-browser-result.json"
      - name: Upload exact-SHA R1E Chromium evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sword02-r1e-web-proof-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/r1e-browser-proof/
