name: TMB R6 slash receipt integration
on:
  push:
    branches: [integration/pve-p0-playable-ui-20261103]
    paths:
      - 'tools/vfx_acquisition_20261127/build_slash_r6.py'
      - 'tools/vfx_acquisition_20261127/r6_exact_skill_queue.json'
      - '.github/workflows/tmb-vfx-external-slash-r6.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  slash:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build actual source atlas and exact runtime index
        run: |
          python -m pip install Pillow==11.3.0
          python tools/vfx_acquisition_20261127/build_slash_r6.py
      - name: Preserve four atlases and index in PR branch
        run: |
          set -euo pipefail
          git add -- godot/assets/p3/vfx/external_slash_r6 godot/data/presentation/pve_external_slash_r6.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin integration/pve-p0-playable-ui-20261103
            test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || { echo "Concurrent HEAD change: no push"; exit 1; }
            git commit -m "VFX R6: four CC0 slash atlases and 16 gated exact hit bindings"
            git push origin HEAD:refs/heads/integration/pve-p0-playable-ui-20261103
          fi
      - name: Install native Godot capture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth ffmpeg libgl1-mesa-dri
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum -c -
          unzip -oq /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Native real-hit movie, exact source contracts
        run: |
          set -euo pipefail
          G=/tmp/Godot_v4.7.2-stable_linux.x86_64
          O="$RUNNER_TEMP/slash-r6"
          mkdir -p "$O"
          cp outputs/external_slash_r6/build_receipt.json "$O/"
          git rev-parse HEAD > "$O/captured_head.txt"
          "$G" --headless --path godot --editor --import 2>&1 | tee "$O/import.log"
          "$G" --headless --path godot --script res://tests/presentation/pve_factory_r2_source_contract_test.gd 2>&1 | tee "$O/factory.log"
          "$G" --headless --path godot --script res://tests/presentation/pve_external_auxiliary_vfx_test.gd 2>&1 | tee "$O/aux.log"
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24" "$G" --path godot --resolution 1280x720 --audio-driver Dummy --fixed-fps 20 --write-movie "$O/slash.avi" res://labs/combat_lab/external_vfx_library_20261127/combat_review.tscn -- "$O/receipts.json" --slash-r6 2>&1 | tee "$O/capture.log"
          ffmpeg -y -v error -i "$O/slash.avi" -c:v libx264 -pix_fmt yuv420p -movflags +faststart "$O/slash.mp4"
          rm "$O/slash.avi"
          python -c 'import json,sys; a=json.load(open(sys.argv[1])); print("SLASH_REAL_RECEIPTS",sum(x["real_visual_receipt"] for x in a),"/",len(a)); assert len(a)==16; assert all(x["real_visual_receipt"] and x["actor_draw_ok"] and x["synthetic_events"]==0 for x in a)' "$O/receipts.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slash-r6-native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/slash-r6/
            godot/assets/p3/vfx/external_slash_r6/
            godot/data/presentation/pve_external_slash_r6.json
            outputs/external_slash_r6/
          retention-days: 14
  summon-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire 7 direction-packed wyvern sprite atlases and frame definitions
        run: |
          python -m pip install Pillow==11.3.0
          python tools/vfx_acquisition_20261127/acquire_summon_r6.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: summon-source-r6-${{ github.sha }}
          path: outputs/external_summon_r6/
          retention-days: 14
