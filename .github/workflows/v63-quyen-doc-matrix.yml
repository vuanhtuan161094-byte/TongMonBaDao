      - 'godot/data/combat/v63_content_registry.json'
      - 'godot/tests/simulation/v65_poison_combat_contract_test.gd'
      - 'godot/tests/simulation/skill_all_catalogue_integrity_test.gd'
      - 'godot/src/simulation/combat/v63_*.gd'
      - 'godot/src/presentation/v63_skill_presentation_catalog_v1.gd'
      - 'godot/src/presentation/p3/v63_original_combat_vfx_v1.gd'
      - 'godot/src/presentation/p3/map_battle_world_layer_v2.gd'
      - 'godot/src/simulation/combat/v63_formation_skill_combat_system.gd'
      - 'godot/data/combat/v63_formation_combat_catalog.json'
      - 'godot/data/combat/v63_formation_registry_extension.json'
      - 'godot/data/combat/v63_summon_registry_extension.json'
      - 'godot/data/presentation/v63_formation_presentation_manifest_v1.json'
      - 'godot/data/presentation/v63_summon_presentation_manifest_v1.json'
      - 'godot/tests/simulation/v63_s8_formation_skill_test.gd'
      - 'godot/tests/simulation/v63_s9_summon_skill_test.gd'
      - '.github/workflows/v63-quyen-doc-matrix.yml'

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install SHA-pinned Godot 4.7.2 official
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum --check --strict
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Restore pinned Source A runtime art needed for project import
        shell: bash
        run: |
          set -euo pipefail
          PACK="/tmp/female_normal_v1_stageA_runtime_pack_v2_quant.zip"
          cat \
            .github/assets/p3/female_stage_a/part01.b64 \
            .github/assets/p3/female_stage_a/part02.b64 \
            .github/assets/p3/female_stage_a/part03.b64 \
            .github/assets/p3/female_stage_a/part04.b64 \
            .github/assets/p3/female_stage_a/part05.b64 \
            .github/assets/p3/female_stage_a/part06.b64 \
            .github/assets/p3/female_stage_a/part07.b64 \
            .github/assets/p3/female_stage_a/part08.b64 \
            .github/assets/p3/female_stage_a/part09.b64 \
            .github/assets/p3/female_stage_a/part10.b64 \
            .github/assets/p3/female_stage_a/part11.b64 \
            .github/assets/p3/female_stage_a/part12.b64 \
            .github/assets/p3/female_stage_a/part13.b64 \
            .github/assets/p3/female_stage_a/part14.b64 \
            .github/assets/p3/female_stage_a/part15a.b64 \
            .github/assets/p3/female_stage_a/part15b.b64 \
            .github/assets/p3/female_stage_a/part16.b64 \
            .github/assets/p3/female_stage_a/part17.b64 \
            .github/assets/p3/female_stage_a/part18.b64 \
            .github/assets/p3/female_stage_a/part19.b64 \
            .github/assets/p3/female_stage_a/part20.b64 | tr -d '\r\n\t ' | base64 --decode > "$PACK"
          test "$(stat -c%s "$PACK")" -eq 44838
          echo "6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  $PACK" | sha256sum --check --strict
          unzip -q "$PACK" -d .
      - name: Godot import
        run: godot --headless --path godot --import
      - name: Parse focused tests
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            res://tests/simulation/v63_cung_full_combat_matrix_test.gd \
            res://tests/simulation/tmb_quyen_183_combat_handoff_test.gd \
            res://tests/simulation/v63_doc_full_combat_matrix_test.gd \
            res://tests/simulation/v63_poison_evolution_balance_test.gd \
            res://tests/simulation/v63_poison_six_vs_eight_pve_simulation_test.gd \
            res://tests/simulation/v63_poison_21_profiles_measurement_test.gd \
            res://tests/simulation/v63_all_school_balance_measurement_test.gd \
            res://src/simulation/combat/v63_poison_evolution_v1.gd \
            res://tests/simulation/v65_poison_combat_contract_test.gd \
            res://tests/simulation/skill_all_catalogue_integrity_test.gd \
            res://tests/simulation/v63_d1_content_registry_test.gd \
            res://tests/simulation/v63_skill_presentation_s0_test.gd \
            res://tests/simulation/v63_s1_sword_skill_test.gd \
            res://tests/simulation/v63_s2_blade_skill_test.gd \
             res://tests/simulation/v63_s3_spear_skill_test.gd \
             res://tests/simulation/v63_s4_dual_blade_skill_test.gd \
             res://tests/simulation/v63_s5_palm_skill_test.gd \
             res://tests/simulation/v63_s6_talisman_skill_test.gd \
             res://tests/simulation/v63_s7_curse_skill_test.gd \
             res://tests/simulation/v63_s8_formation_skill_test.gd \
             res://tests/simulation/v63_s9_summon_skill_test.gd; do
            godot --headless --path godot --check-only --script "$script"
          done
      - name: V63 D1 registry and all-off release gate regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot -s res://tests/simulation/v63_d1_content_registry_test.gd 2>&1 | tee /tmp/v63-d1-registry.log
      - name: V63 S0 presentation manifest and 2,196-node ledger regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot -s res://tests/simulation/v63_skill_presentation_s0_test.gd 2>&1 | tee /tmp/v63-s0-presentation.log
      - name: V63 S1 Kiếm regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot -s res://tests/simulation/v63_s1_sword_skill_test.gd 2>&1 | tee /tmp/v63-s1-sword.log
      - name: V63 S2 Đao candidate Combat V2 and branch VFX regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot -s res://tests/simulation/v63_s2_blade_skill_test.gd 2>&1 | tee /tmp/v63-s2-blade.log
      - name: V63 S3 Thương candidate Combat V2, shield and branch VFX regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot -s res://tests/simulation/v63_s3_spear_skill_test.gd 2>&1 | tee /tmp/v63-s3-spear.log
      - name: V63 S4 Song Đao candidate Combat V2, bounded HP trade and branch VFX regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot -s res://tests/simulation/v63_s4_dual_blade_skill_test.gd 2>&1 | tee /tmp/v63-s4-dual-blade.log
      - name: V63 S5 Chưởng candidate Combat V2, support, slow and branch VFX regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot -s res://tests/simulation/v63_s5_palm_skill_test.gd 2>&1 | tee /tmp/v63-s5-palm.log
      - name: V63 S6 Phù candidate Combat V2 gameplay; VFX production held
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot -s res://tests/simulation/v63_s6_talisman_skill_test.gd 2>&1 | tee /tmp/v63-s6-talisman.log
      - name: V63 S7 Chú candidate Combat V2; AI and VFX production held
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot -s res://tests/simulation/v63_s7_curse_skill_test.gd 2>&1 | tee /tmp/v63-s7-curse.log
      - name: V63 S8 Trận candidate Combat V2; owned zones and VFX production held
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot -s res://tests/simulation/v63_s8_formation_skill_test.gd 2>&1 | tee /tmp/v63-s8-formation.log
      - name: Install virtual X11 and software GL for viewport capture
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb libgl1-mesa-dri
      - name: V63 S9 Triệu Hồi: bounded Combat V2 actor, AI, event-linked Godot VFX render and snapshot regression
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --path godot --rendering-method gl_compatibility --resolution 1280x720 -s res://tests/simulation/v63_s9_summon_skill_test.gd 2>&1 | tee /tmp/v63-s9-summon.log
      - name: 183 Quyền per-ID Combat V2 handoff
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot -s res://tests/simulation/tmb_quyen_183_combat_handoff_test.gd 2>&1 | tee /tmp/quyen-183.log
      - name: 183 Độc per-ID Combat V2 matrix
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot -s res://tests/simulation/v63_doc_full_combat_matrix_test.gd 2>&1 | tee /tmp/doc-183.log
      - name: PVB1 Độc Tu 183-family evolution and deterministic candidate mechanics
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot -s res://tests/simulation/v63_poison_evolution_balance_test.gd 2>&1 | tee /tmp/pvb1-poison-183.log
      - name: PVB1 six Divine lineages versus eight genuine monsters
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot -s res://tests/simulation/v63_poison_six_vs_eight_pve_simulation_test.gd 2>&1 | tee /tmp/pvb1-poison-6v8.log
      - name: PVB1 real MapBattleV2 measure 21 profiles x single/three targets
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot -s res://tests/simulation/v63_poison_21_profiles_measurement_test.gd 2>&1 | tee /tmp/pvb1-poison-21x2.log
      - name: SKILL-ALL deterministic 9-branch x 7-profile measurement (normalized fixture)
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot -s res://tests/simulation/v63_all_school_balance_measurement_test.gd 2>&1 | tee /tmp/skill-all-nine-branch-balance.log
      - name: Độc dedicated DoT, ownership and boss contracts
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot -s res://tests/simulation/v65_poison_combat_contract_test.gd 2>&1 | tee /tmp/doc-contract.log
      - name: All 549 V6.3 catalogue ID, name, family and predecessor integrity
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot -s res://tests/simulation/skill_all_catalogue_integrity_test.gd 2>&1 | tee /tmp/skill-all-catalogue.log
      - name: Cung 183-ID regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot -s res://tests/simulation/v63_cung_full_combat_matrix_test.gd 2>&1 | tee /tmp/cung-183.log
      - name: Upload QA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v63-quyen-doc-matrix-logs
          path: |
            /tmp/quyen-183.log
            /tmp/doc-183.log
            /tmp/pvb1-poison-183.log
            /tmp/pvb1-poison-6v8.log
            /tmp/pvb1-poison-21x2.log
            /tmp/skill-all-nine-branch-balance.log
            /tmp/doc-contract.log
            /tmp/cung-183.log
            /tmp/skill-all-catalogue.log
            /tmp/v63-d1-registry.log
            /tmp/v63-s0-presentation.log
            /tmp/v63-s1-sword.log
            /tmp/v63-s2-blade.log
            /tmp/v63-s3-spear.log
            /tmp/v63-s4-dual-blade.log
            /tmp/v63-s5-palm.log
            /tmp/v63-s6-talisman.log
            /tmp/v63-s7-curse.log
            /tmp/v63-s8-formation.log
            /tmp/v63-s9-summon.log
            godot/outputs/v63_s9_summon_*_vfx.png
          if-no-files-found: ignore

  publish-exact-sha-result:
    name: Publish exact-SHA QA link on PR72 (push only)
    needs: [matrix]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - name: Report only if tested SHA is still active PR72 HEAD
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          MATRIX_RESULT: ${{ needs.matrix.result }}
        run: |
          set -euo pipefail
          BRANCH_HEAD="$(gh api repos/${{ github.repository }}/git/ref/heads/integration/pve-p0-playable-ui-20261103 --jq '.object.sha')"
          if [[ "$BRANCH_HEAD" != "$RUN_SHA" ]]; then
            # A documentation-only checkpoint is not a new gameplay SHA.
            # Skip stale runs only when actual Godot/test/workflow paths changed.
            CHANGED="$(gh api "repos/${{ github.repository }}/compare/$RUN_SHA...$BRANCH_HEAD" --jq '.files[].filename')"
            if grep -Eq '^(godot/|.github/workflows/)' <<< "$CHANGED"; then
              echo "Stale gameplay QA SHA $RUN_SHA; newer runtime/test/workflow code at $BRANCH_HEAD."
              exit 0
            fi
            echo "Source tested at $RUN_SHA; only documentation/checkpoint changes through $BRANCH_HEAD."
          fi
          BODY="PVB1_GODOT_CI_REPORT | exact SHA \`$RUN_SHA\` | V63 matrix result: \`$MATRIX_RESULT\` | [run #$RUN_ID](https://github.com/${{ github.repository }}/actions/runs/$RUN_ID). Full job logs and 183-ID artifacts must be inspected before calling gameplay PASS. Linux official Godot only; Windows/Android pending."
          gh api --method POST "repos/${{ github.repository }}/issues/72/comments" -f body="$BODY"
