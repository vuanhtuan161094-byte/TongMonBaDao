  push:
    branches:
      - integration/pve-p0-playable-ui-20261103
    paths:
      - 'godot/tests/simulation/tmb_quyen_183_combat_handoff_test.gd'
      - 'godot/tests/simulation/v63_doc_full_combat_matrix_test.gd'
      - 'godot/tests/simulation/v63_poison_evolution_balance_test.gd'
      - 'godot/tests/simulation/v63_poison_six_vs_eight_pve_simulation_test.gd'
      - 'godot/tests/simulation/v63_poison_21_profiles_measurement_test.gd'
      - 'godot/tests/simulation/v63_all_school_balance_measurement_test.gd'
      - 'godot/data/combat/v63_*combat_catalog.json'
      - 'godot/data/presentation/v63_skill_presentation_manifest_v1.json'
