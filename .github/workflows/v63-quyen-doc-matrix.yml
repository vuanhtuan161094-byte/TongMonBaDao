      - 'godot/tests/simulation/v63_d1_content_registry_test.gd'
      - 'godot/tests/simulation/v63_skill_presentation_s0_test.gd'
      - 'godot/tests/presentation/v63_skill_presentation_s0_test.gd'
      - 'godot/tests/simulation/v63_s1_sword_skill_test.gd'
      - 'godot/tests/simulation/v63_s2_blade_skill_test.gd'
      - 'godot/tests/simulation/v63_s3_spear_skill_test.gd'
      - 'godot/tests/simulation/v63_s4_dual_blade_skill_test.gd'
