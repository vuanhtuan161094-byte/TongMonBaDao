name: VFX Poison Basic Human R2 | GIF-motion → painted-alpha V4.2.1
on:
  workflow_dispatch:
  push:
    branches: [integration/pve-p0-playable-ui-20261103]
    paths:
      - 'tools/vfx/generate_poison_basic_human_v2.py'
      - 'tools/qa/validate_vfx_v4_packet.py'
      - 'godot/labs/combat_lab/poison_basic_human_v2/*.gd'
      - 'godot/labs/combat_lab/poison_basic_human_v2/*.tscn'
      - 'godot/tests/labs/combat_lab/vfx_poison_basic_human_r2_contract_test.gd'
      - 'docs/operations/vfx_packets/POISON_BASIC_HUMAN_R2_V4_PREFLIGHT.json'
      - 'docs/operations/VFX_POISON_BASIC_HUMAN_RGBA_R2_20261116.md'
      - '.github/workflows/vfx-poison-basic-human-r2-native.yml'
permissions:
  contents: write
jobs:
  poison-basic-human-r2-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_AUDIO_DRIVER: Dummy
      GODOT_RENDERING_DRIVER: opengl3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Pin official Godot 4.7.2 and tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y unzip ffmpeg xvfb python3-pil python3-numpy
          python3 -c 'from PIL import Image; import numpy; print("POISON_BASIC_R2_PIL_NUMPY_READY")'
          command -v ffmpeg && command -v xvfb-run
          curl --fail --location --retry 3 -o /tmp/godot472.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot472.zip' | sha256sum --check --strict
          unzip -q /tmp/godot472.zip -d /tmp
          sudo install -m0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p "$RUNNER_TEMP/poisonbasic2"
          godot --version | tee "$RUNNER_TEMP/poisonbasic2/engine.txt"
          printf 'EXACT_SHA=%s\nSTATUS=G35_TECH_PENDING\nOWNER_VISUAL_PENDING\nPVE_HOLD\nV63_OFF\nCODE_PAINTED_RASTER_SOURCE\nNO_RIG\n' "$GITHUB_SHA" > "$RUNNER_TEMP/poisonbasic2/metadata.txt"
      - name: Bake first-party botanical brush masters and 22 original poses, validate V4
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/poisonbasic2"
          python3 tools/vfx/generate_poison_basic_human_v2.py 2>&1 | tee "$d/bake.log"
          python3 tools/qa/validate_vfx_v4_packet.py --stage packet --packet docs/operations/vfx_packets/POISON_BASIC_HUMAN_R2_V4_PREFLIGHT.json | tee "$d/v4-packet.log"
          python3 tools/qa/validate_vfx_v4_packet.py --stage assets --packet docs/operations/vfx_packets/POISON_BASIC_HUMAN_R2_V4_PREFLIGHT.json | tee "$d/v4-assets.log"
          sha256sum godot/labs/combat_lab/poison_basic_human_v2/assets/atlas/*.png godot/labs/combat_lab/poison_basic_human_v2/assets/master/*.png > "$d/atlas-sha256.txt"
      - name: Restore original Stage A actor fixture for isolated lab QA
        run: |
          set -euo pipefail
          cat .github/assets/p3/female_stage_a/part{01..14}.b64 .github/assets/p3/female_stage_a/part15a.b64 .github/assets/p3/female_stage_a/part15b.b64 .github/assets/p3/female_stage_a/part{16..20}.b64 | tr -d '\r\n\t ' | base64 --decode > /tmp/tmb_stage_a_pack.zip
          echo '6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  /tmp/tmb_stage_a_pack.zip' | sha256sum --check --strict
          unzip -q /tmp/tmb_stage_a_pack.zip -d .
      - name: Godot 4.7.2 strict import parse and moving-target contract
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/poisonbasic2"
          bash tools/qa/run_godot_strict.sh --headless --path godot --import 2>&1 | tee "$d/import.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/combat_lab/poison_basic_human_v2/doc_cham_thuong_thuc.gd 2>&1 | tee "$d/parse.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/labs/combat_lab/vfx_poison_basic_human_r2_contract_test.gd 2>&1 | tee "$d/godot-focused.log"
          grep -Fq 'VFX_POISON_BASIC_R2_RESULT=PASS failures=0' "$d/godot-focused.log"
      - name: V4 G3.5 native 1280x720 3 frames charge peak moving contact
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/poisonbasic2"
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 --write-movie "$d/preflight.avi" --quit-after 73 res://labs/combat_lab/poison_basic_human_v2/doc_cham_thuong_thuc.tscn 2>&1 | tee "$d/godot-preflight.log"
          grep -Fq 'VFX_POISON_BASIC_R2_READY' "$d/godot-preflight.log"
          ffmpeg -y -hide_banner -loglevel error -i "$d/preflight.avi" -pix_fmt yuv420p -c:v libx264 -crf 16 -movflags +faststart "$d/v4-poison-basic-human-r2-native.mp4"
          ffmpeg -y -hide_banner -loglevel error -ss 0.08 -i "$d/v4-poison-basic-human-r2-native.mp4" -frames:v 1 "$d/v4-charge.png"
          ffmpeg -y -hide_banner -loglevel error -ss 0.42 -i "$d/v4-poison-basic-human-r2-native.mp4" -frames:v 1 "$d/v4-peak.png"
          ffmpeg -y -hide_banner -loglevel error -ss 0.78 -i "$d/v4-poison-basic-human-r2-native.mp4" -frames:v 1 "$d/v4-contact.png"
          python3 tools/qa/validate_vfx_v4_packet.py --stage evidence --packet docs/operations/vfx_packets/POISON_BASIC_HUMAN_R2_V4_PREFLIGHT.json --out "$d" --sha "$GITHUB_SHA" | tee "$d/v4-evidence.log"
          sha256sum "$d/v4-poison-basic-human-r2-native.mp4" "$d/v4-"*.png > "$d/G35-SHA256.txt"
          rm "$d/preflight.avi"
      - name: Short true-native attack-only movie AFTER manual G3.5 art gate
        if: contains(github.event.head_commit.message, '[POISON_BASIC_R2_G35_ART_OK]')
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/poisonbasic2"
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 --write-movie "$d/attack.avi" --quit-after 78 res://labs/combat_lab/poison_basic_human_v2/doc_cham_thuong_thuc.tscn 2>&1 | tee "$d/full-movie.log"
          grep -Fq 'VFX_POISON_BASIC_R2_READY' "$d/full-movie.log"
          ffmpeg -y -hide_banner -loglevel error -i "$d/attack.avi" -pix_fmt yuv420p -c:v libx264 -crf 16 -movflags +faststart "$d/POISON_BASIC_R2-attack.mp4"
          for t in 0.08 0.08 0.08 0.27 0.35 0.40 0.42 0.63 0.68 0.71 0.78 0.90 0.95 1.10; do
            ffmpeg -y -hide_banner -loglevel error -ss "$t" -i "$d/POISON_BASIC_R2-attack.mp4" -frames:v 1 "$d/frame-$t.png"
          done
          ffmpeg -y -hide_banner -loglevel error -i "$d/POISON_BASIC_R2-attack.mp4" -vf 'fps=8,scale=640:-1:flags=lanczos' -loop 0 "$d/POISON_BASIC_R2-attack.gif"
          sha256sum "$d/POISON_BASIC_R2-attack.mp4" "$d/POISON_BASIC_R2-attack.gif" "$d"/frame-*.png > "$d/ATTACK-SHA256.txt"
          rm "$d/attack.avi"
      - name: Preserve original generated alpha masters and atlases in existing PR
        if: success() && github.event_name == 'push'
        run: |
          set -euo pipefail
          branch='integration/pve-p0-playable-ui-20261103'
          folder='godot/labs/combat_lab/poison_basic_human_v2/assets'
          mkdir -p "$RUNNER_TEMP/poisonbasic2/saved"
          cp -R "$folder"/. "$RUNNER_TEMP/poisonbasic2/saved/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin "$branch"
            latest="$(git rev-parse FETCH_HEAD)"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" "$latest"; then echo BRANCH_REWRITTEN_ABORT; exit 0; fi
            if test -n "$(git diff --name-only "$GITHUB_SHA" "$latest" -- tools/vfx/generate_poison_basic_human_v2.py godot/labs/combat_lab/poison_basic_human_v2/ .github/workflows/vfx-poison-basic-human-r2-native.yml)"; then
              echo POISON_BASIC_R2_CONCURRENT_SOURCE_MODIFIED_ABORT
              exit 0
            fi
            git reset --hard "$latest"
            mkdir -p "$folder"
            cp -R "$RUNNER_TEMP/poisonbasic2/saved"/. "$folder/"
            git add "$folder"/atlas/*.png "$folder"/master/*.png
            if git diff --cached --quiet; then echo POISON_BASIC_R2_ART_ALREADY_STORED; exit 0; fi
            git commit -m 'art(poisonbasic2): store code-painted luminous basic metal needle masters and 22 true RGBA poses'
            if git push origin "HEAD:refs/heads/$branch"; then echo "POISON_BASIC_R2_ART_COMMIT=$(git rev-parse HEAD)" | tee "$RUNNER_TEMP/poisonbasic2/tracked-assets.txt"; exit 0; fi
          done
          echo POISON_BASIC_R2_ART_PUSH_CONFLICT
          exit 1
      - name: Upload native evidence; human art gate remains pending
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poison-basic-human-r2-v4-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/poisonbasic2/*.log
            ${{ runner.temp }}/poisonbasic2/*.txt
            ${{ runner.temp }}/poisonbasic2/*.json
            ${{ runner.temp }}/poisonbasic2/*.png
            ${{ runner.temp }}/poisonbasic2/*.mp4
            ${{ runner.temp }}/poisonbasic2/*.gif
            godot/labs/combat_lab/poison_basic_human_v2/assets/**/*.png
            godot/labs/combat_lab/poison_basic_human_v2/assets/atlas/*.png
