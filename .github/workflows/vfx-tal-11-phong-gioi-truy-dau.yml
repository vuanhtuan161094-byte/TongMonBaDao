name: VFX-TAL-11 | PAF01 Phong Gioi Truy Dau native Godot 4.7.2 movie
on:
  workflow_dispatch:
  push:
    branches: [integration/pve-p0-playable-ui-20261103]
    paths:
      - '.github/workflows/vfx-tal-11-phong-gioi-truy-dau.yml'
      - 'tools/vfx/paf01_r1_wind_mark.py'
      - 'tools/vfx/paf01_r6_illustrated_paper.py'
      - 'godot/labs/combat_lab/talisman11/**'
      - 'godot/tests/labs/combat_lab/vfx_tal11_contract_test.gd'
      - 'docs/operations/vfx_packets/PAF01_V4_PREFLIGHT.json'
permissions:
  contents: read
jobs:
  paf01-native-godot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_AUDIO_DRIVER: Dummy
      GODOT_RENDERING_DRIVER: opengl3
      PACKET: docs/operations/vfx_packets/PAF01_V4_PREFLIGHT.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin original Godot 4.7.2 and install original painted-source baker
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          d="$RUNNER_TEMP/vfx-tal11"
          mkdir -p "$d"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg unzip python3-pil python3-numpy fonts-noto-cjk
          curl --fail --location --retry 3 -o /tmp/godot472.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot472.zip' | sha256sum --check --strict
          unzip -q /tmp/godot472.zip -d /tmp
          sudo install -m0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version | tee "$d/engine.txt"
          printf 'SOURCE_SHA=%s\nPAF01=HUMAN_WIND_SINGLE_TARGET_MARK_DURATION6_ZERO_PROJECTILE\nG3_5=GODOT_NATIVE_PREFLIGHT_TECH_PASS\nRUNTIME_MAPPING=PENDING\nOWNER_VISUAL=PENDING\nPVE_INTEGRATION=HOLD\nPHYSICAL_QA=PENDING\nNO_RIG=TRUE\n' "$GITHUB_SHA" > "$d/SCOPE.txt"
      - name: Bake original source-painted 風 paper, wind transfer and persistent moving 6s mark
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-tal11"
          python3 tools/qa/validate_vfx_v4_packet.py --stage packet --packet "$PACKET" | tee "$d/packet.log"
          /usr/bin/python3 tools/vfx/paf01_r1_wind_mark.py | tee "$d/painted-asset-bake.log"
          grep -Fq 'PAF01_R1_SOURCE_BAKE_PASS' "$d/painted-asset-bake.log"
          python3 tools/qa/validate_vfx_v4_packet.py --stage assets --packet "$PACKET" | tee "$d/atlas.log"
          grep -Fq 'VFX_V4_ASSETS_TECHNICAL_PASS' "$d/atlas.log"
          sha256sum godot/labs/combat_lab/talisman11/assets/tal11_r1_*.webp godot/labs/combat_lab/talisman11/assets/paf01_original_480x560.png godot/labs/combat_lab/talisman11/assets/paf01_mark_original_420.png > "$d/PAF01_ATLAS_SHA256SUMS.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Restore unchanged verified first-party character sprite overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .github/assets/p3/female_stage_a/part{01..14}.b64 .github/assets/p3/female_stage_a/part15a.b64 .github/assets/p3/female_stage_a/part15b.b64 .github/assets/p3/female_stage_a/part{16..20}.b64 | tr -d '\r\n\t ' | base64 --decode > /tmp/tmb_stage_a_pack.zip
          test "$(stat -c%s /tmp/tmb_stage_a_pack.zip)" -eq 44838
          echo '6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  /tmp/tmb_stage_a_pack.zip' | sha256sum --check --strict
          unzip -q /tmp/tmb_stage_a_pack.zip -d .
      - name: Strict Godot 4.7.2 import parse real WALK moving-target visual contract
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-tal11"
          bash tools/qa/run_godot_strict.sh --headless --path godot --import 2>&1 | tee "$d/godot-import.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/combat_lab/talisman11/phong_gioi_truy_dau.gd 2>&1 | tee "$d/godot-parse.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/labs/combat_lab/vfx_tal11_contract_test.gd 2>&1 | tee "$d/godot-focused.log"
          grep -Fq 'VFX_TAL11_FOCUSED_RESULT=PASS failures=0' "$d/godot-focused.log"
      - name: Full genuine Godot 1280x720 MP4 GIF and 15 native frame checkpoints
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-tal11"
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 --write-movie "$d/paf01-native.avi" --quit-after 480 res://labs/combat_lab/talisman11/phong_gioi_truy_dau.tscn 2>&1 | tee "$d/godot-native.log"
          grep -Fq 'VFX_TAL11_READY' "$d/godot-native.log"
          test -s "$d/paf01-native.avi"
          ffmpeg -y -hide_banner -loglevel error -i "$d/paf01-native.avi" -pix_fmt yuv420p -c:v libx264 -crf 16 -movflags +faststart "$d/PAF01_Phong_Gioi_Truy_Dau_Godot_1280x720.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,nb_frames,avg_frame_rate -of default=noprint_wrappers=1 "$d/PAF01_Phong_Gioi_Truy_Dau_Godot_1280x720.mp4" | tee "$d/ffprobe.txt"
          grep -Fxq 'width=1280' "$d/ffprobe.txt"
          grep -Fxq 'height=720' "$d/ffprobe.txt"
          grep -Fxq 'nb_frames=480' "$d/ffprobe.txt"
          for at in 0.16 0.30 0.54 0.84 1.13 1.28 1.46 2.20 3.15 4.22 5.25 6.22 7.02 7.30 7.64; do
             ffmpeg -y -hide_banner -loglevel error -ss "$at" -i "$d/PAF01_Phong_Gioi_Truy_Dau_Godot_1280x720.mp4" -frames:v 1 "$d/frame-$at.png"
          done
          ffmpeg -y -hide_banner -loglevel error -i "$d/PAF01_Phong_Gioi_Truy_Dau_Godot_1280x720.mp4" -vf 'fps=5,scale=320:180,tile=5x3:nb_frames=15' -frames:v 1 "$d/PAF01_15frame_sheet.png"
          ffmpeg -y -hide_banner -loglevel error -i "$d/PAF01_Phong_Gioi_Truy_Dau_Godot_1280x720.mp4" -vf 'fps=10,scale=640:-1:flags=lanczos' -loop 0 "$d/PAF01_Phong_Gioi_Truy_Dau_Godot.gif"
          sha256sum "$d/"*.mp4 "$d/"*.gif "$d/"*.png > "$d/PAF01_VIDEO_SHA256SUMS.txt"
          rm "$d/paf01-native.avi"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "PAF01_EXACT_SHA_TECH_PASS=$GITHUB_SHA"
      - name: Upload original painterly atlases and genuine engine evidence, art manual only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfx-tal11-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/vfx-tal11/*.log
            ${{ runner.temp }}/vfx-tal11/*.txt
            ${{ runner.temp }}/vfx-tal11/*.png
            ${{ runner.temp }}/vfx-tal11/*.mp4
            ${{ runner.temp }}/vfx-tal11/*.gif
            godot/labs/combat_lab/talisman11/assets/tal11_r1_*.webp
            godot/labs/combat_lab/talisman11/assets/paf01_*original*.png
