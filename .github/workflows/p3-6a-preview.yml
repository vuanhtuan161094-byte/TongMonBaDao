name: P3.6A Preview

on:
  workflow_dispatch:
  push:
    paths:
      - 'godot/src/presentation/p3_1_landscape_sect.gd'
      - 'godot/src/presentation/p3_2_landscape_sect.gd'
      - 'godot/src/presentation/p3/**'
      - 'godot/scenes/p3/**'
      - 'godot/tests/presentation/p3_6a_*.gd'
      - 'tools/godot/Verify-P3-6A-Playable-Slice.ps1'
      - '.github/assets/p3/female_stage_a/**'
      - '.github/workflows/p3-6a-preview.yml'

permissions:
  contents: read

jobs:
  preview:
    name: Godot 4.7.2 P3.6A preview
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and virtual display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          GODOT_SHA256="cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
          curl --fail --location --retry 3 --output /tmp/godot.zip "$GODOT_URL"
          echo "$GODOT_SHA256  /tmp/godot.zip" | sha256sum --check --strict
          mkdir -p /tmp/godot-4.7.2
          unzip -q /tmp/godot.zip -d /tmp/godot-4.7.2
          sudo install -m 0755 /tmp/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Restore canonical female Stage A runtime pack
        shell: bash
        run: |
          set -euo pipefail
          PACK="/tmp/female_normal_v1_stageA_runtime_pack_v2_quant.zip"
          cat .github/assets/p3/female_stage_a/part*.b64 | tr -d '\r\n\t ' | base64 --decode > "$PACK"
          test "$(stat -c%s "$PACK")" -eq 44838
          echo "6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  $PACK" | sha256sum --check --strict
          test "$(unzip -Z1 "$PACK" | grep -Ec '^godot/assets/p3/character_creator/parts/female_normal_v1/.+\.png$')" -eq 42
          test "$(unzip -Z1 "$PACK" | sed '/\/$/d' | wc -l)" -eq 42
          unzip -q "$PACK" -d .
          test "$(find godot/assets/p3/character_creator/parts/female_normal_v1 -type f -name '*.png' | wc -l)" -eq 42

      - name: Import project scripts and resources
        shell: bash
        run: godot --headless --path godot --import

      - name: Run P3.6A FAST verification
        shell: pwsh
        env:
          GODOT_BIN: /usr/local/bin/godot
        run: ./tools/godot/Verify-P3-6A-Playable-Slice.ps1

      - name: Capture live P3.6A preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/reports
          xvfb-run -a -s "-screen 0 1280x720x24" godot --path godot --resolution 1280x720 -s res://tests/presentation/p3_6a_capture_preview.gd
          test -s godot/reports/p3_6a_preview.png

      - name: Upload P3.6A preview
        uses: actions/upload-artifact@v4
        with:
          name: p3-6a-preview-${{ github.sha }}
          path: godot/reports/p3_6a_preview.png
          if-no-files-found: error
          retention-days: 14
