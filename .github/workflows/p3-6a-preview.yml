name: P3.6A Preview

on:
  workflow_dispatch:
  push:
    paths:
      - 'godot/src/presentation/p3_1_landscape_sect.gd'
      - 'godot/src/presentation/p3_2_landscape_sect.gd'
      - 'godot/src/presentation/p3/**'
      - 'godot/scenes/p3/**'
      - 'godot/tests/presentation/p3_6a_*.gd'
      - 'tools/godot/Verify-P3-6A-Playable-Slice.ps1'
      - '.github/assets/p3/female_stage_a/**'
      - '.github/workflows/p3-6a-preview.yml'

permissions:
  contents: read

jobs:
  preview:
    name: Godot 4.7.2 P3.6A preview
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and virtual display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          GODOT_SHA256="cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
          curl --fail --location --retry 3 --output /tmp/godot.zip "$GODOT_URL"
          echo "$GODOT_SHA256  /tmp/godot.zip" | sha256sum --check --strict
          mkdir -p /tmp/godot-4.7.2
          unzip -q /tmp/godot.zip -d /tmp/godot-4.7.2
          sudo install -m 0755 /tmp/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Restore canonical female Stage A runtime pack
        shell: bash
        run: |
          set -euo pipefail
          PACK="/tmp/female_normal_v1_stageA_runtime_pack_v2_quant.zip"
          cat \
            .github/assets/p3/female_stage_a/part01.b64 \
            .github/assets/p3/female_stage_a/part02.b64 \
            .github/assets/p3/female_stage_a/part03.b64 \
            .github/assets/p3/female_stage_a/part04.b64 \
            .github/assets/p3/female_stage_a/part05.b64 \
            .github/assets/p3/female_stage_a/part06.b64 \
            .github/assets/p3/female_stage_a/part07.b64 \
            .github/assets/p3/female_stage_a/part08.b64 \
            .github/assets/p3/female_stage_a/part09.b64 \
            .github/assets/p3/female_stage_a/part10.b64 \
            .github/assets/p3/female_stage_a/part11.b64 \
            .github/assets/p3/female_stage_a/part12.b64 \
            .github/assets/p3/female_stage_a/part13.b64 \
            .github/assets/p3/female_stage_a/part14.b64 \
            .github/assets/p3/female_stage_a/part15a.b64 \
            .github/assets/p3/female_stage_a/part15b.b64 \
            .github/assets/p3/female_stage_a/part16.b64 \
            .github/assets/p3/female_stage_a/part17.b64 \
            .github/assets/p3/female_stage_a/part18.b64 \
            .github/assets/p3/female_stage_a/part19.b64 \
            .github/assets/p3/female_stage_a/part20.b64 \
            | tr -d '\r\n\t ' | base64 --decode > "$PACK"
          python3 - "$PACK" <<'PY'
          import struct
          import sys

          path = sys.argv[1]
          data = bytearray(open(path, "rb").read())
          cd_offset = 38974
          entries = []
          pos = 0
          while pos < cd_offset:
              if data[pos:pos + 4] != b"PK\x03\x04":
                  raise SystemExit(f"bad local header at {pos}")
              (
                  version_needed, flags, method, mtime, mdate,
                  crc32, compressed_size, uncompressed_size,
                  name_len, extra_len,
              ) = struct.unpack_from("<HHHHHIIIHH", data, pos + 4)
              name = bytes(data[pos + 30:pos + 30 + name_len])
              entries.append((
                  pos, version_needed, flags, method, mtime, mdate,
                  crc32, compressed_size, uncompressed_size, name,
              ))
              pos += 30 + name_len + extra_len + compressed_size

          if pos != cd_offset or len(entries) != 42:
              raise SystemExit(f"unexpected local archive layout: end={pos}, entries={len(entries)}")

          import base64
          import binascii
          import zlib

          target_name = b"godot/assets/p3/character_creator/parts/female_normal_v1/hair/hair_01/hair_01_up_back.png"
          target = next(e for e in entries if e[-1] == target_name)
          (
              target_offset, _version_needed, _flags, _method, _mtime, _mdate,
              target_crc, target_csize, target_usize, target_name,
          ) = target
          target_data_start = target_offset + 30 + len(target_name)
          target_data_end = target_data_start + target_csize
          compressed = bytes(data[target_data_start:target_data_end])

          try:
              current_output = zlib.decompress(compressed, -15)
              current_crc = binascii.crc32(current_output) & 0xffffffff
          except zlib.error:
              current_output = b""
              current_crc = None

          if current_crc != target_crc:
              part11_path = ".github/assets/p3/female_stage_a/part11.b64"
              part11 = "".join(open(part11_path, "r", encoding="ascii").read().split())
              if len(part11) != 3000:
                  raise SystemExit(f"unexpected part11 length: {len(part11)}")
              part11_byte_base = 22500
              alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"
              global_char_start = (target_data_start // 3) * 4
              global_char_end = ((target_data_end + 2) // 3) * 4
              local_char_start = max(0, global_char_start - 30000)
              local_char_end = min(len(part11), global_char_end - 30000)
              found = None

              for char_index in range(local_char_start, local_char_end):
                  quartet_start = (char_index // 4) * 4
                  quartet = part11[quartet_start:quartet_start + 4]
                  if len(quartet) != 4:
                      continue
                  quartet_global_byte = part11_byte_base + (quartet_start // 4) * 3
                  for replacement in alphabet:
                      if replacement == part11[char_index]:
                          continue
                      mutated = list(quartet)
                      mutated[char_index - quartet_start] = replacement
                      try:
                          new_bytes = base64.b64decode("".join(mutated), validate=True)
                      except Exception:
                          continue

                      candidate = bytearray(compressed)
                      changed = False
                      for j, value in enumerate(new_bytes):
                          global_byte = quartet_global_byte + j
                          if target_data_start <= global_byte < target_data_end:
                              candidate[global_byte - target_data_start] = value
                              changed = True
                      if not changed:
                          continue
                      try:
                          output = zlib.decompress(bytes(candidate), -15)
                      except zlib.error:
                          continue
                      if len(output) == target_usize and (binascii.crc32(output) & 0xffffffff) == target_crc:
                          found = (char_index, part11[char_index], replacement, bytes(candidate))
                          break
                  if found:
                      break

              if not found:
                  raise SystemExit(
                      f"no single Base64-character repair found for {target_name.decode()} "
                      f"within part11[{local_char_start}:{local_char_end}]"
                  )

              char_index, old_char, new_char, corrected_compressed = found
              print(
                  f"STAGE_A_PART11_REPAIR char_index={char_index} "
                  f"old={old_char} new={new_char} "
                  f"global_char_index={30000 + char_index}"
              )
              data[target_data_start:target_data_end] = corrected_compressed

          central = bytearray()
          for (
              local_offset, version_needed, flags, method, mtime, mdate,
              crc32, compressed_size, uncompressed_size, name,
          ) in entries:
              central += struct.pack(
                  "<4sHHHHHHIIIHHHHHII",
                  b"PK\x01\x02",
                  0x0314,
                  version_needed,
                  flags,
                  method,
                  mtime,
                  mdate,
                  crc32,
                  compressed_size,
                  uncompressed_size,
                  len(name),
                  0,
                  0,
                  0,
                  0,
                  0x81A40000,
                  local_offset,
              )
              central += name

          if len(central) != 5842:
              raise SystemExit(f"unexpected central directory size: {len(central)}")

          eocd = struct.pack(
              "<4sHHHHIIH",
              b"PK\x05\x06",
              0,
              0,
              len(entries),
              len(entries),
              len(central),
              cd_offset,
              0,
          )
          rebuilt = data[:cd_offset] + central + eocd
          open(path, "wb").write(rebuilt)
          PY
          test "$(stat -c%s "$PACK")" -eq 44838
          unzip -t "$PACK"
          sha256sum "$PACK"
          echo "6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  $PACK" | sha256sum --check --strict
          test "$(unzip -Z1 "$PACK" | grep -Ec '^godot/assets/p3/character_creator/parts/female_normal_v1/.+\.png$')" -eq 42
          test "$(unzip -Z1 "$PACK" | sed '/\/$/d' | wc -l)" -eq 42
          unzip -q "$PACK" -d .
          test "$(find godot/assets/p3/character_creator/parts/female_normal_v1 -type f -name '*.png' | wc -l)" -eq 42

      - name: Import project scripts and resources
        shell: bash
        run: godot --headless --path godot --import

      - name: Run P3.6A FAST verification
        shell: pwsh
        env:
          GODOT_BIN: /usr/local/bin/godot
        run: ./tools/godot/Verify-P3-6A-Playable-Slice.ps1

      - name: Capture live P3.6A preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/reports
          xvfb-run -a -s "-screen 0 1280x720x24" godot --path godot --resolution 1280x720 -s res://tests/presentation/p3_6a_capture_preview.gd
          test -s godot/reports/p3_6a_preview.png

      - name: Upload P3.6A preview
        uses: actions/upload-artifact@v4
        with:
          name: p3-6a-preview-${{ github.sha }}
          path: godot/reports/p3_6a_preview.png
          if-no-files-found: error
          retention-days: 14
