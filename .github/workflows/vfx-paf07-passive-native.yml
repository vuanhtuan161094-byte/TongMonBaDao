name: PAF07 R1 | Duong Phu Quy Nguyen Godot native
on:
  workflow_dispatch:
  push:
    branches: [integration/pve-p0-playable-ui-20261103]
    paths:
      - '.github/workflows/vfx-paf07-passive-native.yml'
      - 'tools/vfx/paint_paf06_r3_orbit.py'
      - 'tools/vfx/paint_paf06_tinh_gioi.py'
      - 'tools/vfx/paint_paf07_quy_nguyen.py'
      - 'tools/qa/check_paf06_r3_orbit.py'
      - 'tools/qa/check_paf06_passive.py'
      - 'godot/labs/combat_lab/talisman17/**'
      - 'godot/tests/labs/combat_lab/vfx_paf07_r1_contract_test.gd'
      - 'docs/operations/vfx_packets/PAF06_R3_ROTATING_RING_REVIEW_20261117.md'
permissions:
  contents: read
jobs:
  paf06-passive-native:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      GODOT_AUDIO_DRIVER: Dummy
      GODOT_RENDERING_DRIVER: opengl3
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Godot 4.7.2 and original source dependencies
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-paf06";mkdir -p "$d"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > "$d/exact-sha.txt"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg unzip python3-pil
          curl --fail --location --retry 3 -o /tmp/godot472.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot472.zip' | sha256sum --check --strict
          unzip -q /tmp/godot472.zip -d /tmp
          sudo install -m0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version | tee "$d/engine.txt"
      - name: Generate PAF07 original 24 key poses with alpha source
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-paf06"
          /usr/bin/python3 tools/vfx/paint_paf07_quy_nguyen.py 2>&1 | tee "$d/paf07-art.log"
          grep -Fq 'PAF07_R1_ORIGINAL_RGBA_PASS' "$d/paf07-art.log"
          /usr/bin/python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib,json
          root=Path("godot/labs/combat_lab/talisman17")
          man=json.loads((root/"art_sources/PAF07_R1_MANIFEST.json").read_text())
          assert man["skill_id"]=="tmb.skill.talisman.phong_an_phu.passive_02.human"
          atlas=root/"assets/paf07_quy_nguyen_24.webp"
          with Image.open(atlas) as i: im=i.convert("RGBA")
          assert im.size==(1536,1024)
          hashes=[]
          for k in range(24):
              tile=im.crop(((k%6)*256,(k//6)*256,((k%6)+1)*256,((k//6)+1)*256))
              assert tile.getchannel("A").getextrema()[0]==0
              assert tile.getchannel("A").getextrema()[1]>=130
              hashes.append(hashlib.sha256(tile.tobytes()).hexdigest())
          assert len(set(hashes))>=18
          assert hashlib.sha256(atlas.read_bytes()).hexdigest()==man["atlas"]["sha256"]
          print("PAF07_R1_SOURCE_PASS unique_keyposes="+str(len(set(hashes))))
          PY
          sha256sum godot/labs/combat_lab/talisman17/assets/*.webp godot/labs/combat_lab/talisman17/art_sources/*.png > "$d/paf07-source-hashes.txt"
      - name: Restore approved unchanged caster artwork
        shell: bash
        run: |
          set -euo pipefail
          cat .github/assets/p3/female_stage_a/part{01..14}.b64 .github/assets/p3/female_stage_a/part15a.b64 .github/assets/p3/female_stage_a/part15b.b64 .github/assets/p3/female_stage_a/part{16..20}.b64 | tr -d '\r\n\t ' | base64 --decode > /tmp/tmb_stage_a_pack.zip
          test "$(stat -c%s /tmp/tmb_stage_a_pack.zip)" -eq 44838
          echo '6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  /tmp/tmb_stage_a_pack.zip' | sha256sum --check --strict
          unzip -q /tmp/tmb_stage_a_pack.zip -d .
      - name: Godot strict parse and PAF07 canonical passive focused test
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-paf06"
          bash tools/qa/run_godot_strict.sh --headless --path godot --import 2>&1 | tee "$d/paf07-import.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/combat_lab/talisman17/duong_phu_quy_nguyen_r1.gd 2>&1 | tee "$d/paf07-parse.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/labs/combat_lab/vfx_paf07_r1_contract_test.gd 2>&1 | tee "$d/paf07-focus.log"
          grep -Fq 'PAF07_R1_FOCUSED_RESULT=PASS failures=0' "$d/paf07-focus.log"
      - name: PAF07 true native Godot passive 192 frames and OFF comparison
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-paf06"
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 --write-movie "$d/paf07-on.avi" --quit-after 192 res://labs/combat_lab/talisman17/duong_phu_quy_nguyen_r1.tscn 2>&1 | tee "$d/paf07-native.log"
          grep -Fq 'PAF07_R1_READY' "$d/paf07-native.log"
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 --write-movie "$d/paf07-off.avi" --quit-after 84 res://labs/combat_lab/talisman17/duong_phu_quy_nguyen_r1_off.tscn 2>&1 | tee "$d/paf07-off.log"
          ffmpeg -y -hide_banner -loglevel error -i "$d/paf07-on.avi" -pix_fmt yuv420p -c:v libx264 -crf 16 -movflags +faststart "$d/paf07-r1-native.mp4"
          ffmpeg -y -hide_banner -loglevel error -ss 1.0 -i "$d/paf07-r1-native.mp4" -frames:v 1 "$d/paf07-on.png"
          ffmpeg -y -hide_banner -loglevel error -ss 1.0 -i "$d/paf07-off.avi" -frames:v 1 "$d/paf07-off.png"
          ffmpeg -y -hide_banner -loglevel error -ss 0.30 -i "$d/paf07-r1-native.mp4" -frames:v 1 "$d/paf07-form.png"
          ffmpeg -y -hide_banner -loglevel error -ss 1.82 -i "$d/paf07-r1-native.mp4" -frames:v 1 "$d/paf07-glow.png"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,nb_frames -of default=noprint_wrappers=1 "$d/paf07-r1-native.mp4" | tee "$d/paf07-probe.txt"
          grep -Fxq 'width=1280' "$d/paf07-probe.txt"
          grep -Fxq 'height=720' "$d/paf07-probe.txt"
          grep -Fxq 'nb_frames=192' "$d/paf07-probe.txt"
          /usr/bin/python3 - <<'PY'
          from PIL import Image,ImageChops
          import os
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])/"vfx-paf06"
          a=Image.open(d/"paf07-on.png").convert("RGB").crop((607,379,808,583))
          b=Image.open(d/"paf07-off.png").convert("RGB").crop((607,379,808,583))
          active=sum(max(v)>22 for v in ImageChops.difference(a,b).getdata())
          assert active>=180, f"PAF07 native invisible {active} px"
          print("PAF07_R1_NATIVE_VISIBLE_PASS pixels="+str(active))
          PY
          sha256sum "$d/paf07-r1-native.mp4" "$d"/paf07-*.png > "$d/paf07-native-shas.txt"
          rm -f "$d/paf07-on.avi" "$d/paf07-off.avi"
          echo "PAF07_R1_GODOT_NATIVE_TECH_PASS=$GITHUB_SHA OWNER_ART=PENDING PVE=HOLD"
      - name: Archive native MP4, RGBA masters and proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfx-paf07-native-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/vfx-paf06/*.log
            ${{ runner.temp }}/vfx-paf06/*.txt
            ${{ runner.temp }}/vfx-paf06/*.json
            ${{ runner.temp }}/vfx-paf06/*.png
            ${{ runner.temp }}/vfx-paf06/*.mp4
            godot/labs/combat_lab/talisman16/art_sources/*.png
            godot/labs/combat_lab/talisman16/art_sources/*.json
            godot/labs/combat_lab/talisman17/assets/*.webp
            godot/labs/combat_lab/talisman17/art_sources/*.png
            godot/labs/combat_lab/talisman17/art_sources/*.json
            godot/labs/combat_lab/talisman16/r3/assets/*.webp
            godot/labs/combat_lab/talisman16/r3/art_sources/*.png
            godot/labs/combat_lab/talisman16/r3/art_sources/*.json
            godot/labs/combat_lab/talisman16/assets/*.webp
