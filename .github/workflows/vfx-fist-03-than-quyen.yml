name: VFX-FIST-03 Than Quyen (Son Ha Chan Thien art study) genuine Godot 4.7.2
on:
  workflow_dispatch:
  push:
    branches: [integration/pve-p0-playable-ui-20261103]
    paths:
      - '.github/workflows/vfx-fist-03-than-quyen.yml'
      - 'godot/labs/combat_lab/fist03/**'
      - 'tools/vfx/generate_fist03_than_quyen_v1.py'
      - 'godot/tests/labs/combat_lab/vfx_fist03_contract_test.gd'
permissions:
  contents: read
jobs:
  native-godot-film:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_AUDIO_DRIVER: Dummy
      GODOT_RENDERING_DRIVER: opengl3
    steps:
      - uses: actions/checkout@v4
      - name: Official SHA256-pinned Godot 4.7.2 and movie tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg unzip python3-pil python3-numpy
          curl --fail --location --retry 3 -o /tmp/godot472.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot472.zip' | sha256sum --check --strict
          unzip -q /tmp/godot472.zip -d /tmp
          sudo install -m0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p /tmp/vfx-fist03
          godot --version | tee /tmp/vfx-fist03/engine.txt
          echo "SOURCE_SHA=$GITHUB_SHA; CONCEPT_LABEL=THAN_QUYEN; SOURCE_ID=tmb.skill.fist.ba_quyen.ultimate.human; EFFECT=damage; ELEMENT=fire; SHAPE=circle; CAP=3; CAST=1.15; ART_SOURCE=original_ImageGen_cropped_WEBP; NO_RIG=true; VIEW_ONLY=true; OWNER_VISUAL_PENDING; PVE_INTEGRATION_HOLD" > /tmp/vfx-fist03/metadata.txt
      - name: Restore existing Stage A assets without tracked modifications
        shell: bash
        run: |
          set -euo pipefail
          cat .github/assets/p3/female_stage_a/part{01..14}.b64 .github/assets/p3/female_stage_a/part15a.b64 .github/assets/p3/female_stage_a/part15b.b64 .github/assets/p3/female_stage_a/part{16..20}.b64 | tr -d '\r\n\t ' | base64 --decode > /tmp/tmb_stage_a_pack.zip
          test "$(stat -c%s /tmp/tmb_stage_a_pack.zip)" -eq 44838
          echo '6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  /tmp/tmb_stage_a_pack.zip' | sha256sum --check --strict
          unzip -q /tmp/tmb_stage_a_pack.zip -d .
      - name: Reproduce four first-party RGBA atlases from 2 cropped sprite masters
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/vfx/generate_fist03_than_quyen_v1.py | tee /tmp/vfx-fist03/atlas.log
          grep -Fq 'THAN_QUYEN_ART_V1=PASS atlas_frames=40 alpha=RGBA original_source=ImageGen_cropped no_rig=true' /tmp/vfx-fist03/atlas.log
          for n in godfist_master impact_master; do
            test -s "godot/labs/combat_lab/fist03/assets/$n.webp"
          done
          for n in charge godfist impact dust; do
            test -s "godot/labs/combat_lab/fist03/assets/generated/$n.png"
            cp "godot/labs/combat_lab/fist03/assets/generated/$n.png" "/tmp/vfx-fist03/$n.png"
          done
          sha256sum /tmp/vfx-fist03/{charge,godfist,impact,dust}.png > /tmp/vfx-fist03/ATLAS_SHA256SUMS.txt
      - name: Strict import parse and focused test
        shell: bash
        run: |
          set -euo pipefail
          bash tools/qa/run_godot_strict.sh --headless --path godot --import 2>&1 | tee /tmp/vfx-fist03/import.log
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/combat_lab/fist03/than_quyen.gd 2>&1 | tee /tmp/vfx-fist03/parse.log
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/labs/combat_lab/vfx_fist03_contract_test.gd 2>&1 | tee /tmp/vfx-fist03/test.log
          grep -Fq 'VFX_FIST03_FOCUSED_RESULT=PASS failures=0' /tmp/vfx-fist03/test.log
      - name: Genuine Godot 3-target Divine Fist art study 1280x720 MP4 GIF and 12 frames
        shell: bash
        run: |
          set -euo pipefail
          d=/tmp/vfx-fist03
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 --write-movie "$d/fist-03.avi" --quit-after 202 res://labs/combat_lab/fist03/than_quyen.tscn 2>&1 | tee "$d/movie.log"
          test -s "$d/fist-03.avi"
          ffmpeg -y -hide_banner -loglevel error -i "$d/fist-03.avi" -pix_fmt yuv420p -c:v libx264 -crf 16 -movflags +faststart "$d/fist-03.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,avg_frame_rate -of default=noprint_wrappers=1 "$d/fist-03.mp4" | tee "$d/dimensions.txt"
          grep -Fxq 'width=1280' "$d/dimensions.txt"
          grep -Fxq 'height=720' "$d/dimensions.txt"
          for at in 0.16 0.42 0.76 1.10 1.22 1.40 1.60 1.70 1.83 2.06 2.42 3.03; do
            ffmpeg -y -hide_banner -loglevel error -ss "$at" -i "$d/fist-03.mp4" -frames:v 1 "$d/frame-$at.png"
          done
          ffmpeg -y -hide_banner -loglevel error -i "$d/fist-03.mp4" -vf 'fps=3.5,scale=320:180,tile=4x3:nb_frames=12' -frames:v 1 "$d/timeline.png"
          ffmpeg -y -hide_banner -loglevel error -i "$d/fist-03.mp4" -vf 'fps=12,scale=640:360:flags=lanczos' -loop 0 "$d/fist-03.gif"
          sha256sum "$d/"*.mp4 "$d/"*.gif "$d/"*.png > "$d/SHA256SUMS.txt"
          rm "$d/fist-03.avi"
      - name: Upload exact SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfx-fist03-native
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/vfx-fist03/*.txt
            /tmp/vfx-fist03/*.log
            /tmp/vfx-fist03/*.png
            /tmp/vfx-fist03/*.gif
            /tmp/vfx-fist03/*.mp4
