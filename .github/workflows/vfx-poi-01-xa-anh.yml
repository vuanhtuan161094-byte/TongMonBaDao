name: VFX-POI-01 | Xa Anh Quan Mach official Godot 4.7.2 movie
on:
  workflow_dispatch:
  push:
    branches: [integration/pve-p0-playable-ui-20261103]
    paths:
      - '.github/workflows/vfx-poi-01-xa-anh.yml'
      - 'godot/labs/combat_lab/poison01/**'
      - 'godot/tests/labs/combat_lab/vfx_poi01_contract_test.gd'
permissions:
  contents: read
jobs:
  serpent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_AUDIO_DRIVER: Dummy
      GODOT_RENDERING_DRIVER: opengl3
    steps:
      - uses: actions/checkout@v4
      - name: Install SHA256-pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg unzip
          curl --fail --location --retry 3 -o /tmp/godot472.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot472.zip" | sha256sum --check --strict
          unzip -q /tmp/godot472.zip -d /tmp
          sudo install -m0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p "$RUNNER_TEMP/vfx-poi01"
          d="$RUNNER_TEMP/vfx-poi01"
          godot --version | tee "$d/engine.txt"
          printf 'SOURCE_SHA=%s\nSCENE=res://labs/combat_lab/poison01/xa_anh_quan_mach.tscn\nRENDERER=gl_compatibility\nOWNER_VISUAL_PENDING\nPVE_INTEGRATION_HOLD\n' "$GITHUB_SHA" > "$d/metadata.txt"
      - name: Restore required existing Stage A source assets, never modify code
        shell: bash
        run: |
          set -euo pipefail
          cat .github/assets/p3/female_stage_a/part{01..14}.b64 .github/assets/p3/female_stage_a/part15a.b64 .github/assets/p3/female_stage_a/part15b.b64 .github/assets/p3/female_stage_a/part{16..20}.b64 | tr -d '\r\n\t ' | base64 --decode > /tmp/tmb_stage_a_pack.zip
          test "$(stat -c%s /tmp/tmb_stage_a_pack.zip)" -eq 44838
          echo "6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  /tmp/tmb_stage_a_pack.zip" | sha256sum --check --strict
          unzip -q /tmp/tmb_stage_a_pack.zip -d .
      - name: Strict Godot project import, parse and focused contract
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-poi01"
          bash tools/qa/run_godot_strict.sh --headless --path godot --import 2>&1 | tee "$d/import.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/combat_lab/poison01/xa_anh_quan_mach.gd 2>&1 | tee "$d/parse.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/labs/combat_lab/vfx_poi01_contract_test.gd 2>&1 | tee "$d/test.log"
          grep -Fq 'VFX_POI01_FOCUSED_RESULT=PASS failures=0' "$d/test.log"
      - name: Genuine Godot GL Compatibility 1280x720 movie and 10 keyframes
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-poi01"
          xvfb-run -a -s "-screen 0 1280x720x24" bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 --write-movie "$d/xa-anh-quan-mach.avi" --quit-after 255 res://labs/combat_lab/poison01/xa_anh_quan_mach.tscn 2>&1 | tee "$d/movie.log"
          test -s "$d/xa-anh-quan-mach.avi"
          ffmpeg -y -hide_banner -loglevel error -i "$d/xa-anh-quan-mach.avi" -pix_fmt yuv420p -c:v libx264 -crf 16 "$d/xa-anh-quan-mach.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,avg_frame_rate -of default=noprint_wrappers=1 "$d/xa-anh-quan-mach.mp4" | tee "$d/dimensions.txt"
          grep -Fxq 'width=1280' "$d/dimensions.txt"
          grep -Fxq 'height=720' "$d/dimensions.txt"
          for at in 0.30 0.76 0.98 1.22 1.54 1.75 2.07 2.42 2.91 3.24; do
            ffmpeg -y -hide_banner -loglevel error -ss "$at" -i "$d/xa-anh-quan-mach.mp4" -frames:v 1 "$d/frame-$at.png"
          done
          ffmpeg -y -hide_banner -loglevel error -i "$d/xa-anh-quan-mach.mp4" -vf "fps=6,scale=320:180,tile=5x4:nb_frames=20" -frames:v 1 "$d/timeline.png"
          sha256sum "$d/"*.mp4 "$d/"*.png > "$d/SHA256SUMS.txt"
          rm "$d/xa-anh-quan-mach.avi"
      - name: Upload video and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfx-poi01-xa-anh-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/vfx-poi01/*.log
            ${{ runner.temp }}/vfx-poi01/*.txt
            ${{ runner.temp }}/vfx-poi01/*.png
            ${{ runner.temp }}/vfx-poi01/*.mp4
