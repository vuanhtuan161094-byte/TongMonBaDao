name: VFX-FIST-07 Kim Cang Ho The pure-gold guard, real Godot 4.7.2
on:
  workflow_dispatch:
  push:
    branches: [integration/pve-p0-playable-ui-20261103]
    paths:
      - '.github/workflows/vfx-fist-07-kim-cang-ho-the.yml'
      - 'godot/labs/combat_lab/fist07/**'
      - 'tools/vfx/generate_fist07_kim_cang_guard.py'
      - 'godot/tests/labs/combat_lab/vfx_fist07_contract_test.gd'
permissions:
  contents: read
jobs:
  native-godot-film:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_AUDIO_DRIVER: Dummy
      GODOT_RENDERING_DRIVER: opengl3
    steps:
      - uses: actions/checkout@v4
      - name: Official SHA256 pinned Godot 4.7.2 + rendering tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg unzip python3-pil
          curl --fail --location --retry 3 -o /tmp/godot472.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot472.zip' | sha256sum --check --strict
          unzip -q /tmp/godot472.zip -d /tmp
          sudo install -m0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p /tmp/vfx-fist07
          godot --version | tee /tmp/vfx-fist07/engine.txt
          echo "EXACT_SHA=$GITHUB_SHA; SKILL=tmb.skill.fist.kim_cang.active_02.human; EFFECT=guard; ELEMENT=earth; CAST=0.45; DURATION=4; CAP=1; RENDER_HUE=pure-gold-light; SOURCE=first-party PIL luminous armor art; VIEW_ONLY=TRUE; NO_RIG=TRUE; OWNER_VISUAL_PENDING; PVE_INTEGRATION_HOLD" > /tmp/vfx-fist07/metadata.txt
      - name: Restore existing test actor without modifying tracked sources
        shell: bash
        run: |
          set -euo pipefail
          cat .github/assets/p3/female_stage_a/part{01..14}.b64 .github/assets/p3/female_stage_a/part15a.b64 .github/assets/p3/female_stage_a/part15b.b64 .github/assets/p3/female_stage_a/part{16..20}.b64 | tr -d '\r\n\t ' | base64 --decode > /tmp/tmb_stage_a_pack.zip
          echo '6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  /tmp/tmb_stage_a_pack.zip' | sha256sum --check --strict
          unzip -q /tmp/tmb_stage_a_pack.zip -d .
      - name: Generate original 24-frame luminous armor and guarded-hit atlases
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/vfx/generate_fist07_kim_cang_guard.py | tee /tmp/vfx-fist07/generator.log
          grep -Fq 'FIST07_ATLAS_PASS frames=24 textures=2 raw_rgba_bytes=6291456 no_rig=true' /tmp/vfx-fist07/generator.log
          for f in gold_ward guarded_hit; do
            test -s "godot/labs/combat_lab/fist07/assets/generated/$f.png"
            cp "godot/labs/combat_lab/fist07/assets/generated/$f.png" "/tmp/vfx-fist07/$f.png"
          done
          python3 - <<'ART_CHECK' | tee /tmp/vfx-fist07/art_budget.txt
          from PIL import Image,ImageChops
          from pathlib import Path
          root=Path('/tmp/vfx-fist07')
          ward=Image.open(root/'gold_ward.png').convert('RGBA')
          hit=Image.open(root/'guarded_hit.png').convert('RGBA')
          assert ward.size==(1024,1024) and hit.size==(1024,512)
          assert ward.getpixel((0,0))[3]==0 and hit.getpixel((0,0))[3]==0
          frame=lambda im,k:im.crop((k%4*256,k//4*256,k%4*256+256,k//4*256+256))
          assert ImageChops.difference(frame(ward,4),frame(ward,9)).getbbox(), 'ward pose must vary'
          assert ImageChops.difference(frame(hit,0),frame(hit,6)).getbbox(), 'contact must vary'
          assert frame(ward,7).getchannel('A').getbbox()
          assert (ward.width*ward.height+hit.width*hit.height)*4==6291456
          print('FIST07_ART_ALPHA_QA=PASS frame_count=24 raw_rgba_bytes=6291456 transparent_background=TRUE')
          ART_CHECK
          sha256sum /tmp/vfx-fist07/{gold_ward,guarded_hit}.png > /tmp/vfx-fist07/ATLAS_SHA256SUMS.txt
      - name: Strict Godot import/parse and focused GUARD contract
        shell: bash
        run: |
          set -euo pipefail
          bash tools/qa/run_godot_strict.sh --headless --path godot --import 2>&1 | tee /tmp/vfx-fist07/import.log
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/combat_lab/fist07/kim_cang_ho_the.gd 2>&1 | tee /tmp/vfx-fist07/parse.log
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/labs/combat_lab/vfx_fist07_contract_test.gd 2>&1 | tee /tmp/vfx-fist07/test.log
          grep -Fq 'VFX_FIST07_FOCUSED_RESULT=PASS failures=0' /tmp/vfx-fist07/test.log
      - name: Real 1280x720 Godot movie with guarded hit reactions and 15 checkpoints
        shell: bash
        run: |
          set -euo pipefail
          d=/tmp/vfx-fist07
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 --write-movie "$d/fist-07.avi" --quit-after 323 res://labs/combat_lab/fist07/kim_cang_ho_the.tscn 2>&1 | tee "$d/movie.log"
          test -s "$d/fist-07.avi"
          ffmpeg -y -hide_banner -loglevel error -i "$d/fist-07.avi" -pix_fmt yuv420p -c:v libx264 -crf 16 -movflags +faststart "$d/fist-07.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,avg_frame_rate -of default=noprint_wrappers=1 "$d/fist-07.mp4" | tee "$d/dimensions.txt"
          grep -Fxq 'width=1280' "$d/dimensions.txt"
          grep -Fxq 'height=720' "$d/dimensions.txt"
          for at in 0.11 0.29 0.42 0.54 0.88 1.27 1.34 1.44 2.22 3.10 3.18 4.22 4.55 4.74 5.03; do
            ffmpeg -y -hide_banner -loglevel error -ss "$at" -i "$d/fist-07.mp4" -frames:v 1 "$d/frame-$at.png"
          done
          ffmpeg -y -hide_banner -loglevel error -i "$d/fist-07.mp4" -vf 'fps=3,scale=320:180,tile=5x3:nb_frames=15' -frames:v 1 "$d/timeline.png"
          ffmpeg -y -hide_banner -loglevel error -i "$d/fist-07.mp4" -vf 'fps=12,scale=640:360:flags=lanczos' -loop 0 "$d/fist-07.gif"
          sha256sum "$d/"*.mp4 "$d/"*.gif "$d/"*.png > "$d/SHA256SUMS.txt"
          rm "$d/fist-07.avi"
      - name: Upload exact-SHA native art+QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfx-fist07-native
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/vfx-fist07/*.txt
            /tmp/vfx-fist07/*.log
            /tmp/vfx-fist07/*.png
            /tmp/vfx-fist07/*.gif
            /tmp/vfx-fist07/*.mp4
