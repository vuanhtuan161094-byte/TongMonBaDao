name: Economy-A Playable V2 Timers Ledger UI
# GP-02C1 terminal HP, Injury, saved claims, occupation, offline and FULL cumulative.

on:
  workflow_dispatch:
  push:
    paths:
      - 'godot/tests/simulation/economy_a_playable_test.gd'
      - 'godot/tests/presentation/economy_a_landscape_ui_test.gd'
      - 'godot/src/simulation/economy/economy_system.gd'
      - '.github/workflows/economy-a-playable.yml'
      - 'godot/src/simulation/state/disciple_state.gd'
      - 'godot/src/simulation/state/sect_state.gd'
      - 'godot/src/simulation/state/simulation_state.gd'
      - 'godot/src/simulation/combat/hunting_pve_run_v2.gd'
      - 'godot/src/simulation/core/simulation_scheduler.gd'
      - 'godot/src/simulation/workforce/workforce_system.gd'
      - 'godot/src/simulation/building/building_system.gd'
      - 'godot/src/simulation/cultivation/disciple_training_action_v2.gd'
      - 'godot/src/simulation/cultivation/disciple_body_training_facility_v2.gd'
      - 'godot/src/presentation/disciple_presentation_snapshot_v2.gd'
      - 'godot/src/presentation/p3_2_landscape_sect.gd'
      - 'godot/tests/simulation/gp_02c1_injury_settlement_test.gd'
      - 'godot/tests/presentation/gp_02c1_injury_presentation_test.gd'
      - '.github/workflows/gp-02c1-injury-settlement.yml'

permissions:
  contents: read

jobs:
  economy-a-focused:
    name: Godot 4.7.2 Economy-A focused and cumulative
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install official Godot 4.7.2 binary
        shell: bash
        run: |
          set -euo pipefail
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          GODOT_SHA256="cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
          curl --fail --location --retry 3 --output /tmp/godot.zip "$GODOT_URL"
          echo "$GODOT_SHA256  /tmp/godot.zip" | sha256sum --check --strict
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Confirm official version
        run: godot --version

      - name: Restore canonical female Stage A runtime pack
        shell: bash
        run: |
          set -euo pipefail
          PACK="/tmp/female_normal_v1_stageA_runtime_pack_v2_quant.zip"
          cat             .github/assets/p3/female_stage_a/part01.b64             .github/assets/p3/female_stage_a/part02.b64             .github/assets/p3/female_stage_a/part03.b64             .github/assets/p3/female_stage_a/part04.b64             .github/assets/p3/female_stage_a/part05.b64             .github/assets/p3/female_stage_a/part06.b64             .github/assets/p3/female_stage_a/part07.b64             .github/assets/p3/female_stage_a/part08.b64             .github/assets/p3/female_stage_a/part09.b64             .github/assets/p3/female_stage_a/part10.b64             .github/assets/p3/female_stage_a/part11.b64             .github/assets/p3/female_stage_a/part12.b64             .github/assets/p3/female_stage_a/part13.b64             .github/assets/p3/female_stage_a/part14.b64             .github/assets/p3/female_stage_a/part15a.b64             .github/assets/p3/female_stage_a/part15b.b64             .github/assets/p3/female_stage_a/part16.b64             .github/assets/p3/female_stage_a/part17.b64             .github/assets/p3/female_stage_a/part18.b64             .github/assets/p3/female_stage_a/part19.b64             .github/assets/p3/female_stage_a/part20.b64             | tr -d '\r\n\t ' | base64 --decode > "$PACK"
          test "$(stat -c%s "$PACK")" -eq 44838
          echo "6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  $PACK" | sha256sum --check --strict
          unzip -q "$PACK" -d .

      - name: Import project scripts and resources
        run: godot --headless --path godot --import

      - name: Diagnose Economy-A EconomySystem script independently
        run: godot --headless --path godot --check-only --script res://src/simulation/economy/economy_system.gd

      - name: Parse GP-02C1 changed code and tests
        shell: bash
        run: |
          set -euo pipefail
          for script in             res://src/simulation/workforce/workforce_system.gd             res://src/presentation/p3_2_landscape_sect.gd             res://tests/presentation/p3_o3_real_mine_loop_test.gd \
            res://tests/presentation/gp_01_v2_mine_vertical_slice_test.gd \
            res://src/simulation/cultivation/disciple_training_action_v2.gd \
            res://src/simulation/cultivation/disciple_body_training_facility_v2.gd \
            res://tests/presentation/gp_02a_v2_cultivation_panel_test.gd \
            res://tests/simulation/gp_02b1_v2_occupation_guard_test.gd \
            res://src/simulation/state/disciple_state.gd \
            res://src/simulation/state/sect_state.gd \
            res://src/simulation/state/simulation_state.gd \
            res://src/simulation/combat/hunting_pve_run_v2.gd \
            res://src/simulation/core/simulation_scheduler.gd \
            res://src/simulation/building/building_system.gd \
            res://src/presentation/disciple_presentation_snapshot_v2.gd \
            res://tests/simulation/gp_02c1_injury_settlement_test.gd \
            res://tests/presentation/gp_02c1_injury_presentation_test.gd; do
            godot --headless --path godot --check-only --script "$script"
          done

      - name: Parse new Economy-A simulation and landscape scene tests
        run: |
          godot --headless --path godot --check-only --script res://tests/simulation/economy_a_playable_test.gd
          godot --headless --path godot --check-only --script res://tests/presentation/economy_a_landscape_ui_test.gd

      - name: Run Economy-A focused real V2 timer, wages, market and save
        run: godot --headless --path godot -s res://tests/simulation/economy_a_playable_test.gd

      - name: Run Economy-A landscape hall and market real UI
        run: godot --headless --path godot -s res://tests/presentation/economy_a_landscape_ui_test.gd

      - name: Run O5 real produced-resource consumer baseline
        run: godot --headless --path godot -s res://tests/presentation/p3_o5_real_consumption_loop_test.gd

      - name: Run GP-02C1 focused injury transaction T01-T23
        run: godot --headless --path godot -s res://tests/simulation/gp_02c1_injury_settlement_test.gd

      - name: Run GP-02C1 V2 injury presentation
        run: godot --headless --path godot -s res://tests/presentation/gp_02c1_injury_presentation_test.gd

      - name: Run original DV2 five-level real PvE contract
        run: godot --headless --path godot -s res://tests/simulation/dv2_02_five_level_pve_test.gd

      - name: Run GP-02B1 prior backend occupation regression
        run: godot --headless --path godot -s res://tests/simulation/gp_02b1_v2_occupation_guard_test.gd

      - name: Run GP-02A authentic V2 cultivation presentation and safe commands
        run: godot --headless --path godot -s res://tests/presentation/gp_02a_v2_cultivation_panel_test.gd

      - name: Run GP-01 authentic V2 recruit to Mine and offline resume
        run: godot --headless --path godot -s res://tests/presentation/gp_01_v2_mine_vertical_slice_test.gd

      - name: Run O3 real player Mine loop persistence
        run: godot --headless --path godot -s res://tests/presentation/p3_o3_real_mine_loop_test.gd

      - name: Run O4 real Spirit Field plot reservation and save
        run: godot --headless --path godot -s res://tests/presentation/p3_o4_spirit_field_loop_test.gd

      - name: Run O7 real Forestry carry cycle
        run: godot --headless --path godot -s res://tests/presentation/p3_o7_linh_forest_test.gd

      - name: Run O8 real timed Alchemy consumer
        run: godot --headless --path godot -s res://tests/presentation/p3_o8_alchemy_loop_test.gd

      - name: Run DV2 E3.1 slot and training transfer regression
        run: godot --headless --path godot -s res://tests/simulation/dv2_03_e3_1_training_priority_regression_test.gd

      - name: Run P3.7A1 Mine backend regression
        run: godot --headless --path godot -s res://tests/simulation/p3_7a1_building_authority_test.gd

      - name: Run existing P3.6A scene regression
        run: godot --headless --path godot -s res://tests/presentation/p3_6a_playable_slice_test.gd

      - name: Run O2 Dẫn Tiên live map regression
        run: godot --headless --path godot -s res://tests/presentation/p3_o2_recruitment_map_test.gd

      - name: Run O9 multi-producer regression
        run: godot --headless --path godot -s res://tests/presentation/p3_o9_m2_production_rehearsal_test.gd

      - name: Run DV2 live V2 runtime and training regression
        run: |
          godot --headless --path godot -s res://tests/simulation/dv2_03_live_runtime_integration_test.gd
          godot --headless --path godot -s res://tests/simulation/dv2_03_e3_1_training_priority_regression_test.gd

      - name: Run SAFE save and warehouse regressions
        run: |
          godot --headless --path godot -s res://tests/simulation/safe_01_save_recovery_test.gd
          godot --headless --path godot -s res://tests/simulation/safe_02_warehouse_migration_test.gd

      - name: Run full P3.7 cumulative regression
        shell: pwsh
        run: ./tools/godot/Verify-P3-7C1-Foundation-Dan-Tien-Full.ps1 -GodotBin /usr/local/bin/godot

      - name: Run O6 independent existing real Mine and Forge baseline (unmodified assertion)
        run: godot --headless --path godot -s res://tests/presentation/p3_o6_m1_release_rehearsal_test.gd
