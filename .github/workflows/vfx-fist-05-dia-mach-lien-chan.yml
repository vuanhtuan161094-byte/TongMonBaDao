name: VFX-FIST-05 V8 isolated rock chips and grounded dust native Godot 4.7.2
on:
  workflow_dispatch:
  push:
    branches: [integration/pve-p0-playable-ui-20261103]
    paths:
      - '.github/workflows/vfx-fist-05-dia-mach-lien-chan.yml'
      - 'godot/labs/combat_lab/fist05/**'
      - 'tools/vfx/generate_fist05_v3_optimized.py'
      - 'godot/tests/labs/combat_lab/vfx_shared_load_benchmark.gd'
      - 'godot/tests/labs/combat_lab/vfx_fist05_contract_test.gd'
permissions:
  contents: read
jobs:
  native-godot-film:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_AUDIO_DRIVER: Dummy
      GODOT_RENDERING_DRIVER: opengl3
    steps:
      - uses: actions/checkout@v4
      - name: Official SHA256 pinned Godot 4.7.2 and movie prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg unzip python3-pil python3-numpy
          curl --fail --location --retry 3 -o /tmp/godot472.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot472.zip' | sha256sum --check --strict
          unzip -q /tmp/godot472.zip -d /tmp
          sudo install -m0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p /tmp/vfx-fist05
          godot --version | tee /tmp/vfx-fist05/engine.txt
          echo "V8_END_ROCKFALL=EIGHT_ORIGINAL_PAINTED_CHIPS_NO_POLYGON_HOLES; SOURCE_SHA=$GITHUB_SHA; SOURCE_ID=tmb.skill.fist.ba_quyen.active_04.human; EFFECT=damage; ELEMENT=fire; SHAPE=circle; CAP=3; CAST=0.45; RANGE=4; RADIUS=3; ART=retouched original first-party geology + one contiguous fissure; atlas_raw_MiB=7.0; previous_raw_MiB=22.5; NO_RIG=true; VIEW_ONLY=true; OWNER_VISUAL_PENDING; PVE_INTEGRATION_HOLD" > /tmp/vfx-fist05/metadata.txt
      - name: Restore existing Stage A character texture (without tracked changes)
        shell: bash
        run: |
          set -euo pipefail
          cat .github/assets/p3/female_stage_a/part{01..14}.b64 .github/assets/p3/female_stage_a/part15a.b64 .github/assets/p3/female_stage_a/part15b.b64 .github/assets/p3/female_stage_a/part{16..20}.b64 | tr -d '\r\n\t ' | base64 --decode > /tmp/tmb_stage_a_pack.zip
          echo '6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  /tmp/tmb_stage_a_pack.zip' | sha256sum --check --strict
          unzip -q /tmp/tmb_stage_a_pack.zip -d .
      - name: Produce optimized 24-pose 7.0 MiB original painted atlas set
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/vfx/generate_fist05_v3_optimized.py | tee /tmp/vfx-fist05/atlas.log
          grep -Fq 'FIST05_OPTIMIZED_V8_PASS atlas_frames=24 textures=3 raw_rgba_bytes=7340032 no_rig=true' /tmp/vfx-fist05/atlas.log
          for master in seismic_ground_master molten_shard_master spires_master; do
            test -s "godot/labs/combat_lab/fist05/assets/$master.webp"
          done
          for n in seismic_main seismic_hit seismic_path; do
            test -s "godot/labs/combat_lab/fist05/assets/optimized_v3/$n.png"
            cp "godot/labs/combat_lab/fist05/assets/optimized_v3/$n.png" "/tmp/vfx-fist05/$n.png"
          done
          sha256sum /tmp/vfx-fist05/{seismic_main,seismic_hit,seismic_path}.png > /tmp/vfx-fist05/ATLAS_SHA256SUMS.txt
          # V7 art-regression guard: late frames must change material position
          # (a painted rock fractures and falls; never one frozen sprite fade).
          python3 - <<'ROCKFALL' | tee /tmp/vfx-fist05/rockfall_frames_check.txt
          from PIL import Image, ImageChops
          im=Image.open('/tmp/vfx-fist05/seismic_main.png').convert('RGBA')
          frame=lambda i: im.crop(((i%4)*256, (i//4)*256, (i%4+1)*256, (i//4+1)*256))
          apex=frame(4+6)
          tumble=frame(4+8)
          settle=frame(4+10)
          assert apex.getbbox() and tumble.getbbox() and settle.getbbox()
          # Verify per-pose geometry differs, rather than alpha-only freeze.
          def shape(img): return img.getchannel('A').point(lambda x:255 if x>35 else 0)
          different=ImageChops.difference(shape(apex),shape(tumble))
          changed=ImageChops.difference(shape(tumble),shape(settle))
          assert different.getbbox() and changed.getbbox()
          print('FIST05_V8_ROCKFALL_FRAMES=PASS apex=10 tumble=12 settle=14 geometry_changes=true')
          ROCKFALL
          python3 - <<'REPORT' | tee /tmp/vfx-fist05/texture_budget.txt
          from PIL import Image
          from pathlib import Path
          p=Path('/tmp/vfx-fist05')
          files=['seismic_main.png','seismic_hit.png','seismic_path.png']
          raw=sum(Image.open(p/f).width*Image.open(p/f).height*4 for f in files)
          prior=40*384*384*4
          print('RAW_RGBA_BYTES=',raw)
          print('PREVIOUS_RAW_RGBA_BYTES=',prior)
          print('RAW_RGBA_REDUCTION_PCT=',round(100*(1-raw/prior),2))
          print('VIDEO_FPS_FIXED_CLOCK_NOT_ANDROID_BENCHMARK=TRUE')
          assert raw==7340032
          REPORT
      - name: Strict import parse and focused contract test
        shell: bash
        run: |
          set -euo pipefail
          bash tools/qa/run_godot_strict.sh --headless --path godot --import 2>&1 | tee /tmp/vfx-fist05/import.log
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/combat_lab/fist05/dia_mach_lien_chan.gd 2>&1 | tee /tmp/vfx-fist05/parse.log
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/labs/combat_lab/vfx_fist05_contract_test.gd 2>&1 | tee /tmp/vfx-fist05/test.log
          grep -Fq 'VFX_FIST05_FOCUSED_RESULT=PASS failures=0' /tmp/vfx-fist05/test.log
      - name: Render genuine 1280x720 Godot movie and extract timecoded frames
        shell: bash
        run: |
          set -euo pipefail
          d=/tmp/vfx-fist05
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 --write-movie "$d/fist-05.avi" --quit-after 185 res://labs/combat_lab/fist05/dia_mach_lien_chan.tscn 2>&1 | tee "$d/movie.log"
          test -s "$d/fist-05.avi"
          ffmpeg -y -hide_banner -loglevel error -i "$d/fist-05.avi" -pix_fmt yuv420p -c:v libx264 -crf 16 -movflags +faststart "$d/fist-05.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,avg_frame_rate -of default=noprint_wrappers=1 "$d/fist-05.mp4" | tee "$d/dimensions.txt"
          grep -Fxq 'width=1280' "$d/dimensions.txt"
          grep -Fxq 'height=720' "$d/dimensions.txt"
          for at in 0.11 0.28 0.42 0.57 0.75 0.92 1.04 1.13 1.28 1.55 1.93 2.40 2.83; do
            ffmpeg -y -hide_banner -loglevel error -ss "$at" -i "$d/fist-05.mp4" -frames:v 1 "$d/frame-$at.png"
          done
          ffmpeg -y -hide_banner -loglevel error -i "$d/fist-05.mp4" -vf 'fps=4,scale=320:180,tile=4x3:nb_frames=12' -frames:v 1 "$d/timeline.png"
          ffmpeg -y -hide_banner -loglevel error -i "$d/fist-05.mp4" -vf 'fps=12,scale=640:360:flags=lanczos' -loop 0 "$d/fist-05.gif"
          sha256sum "$d/"*.mp4 "$d/"*.gif "$d/"*.png > "$d/SHA256SUMS.txt"
          rm "$d/fist-05.avi"
      - name: Shared real-time VFX-only load scenarios 1 6 12 30 (Ubuntu Xvfb, NOT Android)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --audio-driver Dummy --path godot --resolution 1280x720 -s res://tests/labs/combat_lab/vfx_shared_load_benchmark.gd 2>&1 | tee /tmp/vfx-fist05/stress.log
          grep -Fq 'VFX_LOAD_BENCH_RESULT=PASS cases=1,6,12,30' /tmp/vfx-fist05/stress.log
          grep -Fq 'GODOT_STRICT_PASS exit=0' /tmp/vfx-fist05/stress.log
      - name: Upload exact-SHA art and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfx-fist05-native
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/vfx-fist05/*.txt
            /tmp/vfx-fist05/*.log
            /tmp/vfx-fist05/*.png
            /tmp/vfx-fist05/*.gif
            /tmp/vfx-fist05/*.mp4
