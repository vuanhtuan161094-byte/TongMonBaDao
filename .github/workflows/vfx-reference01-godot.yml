name: VFX-REF-01 | JX1 SourceVL V9 native Godot reference movie
on:
  workflow_dispatch:
  push:
    branches: [integration/pve-p0-playable-ui-20261103]
    paths:
      - '.github/workflows/vfx-reference01-godot.yml'
      - 'godot/labs/combat_lab/reference01/**'
      - 'godot/tests/labs/combat_lab/vfx_reference01_contract_test.gd'
permissions:
  contents: read
jobs:
  source-reference-film:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_AUDIO_DRIVER: Dummy
      GODOT_RENDERING_DRIVER: opengl3
    steps:
      - uses: actions/checkout@v4
      - name: SHA256 pinned official Godot 4.7.2 + Xvfb + ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg unzip
          curl --fail --location --retry 3 -o /tmp/godot472.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot472.zip' | sha256sum --check --strict
          unzip -q /tmp/godot472.zip -d /tmp
          sudo install -m0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p "$RUNNER_TEMP/vfx-reference01"
          godot --version | tee "$RUNNER_TEMP/vfx-reference01/engine.txt"
          printf 'SOURCE_SHA=%s\nSCENE=res://labs/combat_lab/reference01/jx_vl_v9_reference_viewer.tscn\nRENDERER=gl_compatibility\nLAB_ONLY=1\nPVE_INTEGRATION_HOLD=1\n' "$GITHUB_SHA" > "$RUNNER_TEMP/vfx-reference01/metadata.txt"
      - name: Restore existing Stage A dependency without changing tracked source
        shell: bash
        run: |
          set -euo pipefail
          cat .github/assets/p3/female_stage_a/part{01..14}.b64 .github/assets/p3/female_stage_a/part15a.b64 .github/assets/p3/female_stage_a/part15b.b64 .github/assets/p3/female_stage_a/part{16..20}.b64 | tr -d '\r\n\t ' | base64 --decode > /tmp/tmb_stage_a_pack.zip
          test "$(stat -c%s /tmp/tmb_stage_a_pack.zip)" -eq 44838
          echo '6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  /tmp/tmb_stage_a_pack.zip' | sha256sum --check --strict
          unzip -q /tmp/tmb_stage_a_pack.zip -d .
      - name: Strict Godot import parse and manifest/atlas contract
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-reference01"
          bash tools/qa/run_godot_strict.sh --headless --path godot --import 2>&1 | tee "$d/import.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/combat_lab/reference01/jx_vl_v9_reference_viewer.gd 2>&1 | tee "$d/parse.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/labs/combat_lab/vfx_reference01_contract_test.gd 2>&1 | tee "$d/test.log"
          grep -Fq 'VFX_REF01_FOCUSED_RESULT=PASS failures=0' "$d/test.log"
      - name: Native Godot 1280x720 film and twelve same-clock stills
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-reference01"
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 --write-movie "$d/jx-vl-v9-source-review.avi" --quit-after 336 res://labs/combat_lab/reference01/jx_vl_v9_reference_viewer.tscn 2>&1 | tee "$d/movie.log"
          test -s "$d/jx-vl-v9-source-review.avi"
          ffmpeg -y -hide_banner -loglevel error -i "$d/jx-vl-v9-source-review.avi" -pix_fmt yuv420p -c:v libx264 -crf 16 "$d/jx-vl-v9-source-review.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,avg_frame_rate -of default=noprint_wrappers=1 "$d/jx-vl-v9-source-review.mp4" | tee "$d/dimensions.txt"
          grep -Fxq 'width=1280' "$d/dimensions.txt"
          grep -Fxq 'height=720' "$d/dimensions.txt"
          for at in 0.15 0.40 0.75 1.05 1.35 1.75 2.15 2.55 3.05 3.70 4.60 5.25; do
            ffmpeg -y -hide_banner -loglevel error -ss "$at" -i "$d/jx-vl-v9-source-review.mp4" -frames:v 1 "$d/frame-$at.png"
          done
          ffmpeg -y -hide_banner -loglevel error -i "$d/jx-vl-v9-source-review.mp4" -vf 'fps=4,scale=320:180,tile=5x4:nb_frames=20' -frames:v 1 "$d/timeline.png"
          sha256sum "$d/"*.mp4 "$d/"*.png > "$d/SHA256SUMS.txt"
          rm "$d/jx-vl-v9-source-review.avi"
      - name: Upload video and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfx-reference01-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/vfx-reference01/*.log
            ${{ runner.temp }}/vfx-reference01/*.txt
            ${{ runner.temp }}/vfx-reference01/*.png
            ${{ runner.temp }}/vfx-reference01/*.mp4
