name: P3 O9 M2 Multi Producer Rehearsal

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'godot/tests/simulation/sx07b_preserved_source_job_test.gd'
      - 'godot/src/simulation/resource/resource_registry.gd'
      - 'godot/src/simulation/building/medicine_resource_source_v1.gd'
      - 'godot/src/simulation/building/alchemy_recipe_registry.gd'
      - 'godot/tests/simulation/sx07_source_provenance_test.gd'
      - 'godot/tests/simulation/sx02_medicine_catalogue_test.gd'
      - 'godot/tests/simulation/v57_sx_body_breakthrough_transaction_test.gd'
      - 'godot/tests/simulation/v57_sx_contract_guard_test.gd'
      - 'godot/src/simulation/building/medicine_catalogue_v2.gd'
      - 'godot/src/simulation/cultivation/cultivation_gate_v57.gd'
      - 'godot/src/simulation/cultivation/b3_pill_satiety_v1.gd'
      - 'godot/tests/simulation/v57_paid_producers_body_market_test.gd'
      - 'godot/tests/simulation/v57_alchemy_quality_test.gd'
      - 'godot/tests/simulation/v57_save_480_receipts_benchmark_test.gd'
      - 'godot/src/simulation/economy/economy_system.gd'
      - 'godot/src/simulation/cultivation/disciple_body_gate_transaction_v2.gd'
      - 'godot/src/presentation/p3/sect_isometric_world_v1.gd'
      - 'godot/src/simulation/building/building_system.gd'
      - 'godot/src/simulation/building/production_source_options_v1.gd'
      - 'tools/qa/run_godot_strict.sh'
      - 'godot/tests/simulation/v57_worksite_scale_480_test.gd'
      - '.github/workflows/p3-o9-m2-production-rehearsal.yml'
  push:
    paths:
      - 'godot/tests/simulation/sx07b_preserved_source_job_test.gd'
      - 'godot/src/simulation/resource/resource_registry.gd'
      - 'godot/src/simulation/building/medicine_resource_source_v1.gd'
      - 'godot/src/simulation/building/alchemy_recipe_registry.gd'
      - 'godot/tests/simulation/sx07_source_provenance_test.gd'
      - 'godot/tests/simulation/sx02_medicine_catalogue_test.gd'
      - 'godot/tests/simulation/v57_sx_body_breakthrough_transaction_test.gd'
      - 'godot/tests/simulation/v57_sx_contract_guard_test.gd'
      - 'godot/src/simulation/building/medicine_catalogue_v2.gd'
      - 'godot/src/simulation/cultivation/cultivation_gate_v57.gd'
      - 'godot/src/simulation/cultivation/b3_pill_satiety_v1.gd'
      - 'godot/tests/simulation/v57_paid_producers_body_market_test.gd'
      - 'godot/tests/simulation/v57_alchemy_quality_test.gd'
      - 'godot/tests/simulation/v57_save_480_receipts_benchmark_test.gd'
      - 'godot/src/simulation/economy/economy_system.gd'
      - 'godot/src/simulation/cultivation/disciple_body_gate_transaction_v2.gd'
      - 'godot/src/presentation/p3/sect_isometric_world_v1.gd'
      - 'godot/tests/presentation/p3_o9_m2_production_rehearsal_test.gd'
      - 'godot/src/simulation/building/building_system.gd'
      - 'godot/src/simulation/building/production_source_options_v1.gd'
      - 'tools/qa/run_godot_strict.sh'
      - 'godot/tests/simulation/v57_worksite_scale_480_test.gd'
      - '.github/workflows/p3-o9-m2-production-rehearsal.yml'

permissions:
  contents: read

jobs:
  p3-o9-focused:
    name: Godot 4.7.2 O9 M2 multi-producer rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install official Godot 4.7.2 binary
        shell: bash
        run: |
          set -euo pipefail
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          GODOT_SHA256="cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
          curl --fail --location --retry 3 --output /tmp/godot.zip "$GODOT_URL"
          echo "$GODOT_SHA256  /tmp/godot.zip" | sha256sum --check --strict
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Confirm official version
        run: godot --version

      - name: Restore canonical female Stage A runtime pack
        shell: bash
        run: |
          set -euo pipefail
          PACK="/tmp/female_normal_v1_stageA_runtime_pack_v2_quant.zip"
          cat .github/assets/p3/female_stage_a/part01.b64 .github/assets/p3/female_stage_a/part02.b64 .github/assets/p3/female_stage_a/part03.b64 .github/assets/p3/female_stage_a/part04.b64 .github/assets/p3/female_stage_a/part05.b64 .github/assets/p3/female_stage_a/part06.b64 .github/assets/p3/female_stage_a/part07.b64 .github/assets/p3/female_stage_a/part08.b64 .github/assets/p3/female_stage_a/part09.b64 .github/assets/p3/female_stage_a/part10.b64 .github/assets/p3/female_stage_a/part11.b64 .github/assets/p3/female_stage_a/part12.b64 .github/assets/p3/female_stage_a/part13.b64 .github/assets/p3/female_stage_a/part14.b64 .github/assets/p3/female_stage_a/part15a.b64 .github/assets/p3/female_stage_a/part15b.b64 .github/assets/p3/female_stage_a/part16.b64 .github/assets/p3/female_stage_a/part17.b64 .github/assets/p3/female_stage_a/part18.b64 .github/assets/p3/female_stage_a/part19.b64 .github/assets/p3/female_stage_a/part20.b64 | tr -d '\r\n\t ' | base64 --decode > "$PACK"
          test "$(stat -c%s "$PACK")" -eq 44838
          echo "6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  $PACK" | sha256sum --check --strict
          unzip -q "$PACK" -d .

      - name: Import project scripts and resources
        run: bash tools/qa/run_godot_strict.sh --headless --path godot --import

      - name: Parse O9 test
        run: bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://tests/presentation/p3_o9_m2_production_rehearsal_test.gd

      - name: Parse and run V5.7 480-worksite regression
        shell: bash
        run: |
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://tests/simulation/v57_worksite_scale_480_test.gd
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/simulation/v57_worksite_scale_480_test.gd

      - name: Run SX57 Body pill and Tu Vi gate receipts
        shell: bash
        run: |
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://tests/simulation/v57_sx_body_breakthrough_transaction_test.gd
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/simulation/v57_sx_body_breakthrough_transaction_test.gd

      - name: SX-07B original ID Mine/Forest job and cold Save
        shell: bash
        run: |
          set -euo pipefail
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://tests/simulation/sx07b_preserved_source_job_test.gd
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/simulation/sx07b_preserved_source_job_test.gd

      - name: SX-07 earned-source provenance and historical catalogue
        shell: bash
        run: |
          set -euo pipefail
          for script in sx07_source_provenance_test.gd sx02_medicine_catalogue_test.gd; do
            bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script "res://tests/simulation/$script"
            bash tools/qa/run_godot_strict.sh --headless --path godot -s "res://tests/simulation/$script"
          done

      - name: Run SX57 authoring contract
        shell: bash
        run: |
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://tests/simulation/v57_sx_contract_guard_test.gd
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/simulation/v57_sx_contract_guard_test.gd

      - name: Run V5.7 producer, quality and 480-save contracts
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            v57_paid_producers_body_market_test.gd \
            v57_alchemy_quality_test.gd \
            v57_save_480_receipts_benchmark_test.gd; do
            bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script "res://tests/simulation/$script"
            bash tools/qa/run_godot_strict.sh --headless --path godot -s "res://tests/simulation/$script"
          done

      - name: Run O9 M2 multi-producer rehearsal
        run: bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/presentation/p3_o9_m2_production_rehearsal_test.gd

      - name: Run O8 Alchemy regression
        run: bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/presentation/p3_o8_alchemy_loop_test.gd

      - name: Run O7 Linh Lam regression
        run: bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/presentation/p3_o7_linh_forest_test.gd

      - name: Run P3.6A scene regression
        run: bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/presentation/p3_6a_playable_slice_test.gd

      - name: Preserve strict Godot run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmb-o9-strict-godot-${{ github.sha }}
          path: ${{ runner.temp }}/tmb_godot_strict/*.log
          if-no-files-found: warn
          retention-days: 14
