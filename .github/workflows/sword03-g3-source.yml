name: Sword03 G0 canon / G3 SOURCE_PENDING is not art PASS
on:
  push:
    branches: [integration/pve-p0-playable-ui-20261103]
    paths:
      - 'godot/labs/combat_lab/sword_human_tu_phuong_phi_nhan/**'
      - 'tools/vfx/check_sword03_tu_phuong.py'
      - '.github/workflows/sword03-g3-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            godot/data/combat/v63_sword_combat_catalog.json
            godot/labs/combat_lab/sword_human_tu_phuong_phi_nhan
            tools/vfx/check_sword03_tu_phuong.py
      - name: Install image validator
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Self-test real alpha vs solid and padded fake mattes
        shell: bash
        run: python tools/vfx/check_sword03_tu_phuong.py --selftest
      - name: Verify canonical skill and fail-closed G3 source status
        shell: bash
        run: python tools/vfx/check_sword03_tu_phuong.py --output "$RUNNER_TEMP/sword03-source-preview"
      - name: Upload ONLY a genuine approved-source preview if source exists
        uses: actions/upload-artifact@v4
        with:
          name: sword03-g3-source-${{ github.sha }}
          path: ${{ runner.temp }}/sword03-source-preview/
          retention-days: 14
          if-no-files-found: ignore
