name: PVE-P0 Free Hunt Focused Godot 4.7.2

on:
  workflow_dispatch:
  push:
    branches:
      - integration/pve-p0-playable-ui-20261103
    paths:
      - 'godot/src/simulation/combat/**'
      - 'godot/src/simulation/core/simulation_runtime_clock_v2.gd'
      - 'godot/src/presentation/p3/pve_sect_world_view_v1.gd'
      - 'godot/src/presentation/p3_2_landscape_sect.gd'
      - 'godot/tests/presentation/pve_p0_ui_player_entry_test.gd'
      - 'godot/tests/presentation/pve_aux02_world_input_contract_test.gd'
      - 'godot/tests/simulation/pve_p0_*'
      - 'godot/tests/simulation/one_game_r3_continuous_save_test.gd'
      - 'tools/windows/run/Start-TRI03Game.ps1'
      - 'tools/windows/run/tri03_launcher_support.ps1'
      - 'tools/windows/run/tri03_runtime_source_manifest.json'
      - 'tools/windows/qa/Test-TRI03LauncherSafety.ps1'
      - '.github/workflows/pve-p0-free-hunt.yml'
permissions:
  contents: read

jobs:
  focused:
    name: Source A real solo XP/loot, 30x20, minimap and Save Reload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install official Godot 4.7.2 binary
        shell: bash
        run: |
          set -euo pipefail
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          GODOT_SHA256="cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
          curl --fail --location --retry 3 --output /tmp/godot.zip "$GODOT_URL"
          echo "$GODOT_SHA256  /tmp/godot.zip" | sha256sum --check --strict
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Confirm official version
        run: godot --version

      - name: Launcher single-process and lifecycle regression
        shell: pwsh
        run: ./tools/windows/qa/Test-TRI03LauncherSafety.ps1

      - name: Restore canonical female Stage A runtime pack
        shell: bash
        run: |
          set -euo pipefail
          PACK="/tmp/female_normal_v1_stageA_runtime_pack_v2_quant.zip"
          cat             .github/assets/p3/female_stage_a/part01.b64             .github/assets/p3/female_stage_a/part02.b64             .github/assets/p3/female_stage_a/part03.b64             .github/assets/p3/female_stage_a/part04.b64             .github/assets/p3/female_stage_a/part05.b64             .github/assets/p3/female_stage_a/part06.b64             .github/assets/p3/female_stage_a/part07.b64             .github/assets/p3/female_stage_a/part08.b64             .github/assets/p3/female_stage_a/part09.b64             .github/assets/p3/female_stage_a/part10.b64             .github/assets/p3/female_stage_a/part11.b64             .github/assets/p3/female_stage_a/part12.b64             .github/assets/p3/female_stage_a/part13.b64             .github/assets/p3/female_stage_a/part14.b64             .github/assets/p3/female_stage_a/part15a.b64             .github/assets/p3/female_stage_a/part15b.b64             .github/assets/p3/female_stage_a/part16.b64             .github/assets/p3/female_stage_a/part17.b64             .github/assets/p3/female_stage_a/part18.b64             .github/assets/p3/female_stage_a/part19.b64             .github/assets/p3/female_stage_a/part20.b64             | tr -d '\r\n\t ' | base64 --decode > "$PACK"
          test "$(stat -c%s "$PACK")" -eq 44838
          echo "6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  $PACK" | sha256sum --check --strict
          unzip -q "$PACK" -d .


      - name: Import project with official Godot 4.7.2
        run: godot --headless --path godot --import

      - name: Parse P0 production code and tests
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            res://src/simulation/combat/pve_distributed_world_v1.gd \
            res://src/simulation/combat/pve_per_kill_reward_v1.gd \
            res://src/simulation/combat/pve_p0_commands_v1.gd \
            res://src/simulation/combat/hunting_pve_run_v2.gd \
            res://src/simulation/combat/map_battle_v2.gd \
            res://src/simulation/combat/map_battle_snapshot_v2.gd \
            res://src/presentation/p3/pve_sect_world_view_v1.gd \
            res://src/presentation/p3_2_landscape_sect.gd \
            res://tests/presentation/pve_p0_ui_player_entry_test.gd \
            res://tests/presentation/pve_aux02_world_input_contract_test.gd \
            res://tests/simulation/pve_p0_30_independent_hunters_test.gd \
            res://tests/simulation/pve_p0_natural_solo_reward_test.gd \
            res://tests/simulation/one_game_r3_continuous_save_test.gd; do
            godot --headless --path godot --check-only --script "$script"
          done

      - name: P0 real 30 hunters in 20 areas, guard, target travel and team buffs
        run: godot --headless --path godot -s res://tests/simulation/pve_p0_30_independent_hunters_test.gd

      - name: P0 New Game real V2 solo 10 HP0, second recruit joins/returns, cold reload
        run: godot --headless --path godot -s res://tests/simulation/pve_p0_natural_solo_reward_test.gd

      - name: R3 continuous New Game, production and PvE across three cold processes
        shell: bash
        run: |
          set -euo pipefail
          export XDG_CONFIG_HOME="${RUNNER_TEMP}/tmb-r3-config"
          export XDG_DATA_HOME="${RUNNER_TEMP}/tmb-r3-data"
          export XDG_CACHE_HOME="${RUNNER_TEMP}/tmb-r3-cache"
          godot --headless --path godot -s res://tests/simulation/one_game_r3_continuous_save_test.gd -- create
          godot --headless --path godot -s res://tests/simulation/one_game_r3_continuous_save_test.gd -- continue
          godot --headless --path godot -s res://tests/simulation/one_game_r3_continuous_save_test.gd -- verify

      - name: P0 player entry on main 1280x720 scene
        run: godot --headless --path godot -s res://tests/presentation/pve_p0_ui_player_entry_test.gd

      - name: Existing modular P3.2 live-map regression
        run: godot --headless --path godot -s res://tests/presentation/p3_2_live_modular_map_test.gd

      - name: Existing real Source A minimap and camera input regression
        run: godot --headless --path godot -s res://tests/presentation/pve_aux02_world_input_contract_test.gd

      - name: Existing six-member atomic formation and Save Restore regression
        run: godot --headless --path godot -s res://tests/simulation/pve_group_move_unique_formation_test.gd

      - name: Existing V6.3 Codex per-kill receipt exact-once regression
        run: godot --headless --path godot -s res://tests/simulation/one_game_r2_open_world_codex_receipt_test.gd
