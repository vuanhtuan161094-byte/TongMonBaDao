name: VFX-FIST-08 R1 Phan Chan Quyen Production V4 three-stage moving GUARD
on:
  workflow_dispatch:
  push:
    branches: [integration/pve-p0-playable-ui-20261103]
    paths:
      - '.github/workflows/vfx-fist-08-phan-chan-quyen.yml'
      - 'godot/labs/combat_lab/fist08/**'
      - 'tools/vfx/generate_fist08_phan_chan_quyen.py'
      - 'godot/tests/labs/combat_lab/vfx_fist08_contract_test.gd'
      - 'docs/operations/vfx_packets/FIST08_R1_PHAN_CHAN_QUYEN_V4.json'
permissions:
  contents: read
jobs:
  native-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GODOT_AUDIO_DRIVER: Dummy
      GODOT_RENDERING_DRIVER: opengl3
    steps:
      - uses: actions/checkout@v4
      - name: Install exact Godot 4.7.2 and source image QA
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg unzip python3-pil python3-numpy
          curl --fail --location --retry 3 -o /tmp/godot472.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot472.zip' | sha256sum --check --strict
          unzip -q /tmp/godot472.zip -d /tmp
          sudo install -m0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p /tmp/vfx-fist08
          godot --version | tee /tmp/vfx-fist08/engine.txt
          echo "EXACT_SHA=$GITHUB_SHA; SKILL=tmb.skill.fist.kim_cang.active_03.human; GUARD_EARTH_4S; ART_PENDING; OWNER_VISUAL_PENDING; PVE_INTEGRATION_HOLD" > /tmp/vfx-fist08/metadata.txt
      - name: Restore existing approved unchanged real WALK atlas
        shell: bash
        run: |
          set -euo pipefail
          cat .github/assets/p3/female_stage_a/part{01..14}.b64 .github/assets/p3/female_stage_a/part15a.b64 .github/assets/p3/female_stage_a/part15b.b64 .github/assets/p3/female_stage_a/part{16..20}.b64 | tr -d '\r\n\t ' | base64 --decode > /tmp/tmb_stage_a_pack.zip
          echo '6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  /tmp/tmb_stage_a_pack.zip' | sha256sum --check --strict
          unzip -q /tmp/tmb_stage_a_pack.zip -d .
      - name: V4 packet against canonical Human Fist catalogue
        run: |
          set -euo pipefail
          python3 tools/qa/validate_vfx_v4_packet.py --stage packet --packet docs/operations/vfx_packets/FIST08_R1_PHAN_CHAN_QUYEN_V4.json | tee /tmp/vfx-fist08/packet.log
      - name: Bake 3 first-party RGBA atlases and V4 verify original sources
        run: |
          set -euo pipefail
          python3 tools/vfx/generate_fist08_phan_chan_quyen.py | tee /tmp/vfx-fist08/bake.log
          grep -Fq 'FIST08_ATLAS_PASS=1 original_rgba_poses=26 textures=3 raw_rgba_bytes=7602176 no_rig=true' /tmp/vfx-fist08/bake.log
          python3 tools/qa/validate_vfx_v4_packet.py --stage assets --packet docs/operations/vfx_packets/FIST08_R1_PHAN_CHAN_QUYEN_V4.json | tee /tmp/vfx-fist08/assets.log
          cp godot/labs/combat_lab/fist08/assets/generated/f8_*.png /tmp/vfx-fist08/
          sha256sum /tmp/vfx-fist08/f8_*.png > /tmp/vfx-fist08/ATLAS_SHA256SUMS.txt
      - name: Godot 4.7.2 strict import parse and focused movement/guard test
        run: |
          set -euo pipefail
          bash tools/qa/run_godot_strict.sh --headless --path godot --import 2>&1 | tee /tmp/vfx-fist08/import.log
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/combat_lab/fist08/phan_chan_quyen.gd 2>&1 | tee /tmp/vfx-fist08/parse.log
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/labs/combat_lab/vfx_fist08_contract_test.gd 2>&1 | tee /tmp/vfx-fist08/godot-focused.log
          grep -Fq 'VFX_FIST08_FOCUSED_RESULT=PASS failures=0' /tmp/vfx-fist08/godot-focused.log
      - name: G3.5 native 1x preflight moving guard three images fail closed
        run: |
          set -euo pipefail
          d=/tmp/vfx-fist08
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 --write-movie "$d/v4-hf02-native.avi" --quit-after 98 res://labs/combat_lab/fist08/phan_chan_quyen.tscn 2>&1 | tee "$d/godot-preflight.log"
          ffmpeg -y -hide_banner -loglevel error -i "$d/v4-hf02-native.avi" -pix_fmt yuv420p -c:v libx264 -crf 16 "$d/v4-hf02-native.mp4"
          for phase in 'charge:0.30' 'peak:0.59' 'contact:1.34'; do
            name="${phase%%:*}"; at="${phase##*:}"
            ffmpeg -y -hide_banner -loglevel error -ss "$at" -i "$d/v4-hf02-native.mp4" -frames:v 1 "$d/v4-$name.png"
          done
          python3 tools/qa/validate_vfx_v4_packet.py --stage evidence --packet docs/operations/vfx_packets/FIST08_R1_PHAN_CHAN_QUYEN_V4.json --out "$d" --sha "$GITHUB_SHA" | tee "$d/evidence.log"
          rm "$d/v4-hf02-native.avi"
      - name: Full 1280x720 native motion video and 16 checkpoints
        run: |
          set -euo pipefail
          d=/tmp/vfx-fist08
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 --write-movie "$d/fist08.avi" --quit-after 315 res://labs/combat_lab/fist08/phan_chan_quyen.tscn 2>&1 | tee "$d/full.log"
          ffmpeg -y -hide_banner -loglevel error -i "$d/fist08.avi" -pix_fmt yuv420p -c:v libx264 -crf 16 -movflags +faststart "$d/fist08.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of default=noprint_wrappers=1 "$d/fist08.mp4" | tee "$d/dimensions.txt"
          grep -Fxq width=1280 "$d/dimensions.txt"
          grep -Fxq height=720 "$d/dimensions.txt"
          for at in 0.12 0.30 0.42 0.52 0.59 0.74 0.90 1.25 1.34 1.45 2.15 3.09 3.17 4.21 4.58 5.01; do
            ffmpeg -y -hide_banner -loglevel error -ss "$at" -i "$d/fist08.mp4" -frames:v 1 "$d/frame-$at.png"
          done
          ffmpeg -y -hide_banner -loglevel error -i "$d/fist08.mp4" -vf 'fps=3,scale=320:180,tile=4x4:nb_frames=16' -frames:v 1 "$d/timeline.png"
          ffmpeg -y -hide_banner -loglevel error -i "$d/fist08.mp4" -vf 'fps=12,scale=640:360:flags=lanczos' -loop 0 "$d/fist08.gif"
          sha256sum "$d/"*.mp4 "$d/"*.gif "$d/"*.png > "$d/SHA256SUMS.txt"
          rm "$d/fist08.avi"
      - name: Exact-SHA artifact, art gate always manual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfx-fist08-r1-native
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/vfx-fist08/*.txt
            /tmp/vfx-fist08/*.json
            /tmp/vfx-fist08/*.log
            /tmp/vfx-fist08/*.png
            /tmp/vfx-fist08/*.gif
            /tmp/vfx-fist08/*.mp4
