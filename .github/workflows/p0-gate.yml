name: P0 Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0-gate:
    name: Godot 4.7.2 P0 Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Print Godot version
        run: godot --version

      - name: Run P0 verification gate
        shell: pwsh
        run: ./tools/godot/Verify-P0.ps1

      - name: Upload P0 benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-benchmark-${{ github.sha }}
          path: godot/reports/p0_benchmark.json
          if-no-files-found: ignore
          retention-days: 14
