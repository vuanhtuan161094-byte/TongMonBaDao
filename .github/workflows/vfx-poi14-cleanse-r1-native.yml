name: VFX POI14 R1 Single-target Cleanse - Godot native
on:
  workflow_dispatch:
  push:
    branches: [integration/pve-p0-playable-ui-20261103]
    paths:
      - 'tools/vfx/generate_poi14_cleanse_r1.py'
      - 'godot/labs/combat_lab/poison14_cleanse/**'
      - 'godot/tests/labs/combat_lab/vfx_poi14_cleanse_r1_contract_test.gd'
      - 'docs/operations/vfx_packets/POI14_R1_V4_PREFLIGHT.json'
      - 'docs/operations/VFX_POI14_NGHICH_DOC_PHAN_CHE_R1_20261117.md'
      - '.github/workflows/vfx-poi14-cleanse-r1-native.yml'
permissions:
  contents: write
jobs:
  poi14-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_AUDIO_DRIVER: Dummy
      GODOT_RENDERING_DRIVER: opengl3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Official Godot 4.7.2 and original-alpha generation libraries
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y unzip ffmpeg xvfb python3-pil python3-numpy
          python3 -c 'import numpy; from PIL import Image; print("POI14_R1_RGBA_TOOLS_READY")'
          curl --fail --location --retry 3 -o /tmp/godot472.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot472.zip' | sha256sum --check --strict
          unzip -q /tmp/godot472.zip -d /tmp
          sudo install -m0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p "$RUNNER_TEMP/poi14"
          godot --version | tee "$RUNNER_TEMP/poi14/engine.txt"
          printf 'EXACT_SHA=%s\nNO_GIF\nNO_RIG\nOWNER_VISUAL_PENDING\nPVE_HOLD\nV63_OFF\n' "$GITHUB_SHA" > "$RUNNER_TEMP/poi14/metadata.txt"
      - name: Bake independent cleanse light true RGBA source and V4 validations
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/poi14"
          python3 tools/vfx/generate_poi14_cleanse_r1.py 2>&1 | tee "$d/bake.log"
          python3 tools/qa/validate_vfx_v4_packet.py --stage packet --packet docs/operations/vfx_packets/POI14_R1_V4_PREFLIGHT.json | tee "$d/v4-packet.log"
          python3 tools/qa/validate_vfx_v4_packet.py --stage assets --packet docs/operations/vfx_packets/POI14_R1_V4_PREFLIGHT.json | tee "$d/v4-assets.log"
          python3 - <<'PY'
          import numpy as np
          from PIL import Image
          from pathlib import Path
          root=Path('godot/labs/combat_lab/poison14_cleanse/r1/assets')
          for f in root.glob('*.png'):
              rgba=np.asarray(Image.open(f).convert('RGBA'))
              assert int(rgba[:,:,3].max())>65,(f,'blank')
              assert np.any((rgba[:,:,3]>0)&(rgba[:,:,3]<250)),(f,'not translucent')
              assert int(rgba[0,:,3].max())==0 and int(rgba[-1,:,3].max())==0,(f,'hard square')
          print('POI14_R1_TRUE_ALPHA_COLOR_BORDER_PASS')
          PY
          find godot/labs/combat_lab/poison14_cleanse/r1/assets -name '*.png' -print0 | sort -z | xargs -0 sha256sum > "$d/original-source-sha256.txt"
      - name: Restore existing approved actor fixture for isolated combat lab only
        run: |
          set -euo pipefail
          cat .github/assets/p3/female_stage_a/part{01..14}.b64 .github/assets/p3/female_stage_a/part15a.b64 .github/assets/p3/female_stage_a/part15b.b64 .github/assets/p3/female_stage_a/part{16..20}.b64 | tr -d '\r\n\t ' | base64 --decode > /tmp/tmb_stage_a_pack.zip
          echo '6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  /tmp/tmb_stage_a_pack.zip' | sha256sum --check --strict
          unzip -q /tmp/tmb_stage_a_pack.zip -d .
      - name: Native strict import parse and moving ally + monster single-heal contract
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/poi14"
          bash tools/qa/run_godot_strict.sh --headless --path godot --import 2>&1 | tee "$d/import.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/combat_lab/poison14_cleanse/r1/nghich_doc_phan_che.gd 2>&1 | tee "$d/parse.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/labs/combat_lab/vfx_poi14_cleanse_r1_contract_test.gd 2>&1 | tee "$d/godot-focused.log"
          grep -Fq 'POI14_CLEANSE_R1_RESULT=PASS failures=0' "$d/godot-focused.log"
      - name: Real Godot 1280x720 MP4 and 3 moving-ally phase images
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/poi14"
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 --write-movie "$d/native.avi" --quit-after 120 res://labs/combat_lab/poison14_cleanse/r1/nghich_doc_phan_che.tscn 2>&1 | tee "$d/godot-preflight.log"
          grep -Fq 'POI14_CLEANSE_R1_READY' "$d/godot-preflight.log"
          ffmpeg -y -hide_banner -loglevel error -i "$d/native.avi" -pix_fmt yuv420p -c:v libx264 -crf 16 -movflags +faststart "$d/v4-poi14-r1-native.mp4"
          ffmpeg -y -hide_banner -loglevel error -ss 0.28 -i "$d/v4-poi14-r1-native.mp4" -frames:v 1 "$d/v4-charge.png"
          ffmpeg -y -hide_banner -loglevel error -ss 0.82 -i "$d/v4-poi14-r1-native.mp4" -frames:v 1 "$d/v4-peak.png"
          ffmpeg -y -hide_banner -loglevel error -ss 1.20 -i "$d/v4-poi14-r1-native.mp4" -frames:v 1 "$d/v4-contact.png"
          python3 tools/qa/validate_vfx_v4_packet.py --stage evidence --packet docs/operations/vfx_packets/POI14_R1_V4_PREFLIGHT.json --out "$d" --sha "$GITHUB_SHA" | tee "$d/v4-evidence.log"
          for t in 0.08 0.18 0.28 0.45 0.55 0.68 0.82 0.95 0.99 1.12 1.20 1.35 1.48 1.72; do
            ffmpeg -y -hide_banner -loglevel error -ss "$t" -i "$d/v4-poi14-r1-native.mp4" -frames:v 1 "$d/check-$t.png"
          done
          sha256sum "$d/v4-poi14-r1-native.mp4" "$d/v4-"*.png > "$d/NATIVE-G35-SHA256.txt"
          rm "$d/native.avi"
      - name: Preserve original master and atlas PNGs on current PR branch
        if: success() && github.event_name == 'push'
        run: |
          set -euo pipefail
          branch='integration/pve-p0-playable-ui-20261103'
          folder='godot/labs/combat_lab/poison14_cleanse/r1/assets'
          mkdir -p "$RUNNER_TEMP/poi14/saved"
          cp -R "$folder"/. "$RUNNER_TEMP/poi14/saved/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin "$branch"
            latest="$(git rev-parse FETCH_HEAD)"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" "$latest"; then echo POI14_REWRITE_ABORT; exit 0; fi
            if test -n "$(git diff --name-only "$GITHUB_SHA" "$latest" -- tools/vfx/generate_poi14_cleanse_r1.py godot/labs/combat_lab/poison14_cleanse/ .github/workflows/vfx-poi14-cleanse-r1-native.yml)"; then
              echo POI14_CONCURRENT_SOURCE_CHANGE_ABORT; exit 0
            fi
            git reset --hard "$latest"
            mkdir -p "$folder"; cp -R "$RUNNER_TEMP/poi14/saved"/. "$folder/"
            git add "$folder"
            if git diff --cached --quiet; then echo POI14_ALREADY_ARCHIVED; exit 0; fi
            git commit -m 'art(poi14): preserve single-target cleanse RGBA masters and animated sprite atlases'
            if git push origin "HEAD:refs/heads/$branch"; then echo "POI14_ART_COMMIT=$(git rev-parse HEAD)" | tee "$RUNNER_TEMP/poi14/saved-commit.txt"; exit 0; fi
          done
          echo POI14_ART_SAVE_CONFLICT; exit 1
      - name: Upload MP4 and native proof, NO GIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poi14-r1-cleanse-native-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/poi14/*.log
            ${{ runner.temp }}/poi14/*.txt
            ${{ runner.temp }}/poi14/*.json
            ${{ runner.temp }}/poi14/*.png
            ${{ runner.temp }}/poi14/*.mp4
            godot/labs/combat_lab/poison14_cleanse/r1/assets/**/*.png
            godot/labs/combat_lab/poison14_cleanse/r1/assets/*.png
