name: VFX-FIST-11 Huyet Liet Quyen Godot V4 exact-SHA
on:
  workflow_dispatch:
  push:
    branches: [integration/pve-p0-playable-ui-20261103]
    paths:
      - '.github/workflows/vfx-fist-11-huyet-liet-quyen.yml'
      - 'godot/labs/combat_lab/fist11/**'
      - 'tools/vfx/generate_fist11_huyet_liet_quyen.py'
      - 'tools/vfx/create_fist11_original_masters.py'
      - 'godot/tests/labs/combat_lab/vfx_fist11_contract_test.gd'
      - 'docs/operations/vfx_packets/FIST11_R1_HUYET_LIET_QUYEN_V4.json'
permissions:
  contents: read
jobs:
  native-single-target-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GODOT_AUDIO_DRIVER: Dummy
      GODOT_RENDERING_DRIVER: opengl3
    steps:
      - uses: actions/checkout@v4
      - name: Install SHA-pinned Godot 4.7.2 and raster tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg unzip python3-pil python3-numpy
          curl --fail --location --retry 3 -o /tmp/godot472.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot472.zip' | sha256sum --check --strict
          unzip -q /tmp/godot472.zip -d /tmp
          sudo install -m0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p /tmp/vfx-fist11
          godot --version | tee /tmp/vfx-fist11/engine.txt
          echo "EXACT_SHA=$GITHUB_SHA; FIST11=nether_single_damage; R1_ORIGINAL; ART_PENDING; NO_GIF; NO_RIG; PVE_HOLD; V63_OFF" > /tmp/vfx-fist11/metadata.txt
      - name: Restore unchanged approved dummy actors for LAB
        shell: bash
        run: |
          set -euo pipefail
          cat .github/assets/p3/female_stage_a/part{01..14}.b64 .github/assets/p3/female_stage_a/part15a.b64 .github/assets/p3/female_stage_a/part15b.b64 .github/assets/p3/female_stage_a/part{16..20}.b64 | tr -d '\r\n\t ' | base64 --decode > /tmp/tmb_stage_a_pack.zip
          echo '6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  /tmp/tmb_stage_a_pack.zip' | sha256sum --check --strict
          unzip -q /tmp/tmb_stage_a_pack.zip -d .
      - name: V4 packet and source provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qa/validate_vfx_v4_packet.py --stage packet --packet docs/operations/vfx_packets/FIST11_R1_HUYET_LIET_QUYEN_V4.json | tee /tmp/vfx-fist11/v4-packet.log
      - name: Bake true-alpha 8 charge 12 fist-flight 8 target-contact R1
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/vfx/generate_fist11_huyet_liet_quyen.py | tee /tmp/vfx-fist11/bake.log
          grep -Fq 'FIST11_BAKE_PASS atlas=3 poses=28 rgba_bytes=9109504 8charge_12flight_8contact=true no_gif=true no_rig=true' /tmp/vfx-fist11/bake.log
          python3 tools/qa/validate_vfx_v4_packet.py --stage assets --packet docs/operations/vfx_packets/FIST11_R1_HUYET_LIET_QUYEN_V4.json | tee /tmp/vfx-fist11/v4-assets.log
          cp godot/labs/combat_lab/fist11/assets/generated/f11_*.png /tmp/vfx-fist11/
          cp godot/labs/combat_lab/fist11/assets/source/*.webp /tmp/vfx-fist11/
          sha256sum /tmp/vfx-fist11/f11_*.png /tmp/vfx-fist11/*.webp > /tmp/vfx-fist11/ART_SOURCE_SHA256SUMS.txt
      - name: Godot strict import parse and focused moving-target contract
        shell: bash
        run: |
          set -euo pipefail
          bash tools/qa/run_godot_strict.sh --headless --path godot --import 2>&1 | tee /tmp/vfx-fist11/import.log
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/combat_lab/fist11/huyet_liet_quyen.gd 2>&1 | tee /tmp/vfx-fist11/parse.log
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/labs/combat_lab/vfx_fist11_contract_test.gd 2>&1 | tee /tmp/vfx-fist11/godot-focused.log
          grep -Fq 'VFX_FIST11_FOCUSED_RESULT=PASS failures=0' /tmp/vfx-fist11/godot-focused.log
      - name: G3.5 actual Godot 1280x720 charge/flight/contact moving proof
        shell: bash
        run: |
          set -euo pipefail
          d=/tmp/vfx-fist11
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 --write-movie "$d/v4-fist11-native.avi" --quit-after 73 res://labs/combat_lab/fist11/huyet_liet_quyen.tscn 2>&1 | tee "$d/godot-preflight.log"
          test -s "$d/v4-fist11-native.avi"
          ffmpeg -y -hide_banner -loglevel error -i "$d/v4-fist11-native.avi" -pix_fmt yuv420p -c:v libx264 -crf 16 -movflags +faststart "$d/v4-fist11-native.mp4"
          for at in 0.25 0.59 0.84; do
            case "$at" in
              0.25) stage=charge ;;
              0.59) stage=peak ;;
              0.84) stage=contact ;;
            esac
            ffmpeg -y -hide_banner -loglevel error -ss "$at" -i "$d/v4-fist11-native.mp4" -frames:v 1 "$d/v4-$stage.png"
            test -s "$d/v4-$stage.png"
          done
          python3 tools/qa/validate_vfx_v4_packet.py --stage evidence --packet docs/operations/vfx_packets/FIST11_R1_HUYET_LIET_QUYEN_V4.json --out "$d" --sha "$GITHUB_SHA" | tee "$d/v4-evidence.log"
          rm "$d/v4-fist11-native.avi"
      - name: Full native Godot MP4 and 18 timestamped review stills NO GIF
        shell: bash
        run: |
          set -euo pipefail
          d=/tmp/vfx-fist11
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 --write-movie "$d/fist11-r1.avi" --quit-after 111 res://labs/combat_lab/fist11/huyet_liet_quyen.tscn 2>&1 | tee "$d/godot-full.log"
          ffmpeg -y -hide_banner -loglevel error -i "$d/fist11-r1.avi" -pix_fmt yuv420p -c:v libx264 -crf 16 -movflags +faststart "$d/fist11-r1.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of default=noprint_wrappers=1 "$d/fist11-r1.mp4" | tee "$d/dimensions.txt"
          grep -Fxq width=1280 "$d/dimensions.txt"
          grep -Fxq height=720 "$d/dimensions.txt"
          for at in 0.12 0.25 0.33 0.44 0.50 0.59 0.67 0.74 0.80 0.84 0.90 0.97 1.05 1.18 1.32 1.42 1.65 1.78; do
            ffmpeg -y -hide_banner -loglevel error -ss "$at" -i "$d/fist11-r1.mp4" -frames:v 1 "$d/frame-$at.png"
          done
          ffmpeg -y -hide_banner -loglevel error -i "$d/fist11-r1.mp4" -vf 'fps=10,scale=320:180,tile=5x4:nb_frames=20' -frames:v 1 "$d/timeline.png"
          sha256sum "$d/"*.mp4 "$d/"*.png > "$d/SHA256SUMS.txt"
          rm "$d/fist11-r1.avi"
      - name: Upload exact SHA native VFX and provenance (art gate manual)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfx-fist11-r1-original-nether-godot
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/vfx-fist11/*.txt
            /tmp/vfx-fist11/*.json
            /tmp/vfx-fist11/*.log
            /tmp/vfx-fist11/*.png
            /tmp/vfx-fist11/*.webp
            /tmp/vfx-fist11/*.mp4
