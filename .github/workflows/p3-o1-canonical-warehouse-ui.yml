name: P3 O1 Canonical Warehouse UI

on:
  workflow_dispatch:
  push:
    paths:
      - 'godot/src/presentation/p3_1_landscape_sect.gd'
      - 'godot/src/presentation/p3_2_landscape_sect.gd'
      - 'godot/tests/presentation/p3_o1_canonical_warehouse_ui_test.gd'
      - '.github/workflows/p3-o1-canonical-warehouse-ui.yml'

      - 'godot/tests/presentation/p3_o6_m1_release_rehearsal_test.gd'
permissions:
  contents: read

jobs:
  p3-o1-focused:
    name: Godot 4.7.2 O1 landscape warehouse/forge test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install official Godot 4.7.2 binary
        shell: bash
        run: |
          set -euo pipefail
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          GODOT_SHA256="cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
          curl --fail --location --retry 3 --output /tmp/godot.zip "$GODOT_URL"
          echo "$GODOT_SHA256  /tmp/godot.zip" | sha256sum --check --strict
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Confirm official version
        run: godot --version

      - name: Restore canonical female Stage A runtime pack
        shell: bash
        run: |
          set -euo pipefail
          PACK="/tmp/female_normal_v1_stageA_runtime_pack_v2_quant.zip"
          cat \
            .github/assets/p3/female_stage_a/part01.b64 \
            .github/assets/p3/female_stage_a/part02.b64 \
            .github/assets/p3/female_stage_a/part03.b64 \
            .github/assets/p3/female_stage_a/part04.b64 \
            .github/assets/p3/female_stage_a/part05.b64 \
            .github/assets/p3/female_stage_a/part06.b64 \
            .github/assets/p3/female_stage_a/part07.b64 \
            .github/assets/p3/female_stage_a/part08.b64 \
            .github/assets/p3/female_stage_a/part09.b64 \
            .github/assets/p3/female_stage_a/part10.b64 \
            .github/assets/p3/female_stage_a/part11.b64 \
            .github/assets/p3/female_stage_a/part12.b64 \
            .github/assets/p3/female_stage_a/part13.b64 \
            .github/assets/p3/female_stage_a/part14.b64 \
            .github/assets/p3/female_stage_a/part15a.b64 \
            .github/assets/p3/female_stage_a/part15b.b64 \
            .github/assets/p3/female_stage_a/part16.b64 \
            .github/assets/p3/female_stage_a/part17.b64 \
            .github/assets/p3/female_stage_a/part18.b64 \
            .github/assets/p3/female_stage_a/part19.b64 \
            .github/assets/p3/female_stage_a/part20.b64 \
            | tr -d '\r\n\t ' | base64 --decode > "$PACK"
          test "$(stat -c%s "$PACK")" -eq 44838
          echo "6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  $PACK" | sha256sum --check --strict
          test "$(unzip -Z1 "$PACK" | grep -Ec '^godot/assets/p3/character_creator/parts/female_normal_v1/.+\.png$')" -eq 42
          test "$(unzip -Z1 "$PACK" | sed '/\/$/d' | wc -l)" -eq 42
          unzip -t "$PACK"
          unzip -q "$PACK" -d .
          test "$(find godot/assets/p3/character_creator/parts/female_normal_v1 -type f -name '*.png' | wc -l)" -eq 42

      - name: Import project scripts and resources
        shell: bash
        run: godot --headless --path godot --import

      - name: Parse O1 changed scene and focused test
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            res://src/presentation/p3_1_landscape_sect.gd \
            res://src/presentation/p3_2_landscape_sect.gd \
            res://tests/presentation/p3_o1_canonical_warehouse_ui_test.gd; do
            godot --headless --path godot --check-only --script "$script"
          done

      - name: Run O1 live landscape scene Mine/Forge/warehouse persistence
        run: godot --headless --path godot -s res://tests/presentation/p3_o1_canonical_warehouse_ui_test.gd

      - name: Run existing P3.6A scene regression
        run: godot --headless --path godot -s res://tests/presentation/p3_6a_playable_slice_test.gd
