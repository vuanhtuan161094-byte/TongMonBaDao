name: P3 O1 Canonical Warehouse UI

on:
  workflow_dispatch:
  push:
    paths:
      - 'godot/src/presentation/p3_1_landscape_sect.gd'
      - 'godot/src/presentation/p3_2_landscape_sect.gd'
      - 'godot/tests/presentation/p3_o1_canonical_warehouse_ui_test.gd'
      - '.github/workflows/p3-o1-canonical-warehouse-ui.yml'

permissions:
  contents: read

jobs:
  p3-o1-focused:
    name: Godot 4.7.2 O1 landscape warehouse/forge test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install official Godot 4.7.2 binary
        shell: bash
        run: |
          set -euo pipefail
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          GODOT_SHA256="cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
          curl --fail --location --retry 3 --output /tmp/godot.zip "$GODOT_URL"
          echo "$GODOT_SHA256  /tmp/godot.zip" | sha256sum --check --strict
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Confirm official version
        run: godot --version

      - name: Parse O1 changed scene and focused test
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            res://src/presentation/p3_1_landscape_sect.gd \
            res://src/presentation/p3_2_landscape_sect.gd \
            res://tests/presentation/p3_o1_canonical_warehouse_ui_test.gd; do
            godot --headless --path godot --check-only --script "$script"
          done

      - name: Run O1 live landscape scene Mine/Forge/warehouse persistence
        run: godot --headless --path godot -s res://tests/presentation/p3_o1_canonical_warehouse_ui_test.gd

      - name: Run existing P3.6A scene regression
        run: godot --headless --path godot -s res://tests/presentation/p3_6a_playable_slice_test.gd
