name: JX VLTK existing-asset in-Godot comparison R1 (internal)
on:
  workflow_dispatch:
  push:
    branches: [integration/pve-p0-playable-ui-20261103]
    paths:
      - 'godot/labs/combat_lab/jx_reference_preview/r1/**'
      - 'godot/tests/labs/combat_lab/jx_vltk_reference_preview_r1_contract_test.gd'
      - 'docs/operations/JX_VLTK_VFX_IN_GAME_PREVIEW_R1_20261117.md'
      - '.github/workflows/jx-vltk-in-game-compare-r1-native.yml'
permissions:
  contents: read
jobs:
  in-game-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_AUDIO_DRIVER: Dummy
      GODOT_RENDERING_DRIVER: opengl3
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2 and movie tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y unzip ffmpeg xvfb python3-pil python3-numpy
          curl --fail --location --retry 3 -o /tmp/godot472.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot472.zip' | sha256sum --check --strict
          unzip -q /tmp/godot472.zip -d /tmp
          sudo install -m0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p "$RUNNER_TEMP/jx_preview"
          godot --version | tee "$RUNNER_TEMP/jx_preview/engine.txt"
          printf 'EXACT_SHA=%s\nINTERNAL_ONLY\nNO_NEW_COMMERCIAL_ASSETS\nNO_LICENSE_ASSERTION\nPVE_HOLD\nNO_MERGE\n' "$GITHUB_SHA" > "$RUNNER_TEMP/jx_preview/metadata.txt"
      - name: Existing original source clip hash and accepted LAB actor fixture
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/jx_preview"
          for f in godot/assets/combat_v4/jx1_skill_fx/{3dfcabc2,aa93d577,361b4525,1fffed7e}.webp \
                   godot/assets/combat_v4/source_vl/{wd_150_jianchuixinghe_a,wd_150_jianchuixinghe_d}.webp; do
            test -s "$f"
            sha256sum "$f"
          done > "$d/reference-source-hashes.txt"
          python3 tools/vfx/generate_poi19_phu_cot_co_tien_b_r2.py 2>&1 | tee "$d/accepted-original-sprite-bake.log"
          cat .github/assets/p3/female_stage_a/part{01..14}.b64 .github/assets/p3/female_stage_a/part15a.b64 .github/assets/p3/female_stage_a/part15b.b64 .github/assets/p3/female_stage_a/part{16..20}.b64 | tr -d '\r\n\t ' | base64 --decode > /tmp/tmb_stage_a_pack.zip
          echo '6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  /tmp/tmb_stage_a_pack.zip' | sha256sum --check --strict
          unzip -q /tmp/tmb_stage_a_pack.zip -d .
      - name: Godot strict parse, genuine atlas playback and NO gameplay write
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/jx_preview"
          bash tools/qa/run_godot_strict.sh --headless --path godot --import 2>&1 | tee "$d/import.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/combat_lab/jx_reference_preview/r1/jx_effect_layer.gd 2>&1 | tee "$d/layer-parse.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/combat_lab/jx_reference_preview/r1/jx_reference_preview.gd 2>&1 | tee "$d/scene-parse.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/labs/combat_lab/jx_vltk_reference_preview_r1_contract_test.gd 2>&1 | tee "$d/focused.log"
          grep -Fq 'JX_VLTK_COMPARE_RESULT=PASS failures=0' "$d/focused.log"
      - name: TRUE Godot 12sec 4-style 720-frame 1280x720 scene movie
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/jx_preview"
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 \
            --write-movie "$d/compare.avi" --quit-after 720 \
            res://labs/combat_lab/jx_reference_preview/r1/jx_reference_preview.tscn 2>&1 | tee "$d/native.log"
          grep -Fq 'JX_VLTK_IN_GAME_AB_READY' "$d/native.log"
          ffmpeg -y -hide_banner -loglevel error -i "$d/compare.avi" -pix_fmt yuv420p -c:v libx264 -crf 17 -movflags +faststart "$d/JX_VLTK_Godot_Compare_12s.mp4"
          for t in 0.20 0.95 1.51 4.50 6.93 7.53 9.95 10.46 11.50; do
            ffmpeg -y -hide_banner -loglevel error -ss "$t" -i "$d/JX_VLTK_Godot_Compare_12s.mp4" -frames:v 1 "$d/check-$t.png"
          done
          ffprobe -v error -show_entries stream=width,height,nb_frames,duration -of default=noprint_wrappers=1 "$d/JX_VLTK_Godot_Compare_12s.mp4" | tee "$d/movie-metadata.txt"
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import os
          root=Path(os.environ['RUNNER_TEMP'])/'jx_preview'
          for t in ['0.20','0.95','1.51','4.50','6.93','7.53','9.95','10.46']:
              im=Image.open(root/f'check-{t}.png')
              assert im.size==(1280,720),(t,im.size)
          metadata=(root/'movie-metadata.txt').read_text()
          assert all(x in metadata for x in ['width=1280','height=720','nb_frames=720']),metadata
          print('JX_VLTK_NATIVE_PREVIEW_TECH_PASS 720_frames four_styles genuine_Godot')
          PY
          sha256sum "$d/JX_VLTK_Godot_Compare_12s.mp4" > "$d/native-sha256.txt"
          printf 'GODOT_4_7_2_TECH_PASS\nART_OWNER_REVIEW_PENDING\nSOURCE_LICENSE_NOT_CLEARED_FOR_RELEASE\nPVE_HOLD\nNO_MERGE\n' > "$d/QA_GATE.txt"
          rm -f "$d/compare.avi"
      - name: Upload internal comparison MP4 and evidence not original atlases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jx-vltk-comparison-native
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/jx_preview/*.mp4
            ${{ runner.temp }}/jx_preview/*.png
            ${{ runner.temp }}/jx_preview/*.txt
            ${{ runner.temp }}/jx_preview/*.log
