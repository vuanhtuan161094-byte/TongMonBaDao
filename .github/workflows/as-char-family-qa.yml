name: AS-CHAR-01 family asset validation
on:
  push:
    paths:
      - 'godot/labs/character_family/**'
      - 'docs/animation/TMB_DISCIPLE_*20261111.md'
      - 'docs/animation/TMB_AS_CHAR38_IMPLEMENTATION_STATUS_2026-11-12.md'
      - '.github/workflows/as-char-family-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  family-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authoring-time atlas dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Focused AS-CHAR-38 export, registry and tests
        run: |
          python godot/labs/character_family/as_char38/tools/build_novice_atlases.py --root .
          python godot/labs/character_family/as_char38/tools/as_char38_registry.py --root .
          python -m unittest discover -s godot/labs/character_family/as_char38/tests -v
          python -m unittest discover -s godot/labs/character_family/tests -v
          python godot/labs/character_family/tools/validate_catalog.py
      - name: Install official Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum --check --strict
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Import project
        run: godot --headless --path godot --import
      - name: Strict parse isolated AS-CHAR-38 scripts
        run: |
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/character_family/as_char38/as_char38_family_resolver.gd
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/character_family/as_char38/as_char38_preview.gd
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/character_family/as_char38/tests/as_char38_godot_smoke.gd
      - name: Focused AS-CHAR-38 resolver and preview smoke
        run: godot --headless --path godot --script res://labs/character_family/as_char38/tests/as_char38_godot_smoke.gd
      - name: Load the isolated preview scene
        run: godot --headless --path godot --scene res://labs/character_family/as_char38/as_char38_preview.tscn --quit-after 8
      - name: Strict parse candidate preview script
        run: bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/character_family/poison_v4_candidate_preview.gd
      - name: Load the isolated candidate scene
        run: godot --headless --path godot --scene res://labs/character_family/poison_v4_candidate_preview.tscn --quit-after 8
