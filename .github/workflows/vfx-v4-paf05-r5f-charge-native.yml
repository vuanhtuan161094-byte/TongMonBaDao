name: PAF05 R5F | Charge Only Native G3.5 Candidate
on:
  workflow_dispatch:
  push:
    branches: [integration/pve-p0-playable-ui-20261103]
    paths:
      - '.github/workflows/vfx-v4-paf05-r5f-charge-native.yml'
      - 'godot/labs/combat_lab/talisman15/r5f/**'
      - 'godot/tests/labs/combat_lab/vfx_paf05_r5f_contract_test.gd'
      - 'docs/operations/vfx_packets/PAF05_R5F_CHARGE_G35.json'
      - 'tools/vfx/paf05_paint_master.py'
      - 'tools/vfx/paf05_luminous_raster.py'
      - 'tools/vfx/paf05_r5f_charge_master.py'
permissions:
  contents: read
jobs:
  g35-charge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_AUDIO_DRIVER: Dummy
      GODOT_RENDERING_DRIVER: opengl3
      PACKET: docs/operations/vfx_packets/PAF05_R5F_CHARGE_G35.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin Godot 4.7.2 and first-party alpha source tools
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/paf05-r5f"; mkdir -p "$d"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg unzip python3-pil python3-numpy python3-scipy python3-opencv fonts-noto-cjk
          curl --fail --location --retry 3 -o /tmp/godot472.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot472.zip' | sha256sum --check --strict
          unzip -q /tmp/godot472.zip -d /tmp
          sudo install -m0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version | tee "$d/godot-version.txt"
      - name: Bake existing R5E sources plus isolated R5F wind-silk charge atlas
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/paf05-r5f"
          /usr/bin/python3 tools/vfx/paf05_paint_master.py 2>&1 | tee "$d/source.log"
          grep -Fq PAF05_SOURCE_BAKE_PASS "$d/source.log"
          /usr/bin/python3 tools/vfx/paf05_r5f_charge_master.py 2>&1 | tee "$d/r5f-wind-silk-source.log"
          grep -Fq PAF05_R5F_WIND_SILK_SOURCE_PASS "$d/r5f-wind-silk-source.log"
          /usr/bin/python3 tools/vfx/paint_paf05_r5_mark.py 2>&1 | tee "$d/mark-source.log"
          grep -Fq PAF05_R5_ART_SOURCE_PASS "$d/mark-source.log"
          python3 tools/qa/validate_vfx_v4_packet.py --stage packet --packet "$PACKET" | tee "$d/packet.log"
          python3 tools/qa/validate_vfx_v4_packet.py --stage assets --packet "$PACKET" | tee "$d/assets.log"
          python3 - <<'PY'
          from PIL import Image
          im=Image.open("godot/labs/combat_lab/talisman15/r5f/assets/paf05_r5f_charge.webp").convert("RGBA")
          assert im.size == (1280, 960)
          assert im.getextrema()[3][0] == 0
          assert im.getextrema()[3][1] > 180
          print("PAF05_R5F_CHARGE_ALPHA_PASS 12_poses=new_isolated_wind_silk")
          PY
          sha256sum godot/labs/combat_lab/talisman15/r5f/assets/paf05_r5f_charge.webp > "$d/charge-source-sha256.txt"
      - name: Restore the unchanged caster assets required by the scene
        shell: bash
        run: |
          set -euo pipefail
          cat .github/assets/p3/female_stage_a/part{01..14}.b64 .github/assets/p3/female_stage_a/part15a.b64 .github/assets/p3/female_stage_a/part15b.b64 .github/assets/p3/female_stage_a/part{16..20}.b64 | tr -d '\r\n\t ' | base64 --decode > /tmp/tmb_stage_a_pack.zip
          test "$(stat -c%s /tmp/tmb_stage_a_pack.zip)" -eq 44838
          echo '6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  /tmp/tmb_stage_a_pack.zip' | sha256sum --check --strict
          unzip -q /tmp/tmb_stage_a_pack.zip -d .
      - name: Strict Godot import parse and inheritance regression
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/paf05-r5f"
          bash tools/qa/run_godot_strict.sh --headless --path godot --import 2>&1 | tee "$d/import.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/combat_lab/talisman15/r5f/thai_huyen_phong_gioi_r5f.gd 2>&1 | tee "$d/parse.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/labs/combat_lab/vfx_paf05_r5f_contract_test.gd 2>&1 | tee "$d/godot-focused.log"
          grep -Fq 'VFX_PAF05_R5F_FOCUSED_RESULT=PASS failures=0' "$d/godot-focused.log"
      - name: Native Godot 1280x720 G3.5 only (STOP before long film)
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/paf05-r5f"
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 --write-movie "$d/g35.avi" --quit-after 102 res://labs/combat_lab/talisman15/r5f/thai_huyen_phong_gioi_r5f.tscn 2>&1 | tee "$d/godot-preflight.log"
          grep -Fq VFX_PAF05_R5F_READY "$d/godot-preflight.log"
          ffmpeg -y -hide_banner -loglevel error -i "$d/g35.avi" -pix_fmt yuv420p -c:v libx264 -crf 16 -movflags +faststart "$d/paf05-r5f-mini.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,nb_frames -of default=noprint_wrappers=1 "$d/paf05-r5f-mini.mp4" | tee "$d/ffprobe.txt"
          grep -Fxq width=1280 "$d/ffprobe.txt"
          grep -Fxq height=720 "$d/ffprobe.txt"
          grep -Fxq nb_frames=102 "$d/ffprobe.txt"
          for p in '0.28 charge' '1.16 peak' '1.49 contact'; do
            set -- $p
            ffmpeg -y -hide_banner -loglevel error -ss "$1" -i "$d/paf05-r5f-mini.mp4" -frames:v 1 "$d/v4-$2.png"
          done
          ffmpeg -y -hide_banner -loglevel error -ss 0.56 -i "$d/paf05-r5f-mini.mp4" -frames:v 1 "$d/r5f-charge-mid.png"
          sha256sum "$d"/v4-*.png "$d/paf05-r5f-mini.mp4" > "$d/proof-sha256.txt"
          rm "$d/g35.avi"
      - name: V4 exact SHA proof (technical only, manual art STOP remains)
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/paf05-r5f"
          python3 tools/qa/validate_vfx_v4_packet.py --stage evidence --packet "$PACKET" --out "$d" --sha "$GITHUB_SHA" | tee "$d/evidence.log"
          grep -Fq VFX_V4_EVIDENCE_TECHNICAL_PASS "$d/evidence.log"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "PAF05_R5F_G3_5_TECH_PASS=$GITHUB_SHA ART=MANUAL_STOP_OWNER_PENDING R5E=FROZEN PVE=HOLD"
      - name: Archive reproducible alpha master + actual native G3.5 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfx-paf05-r5f-g35-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/paf05-r5f/*.log
            ${{ runner.temp }}/paf05-r5f/*.txt
            ${{ runner.temp }}/paf05-r5f/*.png
            ${{ runner.temp }}/paf05-r5f/*.mp4
            godot/labs/combat_lab/talisman15/art_sources/*.png
            godot/labs/combat_lab/talisman15/r5f/art_sources/*.png
            godot/labs/combat_lab/talisman15/r5f/assets/paf05_r5f_charge.webp
            godot/labs/combat_lab/talisman15/r5/art_sources/*.png
