name: VFX V4 | PAF02 Thai Huyen Khep An 3 moving targets & short native clip
on:
  workflow_dispatch:
  push:
    branches: [integration/pve-p0-playable-ui-20261103]
    paths:
      - '.github/workflows/vfx-v4-paf02-native.yml'
      - 'tools/vfx/paf02_assets.py'
      - 'godot/labs/combat_lab/talisman12/**'
      - 'godot/tests/labs/combat_lab/vfx_paf02_contract_test.gd'
      - 'docs/operations/vfx_packets/PAF02_V4_PREFLIGHT.json'
      - 'tools/qa/validate_vfx_v4_packet.py'
permissions:
  contents: read
jobs:
  paf02-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_AUDIO_DRIVER: Dummy
      GODOT_RENDERING_DRIVER: opengl3
      PACKET: docs/operations/vfx_packets/PAF02_V4_PREFLIGHT.json
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin Godot 4.7.2 and VFX dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          d="$RUNNER_TEMP/vfx-paf02"; mkdir -p "$d"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg unzip python3-pil python3-numpy fonts-noto-cjk
          curl --fail --location --retry 3 -o /tmp/godot472.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot472.zip' | sha256sum --check --strict
          unzip -q /tmp/godot472.zip -d /tmp
          sudo install -m0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version | tee "$d/engine.txt"
          printf 'EXACT_SHA=%s\nPAF02_SHORT_GESTURE=TRUE\nDEBUFF_5_5_STATUS_SEPARATE=TRUE\nOWNER=MANUAL_PENDING\nPVE=HOLD\n' "$GITHUB_SHA" > "$d/source.txt"
      - name: Generate source master and all original RGBA flipbooks then V4 packet and asset checks
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-paf02"
          /usr/bin/python3 tools/vfx/paf02_assets.py 2>&1 | tee "$d/asset-bake.log"
          grep -Fq 'PAF02_ORIGINAL_ART_BAKE_PASS' "$d/asset-bake.log"
          python3 tools/qa/validate_vfx_v4_packet.py --stage packet --packet "$PACKET" 2>&1 | tee "$d/packet.log"
          grep -Fq 'VFX_V4_PACKET_TECHNICAL_PASS' "$d/packet.log"
          python3 tools/qa/validate_vfx_v4_packet.py --stage assets --packet "$PACKET" 2>&1 | tee "$d/atlas.log"
          grep -Fq 'VFX_V4_ASSETS_TECHNICAL_PASS' "$d/atlas.log"
      - name: Restore unchanged verified first-party character overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .github/assets/p3/female_stage_a/part{01..14}.b64 .github/assets/p3/female_stage_a/part15a.b64 .github/assets/p3/female_stage_a/part15b.b64 .github/assets/p3/female_stage_a/part{16..20}.b64 | tr -d '\r\n\t ' | base64 --decode > /tmp/tmb_stage_a_pack.zip
          test "$(stat -c%s /tmp/tmb_stage_a_pack.zip)" -eq 44838
          echo '6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  /tmp/tmb_stage_a_pack.zip' | sha256sum --check --strict
          unzip -q /tmp/tmb_stage_a_pack.zip -d .
      - name: Native strict Godot 4.7.2 import parse and independent mark-status contract
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-paf02"
          bash tools/qa/run_godot_strict.sh --headless --path godot --import 2>&1 | tee "$d/godot-import.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/combat_lab/talisman12/thai_huyen_khep_an.gd 2>&1 | tee "$d/godot-parse.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/labs/combat_lab/vfx_paf02_contract_test.gd 2>&1 | tee "$d/godot-focused.log"
          grep -Fq 'VFX_PAF02_FOCUSED_RESULT=PASS failures=0' "$d/godot-focused.log"
      - name: Native 1280x720 2.2-second clip and 3 G3.5 proof frames on moving monsters
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-paf02"
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 --write-movie "$d/paf02-native.avi" --quit-after 132 res://labs/combat_lab/talisman12/thai_huyen_khep_an.tscn 2>&1 | tee "$d/godot-preflight.log"
          grep -Fq 'VFX_PAF02_READY' "$d/godot-preflight.log"
          ffmpeg -y -hide_banner -loglevel error -i "$d/paf02-native.avi" -pix_fmt yuv420p -c:v libx264 -crf 16 -movflags +faststart "$d/paf02-native.mp4"
          ffmpeg -y -hide_banner -loglevel error -ss .28 -i "$d/paf02-native.mp4" -frames:v 1 "$d/v4-charge.png"
          ffmpeg -y -hide_banner -loglevel error -ss .67 -i "$d/paf02-native.mp4" -frames:v 1 "$d/v4-peak.png"
          ffmpeg -y -hide_banner -loglevel error -ss .97 -i "$d/paf02-native.mp4" -frames:v 1 "$d/v4-contact.png"
          for at in .10 .22 .28 .43 .51 .61 .67 .76 .84 .97 1.13 1.55 1.94; do
            ffmpeg -y -hide_banner -loglevel error -ss "$at" -i "$d/paf02-native.mp4" -frames:v 1 "$d/frame-$at.png"
          done
          ffmpeg -y -hide_banner -loglevel error -i "$d/paf02-native.mp4" -vf 'fps=10,scale=640:-1:flags=lanczos' -loop 0 "$d/paf02-native.gif"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,nb_frames -of default=noprint_wrappers=1 "$d/paf02-native.mp4" | tee "$d/ffprobe.txt"
          grep -Fxq 'width=1280' "$d/ffprobe.txt"
          grep -Fxq 'height=720' "$d/ffprobe.txt"
          grep -Fxq 'nb_frames=132' "$d/ffprobe.txt"
          rm "$d/paf02-native.avi"
      - name: V4 exact SHA full technical proof and missing-contact negative test
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-paf02"
          python3 tools/qa/validate_vfx_v4_packet.py --stage evidence --packet "$PACKET" --out "$d" --sha "$GITHUB_SHA" 2>&1 | tee "$d/evidence.log"
          grep -Fq 'VFX_V4_EVIDENCE_TECHNICAL_PASS' "$d/evidence.log"
          mkdir -p "$d/missing-contact"
          cp "$d/paf02-native.mp4" "$d/godot-preflight.log" "$d/godot-focused.log" "$d/v4-charge.png" "$d/v4-peak.png" "$d/missing-contact/"
          if python3 tools/qa/validate_vfx_v4_packet.py --stage evidence --packet "$PACKET" --out "$d/missing-contact" --sha "$GITHUB_SHA"; then
            echo 'ERROR: missing contact falsely passed' >&2
            exit 1
          fi
          sha256sum "$d/"*.png "$d/"*.mp4 "$d/"*.gif "$d/V4_MANIFEST.json" > "$d/EVIDENCE_SHA256SUMS.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "PAF02_V4_TECH_PASS=$GITHUB_SHA ART=MANUAL PVE=HOLD"
      - name: Upload actual native movie and original art without automatic aesthetic approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfx-paf02-native-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/vfx-paf02/*.log
            ${{ runner.temp }}/vfx-paf02/*.txt
            ${{ runner.temp }}/vfx-paf02/*.png
            ${{ runner.temp }}/vfx-paf02/*.gif
            ${{ runner.temp }}/vfx-paf02/*.mp4
            ${{ runner.temp }}/vfx-paf02/*.json
            godot/labs/combat_lab/talisman12/art_sources/*.png
            godot/labs/combat_lab/talisman12/assets/*.webp
