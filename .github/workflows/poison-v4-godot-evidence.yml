name: Poison V4 Official Godot Combat Evidence

on:
  workflow_dispatch:
  push:
    branches:
      - integration/pve-p0-playable-ui-20261103
    paths:
      - '.github/workflows/poison-v4-godot-evidence.yml'
      - 'godot/labs/combat_lab/combat_lab_poison_v4_layers.gd'
      - 'godot/labs/combat_lab/combat_lab_arena.gd'
      - 'godot/labs/combat_lab/combat_lab_roster_adapter.gd'
      - 'godot/tests/labs/combat_lab/poison_v4_aim_range_contract_test.gd'
      - 'godot/labs/combat_lab/combat_lab_vfx_v2.gd'
      - 'godot/tests/labs/combat_lab/poison_v4_render_contract_test.gd'
      - 'godot/tests/labs/combat_lab/poison_v4_video_capture.gd'

permissions:
  contents: read

jobs:
  poison-v4-official:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TMB_POISON_V4_PREVIEW: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install official SHA-pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg
          curl --fail --location --retry 3 --output /tmp/tmb_godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/tmb_godot.zip" | sha256sum --check --strict
          unzip -q /tmp/tmb_godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Restore canonical Stage A sources without modifying production
        shell: bash
        run: |
          set -euo pipefail
          cat .github/assets/p3/female_stage_a/part{01..14}.b64 \
            .github/assets/p3/female_stage_a/part15a.b64 \
            .github/assets/p3/female_stage_a/part15b.b64 \
            .github/assets/p3/female_stage_a/part{16..20}.b64 \
            | tr -d '\r\n\t ' | base64 --decode > /tmp/tmb_stage_a_pack.zip
          test "$(stat -c%s /tmp/tmb_stage_a_pack.zip)" -eq 44838
          echo "6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  /tmp/tmb_stage_a_pack.zip" | sha256sum --check --strict
          unzip -q /tmp/tmb_stage_a_pack.zip -d .

      - name: Strict Godot import, V4 script compile, source-backed renderer contract
        shell: bash
        run: |
          set -euo pipefail
          bash tools/qa/run_godot_strict.sh --headless --path godot --import
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only \
            --script res://labs/combat_lab/combat_lab_poison_v4_layers.gd
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only \
            --script res://tests/labs/combat_lab/poison_v4_video_capture.gd
          bash tools/qa/run_godot_strict.sh --headless --path godot \
            -s res://tests/labs/combat_lab/poison_v4_render_contract_test.gd
          bash tools/qa/run_godot_strict.sh --headless --path godot \
            -s res://tests/labs/combat_lab/poison_v4_aim_range_contract_test.gd
          bash tools/qa/run_godot_strict.sh --headless --path godot \
            -s res://tests/labs/combat_lab/combat_lab_v2_visual_test.gd

      - name: Record 7 genuine Combat Lab Movie Maker videos including canonical Dược Độc healing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/poison_v4"
          printf 'code_sha=%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/poison_v4/metadata.txt"
          for item in doc_cham:1 doc_cham:2 doc_cham:4 doc_cham:6 co_doc:2 duoc_doc:2 duoc_heal:2; do
            IFS=: read -r branch zoom <<< "$item"
            export TMB_POISON_V4_BRANCH="$branch"
            export TMB_POISON_V4_ZOOM="$zoom"
            key="$branch-$zoom"x
            xvfb-run -a -s "-screen 0 1280x720x24" \
              bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 24 \
                --write-movie "$RUNNER_TEMP/poison_v4/$key.avi" \
                -s res://tests/labs/combat_lab/poison_v4_video_capture.gd \
              2>&1 | tee "$RUNNER_TEMP/poison_v4/$key.log"
            test -s "$RUNNER_TEMP/poison_v4/$key.avi"
            grep -q 'POISON_V4_VIDEO_RESULT=PASS_EVENTS_ONLY' "$RUNNER_TEMP/poison_v4/$key.log"
            grep -q "POISON_V4_VIDEO_ZOOM=$zoom" "$RUNNER_TEMP/poison_v4/$key.log"
            ffmpeg -y -hide_banner -loglevel error \
              -i "$RUNNER_TEMP/poison_v4/$key.avi" -vf "fps=24,scale=1280:720" \
              -c:v libx264 -preset fast -pix_fmt yuv420p \
              "$RUNNER_TEMP/poison_v4/$key.mp4"
            ffprobe -v error -show_entries stream=width,height,r_frame_rate \
              -of default=noprint_wrappers=1 "$RUNNER_TEMP/poison_v4/$key.mp4"
            rm "$RUNNER_TEMP/poison_v4/$key.avi"
          done
          sha256sum "$RUNNER_TEMP/poison_v4/"*.mp4 > "$RUNNER_TEMP/poison_v4/SHA256SUMS.txt"

      - name: Upload genuine video and complete strict engine logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poison-v4-godot-${{ github.sha }}
          path: |
            ${{ runner.temp }}/poison_v4/*.mp4
            ${{ runner.temp }}/poison_v4/*.log
            ${{ runner.temp }}/poison_v4/*.txt
            ${{ runner.temp }}/tmb_godot_strict/*.log
          if-no-files-found: warn
          retention-days: 14
