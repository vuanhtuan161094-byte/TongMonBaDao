name: VFX-FIST-12 Doan Mach Lien Quyen Godot V4 exact-SHA
on:
  workflow_dispatch:
  push:
    branches: [integration/pve-p0-playable-ui-20261103]
    paths:
      - '.github/workflows/vfx-fist-12-doan-mach-lien-quyen.yml'
      - 'godot/labs/combat_lab/fist12/**'
      - 'tools/vfx/generate_fist12_doan_mach_lien_quyen.py'
      - 'godot/tests/labs/combat_lab/vfx_fist12_contract_test.gd'
      - 'docs/operations/vfx_packets/FIST12_R1_DOAN_MACH_LIEN_QUYEN_V4.json'
      - 'tools/qa/validate_vfx_v4_packet.py'
permissions:
  contents: read
jobs:
  native-strike-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GODOT_AUDIO_DRIVER: Dummy
      GODOT_RENDERING_DRIVER: opengl3
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.7.2 and PIL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg unzip python3-pil python3-numpy
          curl --fail --location --retry 3 -o /tmp/godot472.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot472.zip' | sha256sum --check --strict
          unzip -q /tmp/godot472.zip -d /tmp
          sudo install -m0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p /tmp/vfx-fist12
          godot --version | tee /tmp/vfx-fist12/engine.txt
          echo "EXACT_SHA=$GITHUB_SHA; FIST12=R3_TRIPLE_PRESSURE_ECHO_MERIDIAN_BREAK_6S; ART_PENDING; NO_RIG; PVE_HOLD; V63_OFF" > /tmp/vfx-fist12/metadata.txt
      - name: Restore approved unchanged idle and walk actors for demo
        shell: bash
        run: |
          set -euo pipefail
          cat .github/assets/p3/female_stage_a/part{01..14}.b64 .github/assets/p3/female_stage_a/part15a.b64 .github/assets/p3/female_stage_a/part15b.b64 .github/assets/p3/female_stage_a/part{16..20}.b64 | tr -d '\r\n\t ' | base64 --decode > /tmp/tmb_stage_a_pack.zip
          echo '6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  /tmp/tmb_stage_a_pack.zip' | sha256sum --check --strict
          unzip -q /tmp/tmb_stage_a_pack.zip -d .
      - name: Validate canonical V4 packet
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qa/validate_vfx_v4_packet.py --stage packet --packet docs/operations/vfx_packets/FIST12_R1_DOAN_MACH_LIEN_QUYEN_V4.json | tee /tmp/vfx-fist12/v4-packet.log
      - name: Bake 36 energy-first charge/stream/apply/6s-mark RGBA poses (NO GIF, no fist icon)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/vfx/generate_fist12_doan_mach_lien_quyen.py | tee /tmp/vfx-fist12/bake.log
          grep -Fq 'FIST12_BAKE_PASS pages=4 poses=36 rgba_bytes=11468800 no_gif=true no_rig=true energy_first=true' /tmp/vfx-fist12/bake.log
          python3 tools/qa/validate_vfx_v4_packet.py --stage assets --packet docs/operations/vfx_packets/FIST12_R1_DOAN_MACH_LIEN_QUYEN_V4.json | tee /tmp/vfx-fist12/v4-assets.log
          cp godot/labs/combat_lab/fist12/assets/generated/f12_*.png /tmp/vfx-fist12/
          cp godot/labs/combat_lab/fist12/assets/generated/f12_original_energy_master.png /tmp/vfx-fist12/f12_original_energy_master.png
          cp godot/labs/combat_lab/fist03/assets/impact_master.webp /tmp/vfx-fist12/first_party_painted_micrograin_source.webp
          sha256sum /tmp/vfx-fist12/f12_*.png /tmp/vfx-fist12/*.webp > /tmp/vfx-fist12/ART_SOURCE_SHA256SUMS.txt
      - name: Godot strict import parse and moving one-target six-second mark contract
        shell: bash
        run: |
          set -euo pipefail
          bash tools/qa/run_godot_strict.sh --headless --path godot --import 2>&1 | tee /tmp/vfx-fist12/import.log
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/combat_lab/fist12/doan_mach_lien_quyen.gd 2>&1 | tee /tmp/vfx-fist12/parse.log
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/labs/combat_lab/vfx_fist12_contract_test.gd 2>&1 | tee /tmp/vfx-fist12/godot-focused.log
          grep -Fq 'VFX_FIST12_FOCUSED_RESULT=PASS failures=0' /tmp/vfx-fist12/godot-focused.log
      - name: Mandatory G3.5 Godot preflight 1280x720 energy charge peak mark-apply on moving actor
        shell: bash
        run: |
          set -euo pipefail
          d=/tmp/vfx-fist12
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 --write-movie "$d/v4-fist12-native.avi" --quit-after 75 res://labs/combat_lab/fist12/doan_mach_lien_quyen.tscn 2>&1 | tee "$d/godot-preflight.log"
          test -s "$d/v4-fist12-native.avi"
          ffmpeg -y -hide_banner -loglevel error -i "$d/v4-fist12-native.avi" -pix_fmt yuv420p -c:v libx264 -crf 16 -movflags +faststart "$d/v4-fist12-native.mp4"
          for at in 0.22 0.74 0.99; do
            case "$at" in
              0.22) stage=charge ;;
              0.74) stage=peak ;;
              0.99) stage=contact ;;
            esac
            ffmpeg -y -hide_banner -loglevel error -ss "$at" -i "$d/v4-fist12-native.mp4" -frames:v 1 "$d/v4-$stage.png"
            test -s "$d/v4-$stage.png"
          done
          python3 tools/qa/validate_vfx_v4_packet.py --stage evidence --packet docs/operations/vfx_packets/FIST12_R1_DOAN_MACH_LIEN_QUYEN_V4.json --out "$d" --sha "$GITHUB_SHA" | tee "$d/v4-evidence.log"
          rm "$d/v4-fist12-native.avi"
      - name: Full native Godot 1280x720 MP4 energy stream / six-second mark review (NO GIF)
        shell: bash
        run: |
          set -euo pipefail
          d=/tmp/vfx-fist12
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 --write-movie "$d/fist12-r3.avi" --quit-after 456 res://labs/combat_lab/fist12/doan_mach_lien_quyen.tscn 2>&1 | tee "$d/godot-full.log"
          ffmpeg -y -hide_banner -loglevel error -i "$d/fist12-r3.avi" -pix_fmt yuv420p -c:v libx264 -crf 16 -movflags +faststart "$d/fist12-r3.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of default=noprint_wrappers=1 "$d/fist12-r3.mp4" | tee "$d/dimensions.txt"
          grep -Fxq width=1280 "$d/dimensions.txt"
          grep -Fxq height=720 "$d/dimensions.txt"
          for at in 0.10 0.22 0.37 0.45 0.58 0.74 0.86 0.92 0.99 1.13 1.32 1.80 2.65 3.50 4.45 5.30 6.28 6.80 7.06 7.40; do
            ffmpeg -y -hide_banner -loglevel error -ss "$at" -i "$d/fist12-r3.mp4" -frames:v 1 "$d/frame-$at.png"
          done
          ffmpeg -y -hide_banner -loglevel error -i "$d/fist12-r3.mp4" -vf 'fps=3,scale=320:180,tile=5x4:nb_frames=20' -frames:v 1 "$d/timeline.png"
          # R3 triple qi-pressure-echo and single six-second mark: no GIF conversion, no preview sprite fake; native Godot MP4 only
          sha256sum "$d/"*.mp4 "$d/"*.png > "$d/SHA256SUMS.txt"
          rm "$d/fist12-r3.avi"
      - name: Upload exact-SHA art technical evidence; owner gate manual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfx-fist12-r3-energy-first-v4-native
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/vfx-fist12/*.txt
            /tmp/vfx-fist12/*.json
            /tmp/vfx-fist12/*.log
            /tmp/vfx-fist12/*.png
            /tmp/vfx-fist12/*.mp4
            /tmp/vfx-fist12/*.webp
