name: VFX-TAL-09 | HF04 Chu Tuoc Hoi Hoan native Godot 4.7.2 movie
on:
  workflow_dispatch:
  push:
    branches: [integration/pve-p0-playable-ui-20261103]
    paths:
      - '.github/workflows/vfx-tal-09-chu-tuoc-hoi-hoan.yml'
      - 'tools/vfx/hf04_r1_que_tuoc.py'
      - 'godot/labs/combat_lab/talisman09/**'
      - 'godot/tests/labs/combat_lab/vfx_tal09_contract_test.gd'
      - 'docs/operations/vfx_packets/HF04_V4_PREFLIGHT.json'
permissions:
  contents: read
jobs:
  hf04-native-godot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_AUDIO_DRIVER: Dummy
      GODOT_RENDERING_DRIVER: opengl3
      PACKET: docs/operations/vfx_packets/HF04_V4_PREFLIGHT.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin original Godot 4.7.2 and install original painted-source baker
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          d="$RUNNER_TEMP/vfx-tal09"
          mkdir -p "$d"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg unzip python3-pil python3-numpy
          curl --fail --location --retry 3 -o /tmp/godot472.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot472.zip' | sha256sum --check --strict
          unzip -q /tmp/godot472.zip -d /tmp
          sudo install -m0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version | tee "$d/engine.txt"
          printf 'SOURCE_SHA=%s\nHF04=HUMAN_CIRCLE_CAP3_ZERO_PROJECTILE\nG3_5=GODOT_NATIVE_PREFLIGHT_TECH_PASS\nRUNTIME_MAPPING=PENDING\nOWNER_VISUAL=PENDING\nPVE_INTEGRATION=HOLD\nPHYSICAL_QA=PENDING\nNO_RIG=TRUE\n' "$GITHUB_SHA" > "$d/SCOPE.txt"
      - name: Verify HF04 canonical packet then bake three source-painted alpha atlases
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-tal09"
          python3 tools/qa/validate_vfx_v4_packet.py --stage packet --packet "$PACKET" | tee "$d/packet.log"
          /usr/bin/python3 tools/vfx/hf04_r1_que_tuoc.py | tee "$d/painted-asset-bake.log"
          grep -Fq 'HF04_R1_SOURCE_ART_BAKE_PASS' "$d/painted-asset-bake.log"
          python3 tools/qa/validate_vfx_v4_packet.py --stage assets --packet "$PACKET" | tee "$d/atlas.log"
          grep -Fq 'VFX_V4_ASSETS_TECHNICAL_PASS' "$d/atlas.log"
          sha256sum godot/labs/combat_lab/talisman09/assets/tal09_r1_*.webp > "$d/HF04_ATLAS_SHA256SUMS.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Restore unchanged verified first-party character sprite overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .github/assets/p3/female_stage_a/part{01..14}.b64 .github/assets/p3/female_stage_a/part15a.b64 .github/assets/p3/female_stage_a/part15b.b64 .github/assets/p3/female_stage_a/part{16..20}.b64 | tr -d '\r\n\t ' | base64 --decode > /tmp/tmb_stage_a_pack.zip
          test "$(stat -c%s /tmp/tmb_stage_a_pack.zip)" -eq 44838
          echo '6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  /tmp/tmb_stage_a_pack.zip' | sha256sum --check --strict
          unzip -q /tmp/tmb_stage_a_pack.zip -d .
      - name: Strict Godot 4.7.2 import parse real WALK moving-target visual contract
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-tal09"
          bash tools/qa/run_godot_strict.sh --headless --path godot --import 2>&1 | tee "$d/godot-import.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/combat_lab/talisman09/chu_tuoc_hoi_hoan.gd 2>&1 | tee "$d/godot-parse.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/labs/combat_lab/vfx_tal09_contract_test.gd 2>&1 | tee "$d/godot-focused.log"
          grep -Fq 'VFX_TAL09_FOCUSED_RESULT=PASS failures=0' "$d/godot-focused.log"
      - name: Full genuine Godot 1280x720 MP4 GIF and 15 native frame checkpoints
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-tal09"
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 --write-movie "$d/hf04-native.avi" --quit-after 187 res://labs/combat_lab/talisman09/chu_tuoc_hoi_hoan.tscn 2>&1 | tee "$d/godot-native.log"
          grep -Fq 'VFX_TAL09_READY' "$d/godot-native.log"
          test -s "$d/hf04-native.avi"
          ffmpeg -y -hide_banner -loglevel error -i "$d/hf04-native.avi" -pix_fmt yuv420p -c:v libx264 -crf 16 -movflags +faststart "$d/HF04_Hoa_Tam_Ngung_Phu_Godot_1280x720.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,nb_frames,avg_frame_rate -of default=noprint_wrappers=1 "$d/HF04_Hoa_Tam_Ngung_Phu_Godot_1280x720.mp4" | tee "$d/ffprobe.txt"
          grep -Fxq 'width=1280' "$d/ffprobe.txt"
          grep -Fxq 'height=720' "$d/ffprobe.txt"
          grep -Fxq 'nb_frames=187' "$d/ffprobe.txt"
          for at in 0.12 0.30 0.44 0.62 0.82 1.04 1.29 1.43 1.55 1.63 1.71 1.82 2.06 2.36 2.84; do
             ffmpeg -y -hide_banner -loglevel error -ss "$at" -i "$d/HF04_Hoa_Tam_Ngung_Phu_Godot_1280x720.mp4" -frames:v 1 "$d/frame-$at.png"
          done
          ffmpeg -y -hide_banner -loglevel error -i "$d/HF04_Hoa_Tam_Ngung_Phu_Godot_1280x720.mp4" -vf 'fps=5,scale=320:180,tile=5x3:nb_frames=15' -frames:v 1 "$d/HF04_15frame_sheet.png"
          ffmpeg -y -hide_banner -loglevel error -i "$d/HF04_Hoa_Tam_Ngung_Phu_Godot_1280x720.mp4" -vf 'fps=10,scale=640:-1:flags=lanczos' -loop 0 "$d/HF04_Hoa_Tam_Ngung_Phu_Godot.gif"
          sha256sum "$d/"*.mp4 "$d/"*.gif "$d/"*.png > "$d/HF04_VIDEO_SHA256SUMS.txt"
          rm "$d/hf04-native.avi"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "HF04_EXACT_SHA_TECH_PASS=$GITHUB_SHA"
      - name: Upload original painterly atlases and genuine engine evidence, art manual only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfx-tal09-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/vfx-tal09/*.log
            ${{ runner.temp }}/vfx-tal09/*.txt
            ${{ runner.temp }}/vfx-tal09/*.png
            ${{ runner.temp }}/vfx-tal09/*.mp4
            ${{ runner.temp }}/vfx-tal09/*.gif
            godot/labs/combat_lab/talisman09/assets/tal09_r1_*.webp
