name: VFX-FIST-04 Loi Dinh Chan Quyen (Fire shockwave) native Godot 4.7.2
on:
  workflow_dispatch:
  push:
    branches: [integration/pve-p0-playable-ui-20261103]
    paths:
      - '.github/workflows/vfx-fist-04-loi-dinh-chan-quyen.yml'
      - 'godot/labs/combat_lab/fist04/**'
      - 'tools/vfx/generate_fist04_lei_dinh_v1.py'
      - 'godot/tests/labs/combat_lab/vfx_fist04_contract_test.gd'
permissions:
  contents: read
jobs:
  native-godot-film:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_AUDIO_DRIVER: Dummy
      GODOT_RENDERING_DRIVER: opengl3
    steps:
      - uses: actions/checkout@v4
      - name: Official SHA256-pinned Godot 4.7.2 and movie tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg unzip python3-pil python3-numpy
          curl --fail --location --retry 3 -o /tmp/godot472.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot472.zip' | sha256sum --check --strict
          unzip -q /tmp/godot472.zip -d /tmp
          sudo install -m0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p /tmp/vfx-fist04
          godot --version | tee /tmp/vfx-fist04/engine.txt
          echo "SOURCE_SHA=$GITHUB_SHA; SKILL_LABEL=LOI_DINH_CHAN_QUYEN; SOURCE_ID=tmb.skill.fist.ba_quyen.active_03.human; EFFECT=damage; ELEMENT=fire; SHAPE=circle; CAP=3; CAST=0.45; ART_SOURCE=original_ImageGen_cropped_WEBP; NO_RIG=true; VIEW_ONLY=true; OWNER_VISUAL_PENDING; PVE_INTEGRATION_HOLD" > /tmp/vfx-fist04/metadata.txt
      - name: Restore existing Stage A assets without tracked modifications
        shell: bash
        run: |
          set -euo pipefail
          cat .github/assets/p3/female_stage_a/part{01..14}.b64 .github/assets/p3/female_stage_a/part15a.b64 .github/assets/p3/female_stage_a/part15b.b64 .github/assets/p3/female_stage_a/part{16..20}.b64 | tr -d '\r\n\t ' | base64 --decode > /tmp/tmb_stage_a_pack.zip
          test "$(stat -c%s /tmp/tmb_stage_a_pack.zip)" -eq 44838
          echo '6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  /tmp/tmb_stage_a_pack.zip' | sha256sum --check --strict
          unzip -q /tmp/tmb_stage_a_pack.zip -d .
      - name: Reproduce four painted alpha atlases from original ImageGen isolated source masters
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/vfx/generate_fist04_lei_dinh_v1.py | tee /tmp/vfx-fist04/atlas.log
          grep -Fq 'FIST04_PAINTED_V1_PASS frames=40 alpha=true material=original_ImageGen isolated_painted_rgba no_rig=true' /tmp/vfx-fist04/atlas.log
          for n in thunder_ghost_master threefold_impact_master; do
            test -s "godot/labs/combat_lab/fist04/assets/$n.webp"
          done
          for n in charge thunder impact grit; do
            test -s "godot/labs/combat_lab/fist04/assets/generated/$n.png"
            cp "godot/labs/combat_lab/fist04/assets/generated/$n.png" "/tmp/vfx-fist04/$n.png"
          done
          sha256sum /tmp/vfx-fist04/{charge,thunder,impact,grit}.png > /tmp/vfx-fist04/ATLAS_SHA256SUMS.txt
      - name: Strict import parse and focused test
        shell: bash
        run: |
          set -euo pipefail
          bash tools/qa/run_godot_strict.sh --headless --path godot --import 2>&1 | tee /tmp/vfx-fist04/import.log
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/combat_lab/fist04/lei_dinh_chan_quyen.gd 2>&1 | tee /tmp/vfx-fist04/parse.log
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/labs/combat_lab/vfx_fist04_contract_test.gd 2>&1 | tee /tmp/vfx-fist04/test.log
          grep -Fq 'VFX_FIST04_FOCUSED_RESULT=PASS failures=0' /tmp/vfx-fist04/test.log
      - name: Genuine Godot 3-target Divine Fist art study 1280x720 MP4 GIF and 12 frames
        shell: bash
        run: |
          set -euo pipefail
          d=/tmp/vfx-fist04
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 --write-movie "$d/fist-04.avi" --quit-after 180 res://labs/combat_lab/fist04/lei_dinh_chan_quyen.tscn 2>&1 | tee "$d/movie.log"
          test -s "$d/fist-04.avi"
          ffmpeg -y -hide_banner -loglevel error -i "$d/fist-04.avi" -pix_fmt yuv420p -c:v libx264 -crf 16 -movflags +faststart "$d/fist-04.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,avg_frame_rate -of default=noprint_wrappers=1 "$d/fist-04.mp4" | tee "$d/dimensions.txt"
          grep -Fxq 'width=1280' "$d/dimensions.txt"
          grep -Fxq 'height=720' "$d/dimensions.txt"
          for at in 0.10 0.25 0.41 0.50 0.68 0.89 1.06 1.15 1.30 1.61 2.12 2.55; do
            ffmpeg -y -hide_banner -loglevel error -ss "$at" -i "$d/fist-04.mp4" -frames:v 1 "$d/frame-$at.png"
          done
          ffmpeg -y -hide_banner -loglevel error -i "$d/fist-04.mp4" -vf 'fps=3.5,scale=320:180,tile=4x3:nb_frames=12' -frames:v 1 "$d/timeline.png"
          ffmpeg -y -hide_banner -loglevel error -i "$d/fist-04.mp4" -vf 'fps=12,scale=640:360:flags=lanczos' -loop 0 "$d/fist-04.gif"
          sha256sum "$d/"*.mp4 "$d/"*.gif "$d/"*.png > "$d/SHA256SUMS.txt"
          rm "$d/fist-04.avi"
      - name: Upload exact SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfx-fist04-native
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/vfx-fist04/*.txt
            /tmp/vfx-fist04/*.log
            /tmp/vfx-fist04/*.png
            /tmp/vfx-fist04/*.gif
            /tmp/vfx-fist04/*.mp4
