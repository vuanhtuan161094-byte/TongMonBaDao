name: TMB V4 Walk Semantic QA Gate
on:
  workflow_dispatch:
  push:
    branches:
      - integration/pve-p0-playable-ui-20261103
    paths:
      - 'tools/art/v4_anim01_walk_motion_gate.py'
      - 'tools/art/tests/test_v4_anim01_walk_motion_gate.py'
      - '.github/workflows/tmb-v4-anim01-walk-gate.yml'

permissions:
  contents: read

jobs:
  v4-walk-gate-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic QA dependencies
        run: python -m pip install pillow==11.3.0 numpy==2.3.3
      - name: Gate rejects static-like Walk and passes real leg phase fixture
        run: python tools/art/tests/test_v4_anim01_walk_motion_gate.py
      - name: Evidence restriction
        run: |
          echo "This checks only the gate implementation; NOT actor sprite art or Godot GUI."
          echo "Master identity, genuine 4-way rig, and official Godot 4.7.2 video remain PENDING."
