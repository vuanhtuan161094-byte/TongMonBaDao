name: VFX-TAL-05 | Cuu Thien Van Loi Phu original heavenly rune Godot movie
on:
  workflow_dispatch:
  push:
    branches: [integration/pve-p0-playable-ui-20261103]
    paths:
      - '.github/workflows/vfx-tal-05-cuu-thien-van-loi-phu.yml'
      - 'tools/vfx/generate_talisman01_atlas.py'
      - 'godot/labs/combat_lab/talisman05/**'
      - 'godot/tests/labs/combat_lab/vfx_tal05_contract_test.gd'
permissions:
  contents: read
jobs:
  talisman-original-movie:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_AUDIO_DRIVER: Dummy
      GODOT_RENDERING_DRIVER: opengl3
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot, native tooling and Pillow
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg unzip python3-pil python3-numpy
          curl --fail --location --retry 3 -o /tmp/godot472.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot472.zip' | sha256sum --check --strict
          unzip -q /tmp/godot472.zip -d /tmp
          sudo install -m0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p "$RUNNER_TEMP/vfx-tal05"
          godot --version | tee "$RUNNER_TEMP/vfx-tal05/engine.txt"
          printf 'SOURCE_SHA=%s\nSKILL_ID=tmb.skill.talisman.loi_phu.ultimate.human\nOWNER_VISUAL_PENDING\nPVE_INTEGRATION_HOLD\nNO_RIG\n' "$GITHUB_SHA" > "$RUNNER_TEMP/vfx-tal05/metadata.txt"
      - name: Verify ten original heavenly rune sprites and shared master talisman
        shell: bash
        run: |
          set -euo pipefail
          for n in 00 01 02 03 04 05 06 07 08 09; do test -s "godot/labs/combat_lab/talisman05/assets/heaven_rune_${n}.svg"; done
          test -s godot/labs/combat_lab/talisman01/assets/thunder_talisman_atlas.webp
          sha256sum godot/labs/combat_lab/talisman05/assets/heaven_rune_*.svg > "$RUNNER_TEMP/vfx-tal05/atlas_hash.txt"
      - name: Bake original painted sky portal and vertical storm flipbooks
        shell: bash
        run: |
          set -euo pipefail
          TMB_ART_LOG_EXPORT=0 /usr/bin/python3 tools/vfx/paint_tal05_heaven.py . > "$RUNNER_TEMP/vfx-tal05/art.log"
          grep -E '^TAL05_PAINTED_OUTPUT|^TMB_ASSET_BEGIN|^TMB_ASSET_END' "$RUNNER_TEMP/vfx-tal05/art.log"
          git diff --exit-code -- godot/labs/combat_lab/talisman05/assets/tal05_r3_*.webp
          /usr/bin/python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('godot/labs/combat_lab/talisman05/assets')
          sizes={'tal05_r3_sky_master.webp':(512,512),'tal05_r3_sky_flipbook.webp':(2048,1536),'tal05_r3_bolt_master.webp':(384,512),'tal05_r3_bolt_flipbook.webp':(1536,1536),'tal05_r3_impact.webp':(320,320)}
          for name,size in sizes.items():
              im=Image.open(p/name).convert('RGBA')
              assert im.size==size and im.getchannel('A').getextrema()[0]==0
              assert im.getchannel('A').getextrema()[1]>90
          print('TAL05_R3_PAINTED_ALPHA_ATLAS=PASS')
          PY
      - name: Restore existing Stage A prerequisites without changing tracked files
        shell: bash
        run: |
          set -euo pipefail
          cat .github/assets/p3/female_stage_a/part{01..14}.b64 .github/assets/p3/female_stage_a/part15a.b64 .github/assets/p3/female_stage_a/part15b.b64 .github/assets/p3/female_stage_a/part{16..20}.b64 | tr -d '\r\n\t ' | base64 --decode > /tmp/tmb_stage_a_pack.zip
          test "$(stat -c%s /tmp/tmb_stage_a_pack.zip)" -eq 44838
          echo '6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  /tmp/tmb_stage_a_pack.zip' | sha256sum --check --strict
          unzip -q /tmp/tmb_stage_a_pack.zip -d .
      - name: Godot 4.7.2 exact-SHA strict import parse focused test
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-tal05"
          bash tools/qa/run_godot_strict.sh --headless --path godot --import 2>&1 | tee "$d/import.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/combat_lab/talisman05/cuu_thien_van_loi_phu.gd 2>&1 | tee "$d/parse.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/labs/combat_lab/vfx_tal05_contract_test.gd 2>&1 | tee "$d/test.log"
          grep -Fq 'VFX_TAL05_FOCUSED_RESULT=PASS failures=0' "$d/test.log"
      - name: Genuine 1280x720 Godot motion, checkpoint frames, GIF and MP4
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-tal05"
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 --write-movie "$d/cuu-thien-van-loi-phu.avi" --quit-after 287 res://labs/combat_lab/talisman05/cuu_thien_van_loi_phu.tscn 2>&1 | tee "$d/movie.log"
          test -s "$d/cuu-thien-van-loi-phu.avi"
          ffmpeg -y -hide_banner -loglevel error -i "$d/cuu-thien-van-loi-phu.avi" -pix_fmt yuv420p -c:v libx264 -crf 16 -movflags +faststart "$d/cuu-thien-van-loi-phu.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,avg_frame_rate -of default=noprint_wrappers=1 "$d/cuu-thien-van-loi-phu.mp4" | tee "$d/dimensions.txt"
          grep -Fxq 'width=1280' "$d/dimensions.txt"
          grep -Fxq 'height=720' "$d/dimensions.txt"
          for at in 0.32 0.62 0.95 1.17 1.40 1.65 1.79 1.95 2.08 2.29 2.62 3.04 3.54 4.20; do
            ffmpeg -y -hide_banner -loglevel error -ss "$at" -i "$d/cuu-thien-van-loi-phu.mp4" -frames:v 1 "$d/frame-$at.png"
          done
          ffmpeg -y -hide_banner -loglevel error -i "$d/cuu-thien-van-loi-phu.mp4" -vf 'fps=5,scale=320:180,tile=5x3:nb_frames=15' -frames:v 1 "$d/contact-sheet.png"
          ffmpeg -y -hide_banner -loglevel error -i "$d/cuu-thien-van-loi-phu.mp4" -vf 'fps=10,scale=640:-1:flags=lanczos' -loop 0 "$d/cuu-thien-van-loi-phu.gif"
          sha256sum "$d/"*.mp4 "$d/"*.png "$d/"*.gif > "$d/SHA256SUMS.txt"
          grep -Fq 'VFX_TAL05_READY' "$d/movie.log"
          rm "$d/cuu-thien-van-loi-phu.avi"
      - name: Upload exact-SHA VFX proof and original atlas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfx-tal05-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/vfx-tal05/*.log
            ${{ runner.temp }}/vfx-tal05/*.txt
            ${{ runner.temp }}/vfx-tal05/*.png
            ${{ runner.temp }}/vfx-tal05/*.mp4
            ${{ runner.temp }}/vfx-tal05/*.gif
            godot/labs/combat_lab/talisman05/assets/tal05_r3_*.webp
