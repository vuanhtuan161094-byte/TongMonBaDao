name: VFX-BATCH-01 | 2196 IDs 204 Master LAB Batch Movie
on:
  workflow_dispatch:
  push:
    branches: [integration/pve-p0-playable-ui-20261103]
    paths:
      - '.github/workflows/vfx-batch-01-godot.yml'
      - 'godot/labs/vfx_batch/**'
      - 'godot/tests/labs/combat_lab/vfx_batch_01_contract_test.gd'
permissions:
  contents: read
jobs:
  isolated-vfx-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_AUDIO_DRIVER: Dummy
      GODOT_RENDERING_DRIVER: opengl3
    steps:
      - uses: actions/checkout@v4
      - name: Exact official Godot 4.7.2, Xvfb and FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg unzip
          curl --fail --location --retry 3 -o /tmp/godot472.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot472.zip' | sha256sum --check --strict
          unzip -q /tmp/godot472.zip -d /tmp
          sudo install -m0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p "$RUNNER_TEMP/vfx-batch01"
          godot --version | tee "$RUNNER_TEMP/vfx-batch01/engine.txt"
          printf 'SOURCE_SHA=%s\nSCENE=res://labs/vfx_batch/tmb_vfx_batch_preview.tscn\nMODE=ISOLATED_LAB\nOWNER_VISUAL_PENDING\nPVE_INTEGRATION_HOLD\n' "$GITHUB_SHA" > "$RUNNER_TEMP/vfx-batch01/metadata.txt"
      - name: Restore canonical stage-A dependency, not tracked source
        shell: bash
        run: |
          set -euo pipefail
          cat .github/assets/p3/female_stage_a/part{01..14}.b64 .github/assets/p3/female_stage_a/part15a.b64 .github/assets/p3/female_stage_a/part15b.b64 .github/assets/p3/female_stage_a/part{16..20}.b64 | tr -d '\r\n\t ' | base64 --decode > /tmp/tmb_stage_a_pack.zip
          test "$(stat -c%s /tmp/tmb_stage_a_pack.zip)" -eq 44838
          echo '6a4213b9129ffb3f438c21cbb5326672ddf8915323836bf80cb33b8e5fabfdca  /tmp/tmb_stage_a_pack.zip' | sha256sum --check --strict
          unzip -q /tmp/tmb_stage_a_pack.zip -d .
      - name: Strict Godot import/parse + all-ID 204/216 source contract
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-batch01"
          bash tools/qa/run_godot_strict.sh --headless --path godot --import 2>&1 | tee "$d/import.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot --check-only --script res://labs/vfx_batch/tmb_vfx_batch_preview.gd 2>&1 | tee "$d/parse.log"
          bash tools/qa/run_godot_strict.sh --headless --path godot -s res://tests/labs/combat_lab/vfx_batch_01_contract_test.gd 2>&1 | tee "$d/test.log"
          grep -Fq 'VFX_BATCH_FOCUSED_RESULT=PASS failures=0' "$d/test.log"
      - name: Real native Godot movie reels, 1280x720 and stage stills
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vfx-batch01"
          for mode in poison schools; do
            if [ "$mode" = poison ]; then frames=864; else frames=1296; fi
            export TMB_VFX_BATCH_MODE="$mode"
            xvfb-run -a -s '-screen 0 1280x720x24' bash tools/qa/run_godot_strict.sh --path godot --resolution 1280x720 --fixed-fps 60 --write-movie "$d/$mode.avi" --quit-after "$frames" res://labs/vfx_batch/tmb_vfx_batch_preview.tscn 2>&1 | tee "$d/$mode-movie.log"
            test -s "$d/$mode.avi"
            ffmpeg -y -hide_banner -loglevel error -i "$d/$mode.avi" -pix_fmt yuv420p -c:v libx264 -crf 17 -movflags +faststart "$d/$mode.mp4"
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height,avg_frame_rate -of default=noprint_wrappers=1 "$d/$mode.mp4" | tee "$d/$mode-dimensions.txt"
            grep -Fxq width=1280 "$d/$mode-dimensions.txt"
            grep -Fxq height=720 "$d/$mode-dimensions.txt"
            ffmpeg -y -hide_banner -loglevel error -i "$d/$mode.mp4" -vf 'fps=1,scale=320:180,tile=4x4:nb_frames=16' -frames:v 1 "$d/$mode-timeline.png"
            ffmpeg -y -hide_banner -loglevel error -i "$d/$mode.mp4" -vf 'fps=6,scale=640:-1:flags=lanczos' -loop 0 "$d/$mode.gif"
            rm -f "$d/$mode.avi"
          done
          for at in 0.5 1.1 2.4 4.5 5.6 8.2 11.7 13.0; do
            ffmpeg -y -hide_banner -loglevel error -ss "$at" -i "$d/poison.mp4" -frames:v 1 "$d/poison-frame-$at.png"
          done
          for at in 0.5 1.7 4.5 6.4 8.6 11.4 13.2 16.2 18.6 20.4; do
            ffmpeg -y -hide_banner -loglevel error -ss "$at" -i "$d/schools.mp4" -frames:v 1 "$d/schools-frame-$at.png"
          done
          sha256sum "$d/"*.mp4 "$d/"*.png "$d/"*.gif > "$d/SHA256SUMS.txt"
      - name: Upload actual video and per-family source QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfx-batch01-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/vfx-batch01/*.log
            ${{ runner.temp }}/vfx-batch01/*.txt
            ${{ runner.temp }}/vfx-batch01/*.png
            ${{ runner.temp }}/vfx-batch01/*.mp4
            ${{ runner.temp }}/vfx-batch01/*.gif
