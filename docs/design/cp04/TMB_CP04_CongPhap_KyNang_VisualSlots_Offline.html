","passives":["Huyết Mạch Kiên Cường","Đoạn Mạch Tinh Thông","Huyết Chiến Ý","Sinh Tồn Bản Năng","Bất Phụ Chiến Ý"],"innate":"Tuyệt Cảnh Huyết Chiến"},{"id":"doc_cham","name":"Độc Châm","school":"poison","lineageA":"Thực Cốt","lineageB":"Bạo Phệ","actives":["Xuyên Cốt Độc Châm","Phệ Mạch Độc Thích","Bách Độc Tán Châm","Độc Khí Phệ Tâm"],"ultimate":"Vạn Độc Xuyên Tâm","passives":["Thấu Mạch Độc Công","Bách Châm Tinh Thông","Tẩm Độc Châm","Thấu Độc","Hóa Độc Nhất Kích"],"innate":"Bách Độc Nhập Cốt"},{"id":"co_doc","name":"Cổ Độc","school":"poison","lineageA":"Liên Tâm","lineageB":"Phệ Cổ","actives":["Phụ Cốt Cổ","Xà Ảnh Quấn Mạch","Cổ Vụ Mê Tung","Tán Cổ Diễn Nhiễm"],"ultimate":"Vạn Cổ Phệ Giới","passives":["Ngự Cổ Thành Thạo","Cổ Vụ Hộ Mạch","Bách Túc Khai Vân","Cổ Vụ Trấn Tức","Cổ Nhận Tỉnh Táo"],"innate":"Cổ Ấn Liên Tâm"},{"id":"duoc_doc","name":"Dược Độc","school":"poison","lineageA":"Hồi Thiên","lineageB":"Dĩ Độc","actives":["Tẩy Mạch Linh Dược","Giải Độc Hộ Tâm","Nghịch Độc Phản Chế","Sinh Cơ Tán"],"ultimate":"Vạn Linh Giải Ách","passives":["Dược Mạch Vững Bền","Thanh Độc Hộ Thân","Tẩy Tủy","Dược Mạch Hồi Lưu","Sinh Cơ Khiên"],"innate":"Độc Dược Đồng Nguyên"}],"schools":{"bow":["Cung","Tiễn Thức Căn Bản","Thu Vũ Bộ","Cung Mạch Sơ Thiên"],"fist":["Quyền","Quyền Thức Căn Bản","Bộ Kình Xung","Quyền Mạch Sơ Thiên"],"poison":["Độc","Độc Châm Thường Thức","Yểm Ảnh Bộ","Độc Mạch Sơ Thiên"]},"skillEffects":{"linh_tien:1":{"effect":"Hồi phục","ratio":null,"cd":10},"ba_quyen:1":{"effect":"Hộ thể","ratio":null,"cd":8},"kim_cang:1":{"effect":"Hộ thể","ratio":null,"cd":8},"kim_cang:2":{"effect":"Hộ thể","ratio":null,"cd":8},"kim_cang:3":{"effect":"Hộ thể","ratio":null,"cd":8},"huyet_quyen:1":{"effect":"Đánh dấu","ratio":1.15,"cd":8},"huyet_quyen:2":{"effect":"Đánh dấu","ratio":1.15,"cd":8},"huyet_quyen:3":{"effect":"Đánh dấu","ratio":1.15,"cd":8},"doc_cham:1":{"effect":"Trúng độc","ratio":1.35,"cd":8},"doc_cham:2":{"effect":"Trúng độc","ratio":1.35,"cd":8},"doc_cham:3":{"effect":"Trúng độc","ratio":1.35,"cd":8},"co_doc:1":{"effect":"Trúng độc","ratio":1.35,"cd":8},"co_doc:2":{"effect":"Trúng độc","ratio":1.35,"cd":8},"co_doc:3":{"effect":"Trúng độc","ratio":1.35,"cd":8},"duoc_doc:1":{"effect":"Hồi phục","ratio":null,"cd":10},"duoc_doc:2":{"effect":"Giải trạng thái","ratio":null,"cd":8},"duoc_doc:3":{"effect":"Giải trạng thái","ratio":null,"cd":8}},"catalogue":{"techniques":84,"humanSkills":105,"immortalSkills":204,"divineSkills":240}};
// All disciple states, ownership and learning statuses below are presentation-only fixtures.
const disciples=[{id:'lam',name:'Lâm Thanh',branch:'liep_anh',realm:'Trúc Cơ',floor:6,status:'Rảnh'},{id:'ha',name:'Hạ Vân',branch:'linh_tien',realm:'Kim Đan',floor:2,status:'Nghiên tu'},{id:'tan',name:'Tần Mặc',branch:'ba_quyen',realm:'Trúc Cơ',floor:9,status:'PvE'},{id:'co',name:'Cố Ninh',branch:'doc_cham',realm:'Luyện Khí',floor:8,status:'Đang làm'}];
const state={tab:'tech',disciple:'lam',branch:'liep_anh',tier:'all',selectedTechnique:null,selectedSkill:null,skillFilter:'all',slot:'main',lineage:'a',stageIndex:1,assets:{},pendingAsset:null,preview:{},details:false};
const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const fmt=n=>Number(n).toLocaleString('vi-VN');
const actor=()=>disciples.find(d=>d.id===state.disciple)||disciples[0];const branch=()=>DATA.branches.find(b=>b.id===state.branch)||DATA.branches[0];const gen={human:'Nhân',immortal:'Tiên',divine:'Thần'};
function buildTechniques(){const out=[];for(const [school,ss]of Object.entries(DATA.schools)){const id=`tmb.technique.${school}.common.human.base`;out.push({id,school,branch:'common',name:ss[3],generation:'human',lineage:'base',ticks:30,cost:[25,5],prereq:[]});for(const b of DATA.branches.filter(x=>x.school===school)){const base=`tmb.technique.${school}.${b.id}.human.base`;out.push({id:base,school,branch:b.id,name:b.name+' Tâm Pháp',generation:'human',lineage:'base',ticks:60,cost:[50,10],prereq:[id]});for(const lane of ['a','b']){const laneName=lane==='a'?b.lineageA:b.lineageB;let predecessor=`tmb.technique.${school}.${b.id}.immortal.${lane}`;out.push({id:predecessor,school,branch:b.id,name:`${b.name} · ${laneName} · Tiên Giai`,generation:'immortal',lineage:lane,ticks:240,cost:[6000,500000],prereq:[id,base]});for(let stage=1;stage<=3;stage++){const n=['i','ii','iii'][stage-1],next=`tmb.technique.${school}.${b.id}.divine_${n}.${lane}`;out.push({id:next,school,branch:b.id,name:`${b.name} · ${laneName} · Thần ${['I','II','III'][stage-1]}`,generation:'divine',lineage:lane,ticks:360*stage,cost:[9000*stage,750000*stage],prereq:[predecessor],gateRealm:[21,25,29][stage-1]});predecessor=next;}}}}return out}
const BOOKS=buildTechniques();const skillTypes={all:'Tất cả',basic:'Đánh thường',active:'Chủ động',ultimate:'Thần thông',mobility:'Thân pháp',passive:'Bị động',innate:'Thiên phú'};
function skillsForBranch(){const b=branch(),ss=DATA.schools[b.school];const v=[{id:`tmb.skill.${b.school}.basic.human`,name:ss[1],type:'basic',ratio:1,cd:1.6,effect:'damage'}, {id:`tmb.skill.${b.school}.mobility.human`,name:ss[2],type:'mobility',ratio:.05,cd:9,effect:'mobility'}];for(let i=0;i<b.actives.length;i++){const row=DATA.skillEffects[`${b.id}:${i}`]||{};v.push({id:`tmb.skill.${b.school}.${b.id}.active_0${i+1}.human`,name:b.actives[i],type:'active',ratio:('ratio' in row)?row.ratio:1.35,cd:row.cd??8,effect:row.effect||'damage'})}v.push({id:`tmb.skill.${b.school}.${b.id}.ultimate.human`,name:b.ultimate,type:'ultimate',ratio:null,cd:null,effect:'catalogue_only'});b.passives.forEach((name,i)=>v.push({id:`tmb.skill.${b.school}.${b.id}.passive_0${i+1}.human`,name,type:'passive',ratio:null,cd:null,effect:'passive'}));v.push({id:`tmb.skill.${b.school}.${b.id}.innate.human`,name:b.innate,type:'innate',ratio:null,cd:null,effect:'innate'});return v}
const media=(key,title,kind='icon')=>`<div class="asset ${kind} ${state.assets[key]?'has-image':''}" data-asset="${esc(key)}">${state.assets[key]?`<img src="${state.assets[key]}" alt="${esc(title)}">`:`<strong>${kind.includes('vfx')?'VFX':kind.includes('book')?'BÍ KÍP':'PNG'}</strong><small>${esc(title)}</small>`}</div>`;
const attach=(key,label='Gắn PNG')=>`<button class="btn small" data-upload="${esc(key)}">${esc(state.assets[key]?'Đổi tệp':label)}</button>`;
const selectedBook=()=>{const rows=booksForView();return rows.find(x=>x.id===state.selectedTechnique)||rows.find(x=>x.branch===branch().id&&x.generation==='human')||rows[0]||BOOKS[0]};
const booksForView=()=>BOOKS.filter(t=>t.school===branch().school&&(t.branch===branch().id||t.branch==='common')&&(state.tier==='all'||state.tier===t.generation));
function bookDetail(t){const parents=t.prereq.map(id=>BOOKS.find(x=>x.id===id)?.name||id);return `<details class="detail-toggle"><summary>Điều kiện học & thông số</summary><p>Bí Kíp tương ứng phải có trong Tàng Kinh; nhân vật phải học đủ tiền đề và không có Active Job khác. Dữ liệu sở hữu chỉ có sau khi nối Save.</p><p>Thời gian: ${fmt(t.ticks)} ticks · Cống hiến: ${fmt(t.cost[0])} · Linh Thạch: ${fmt(t.cost[1])}</p><p>Tiền đề: ${parents.map(esc).join(' → ')||'Không'}${t.gateRealm?` · Cảnh giới tối thiểu mốc ${t.gateRealm}`:''}</p><p>Catalogue ID: ${esc(t.id)}</p><p>Catalogue candidate; tính năng học / chiến đấu không bật mặc định.</p></details>`}
function showBooks(){const rows=booksForView(),t=selectedBook();state.selectedTechnique=t.id;const slots=[['main','CHỦ TU'],['aux1','PHỤ TU I'],['aux2','PHỤ TU II']];return `<div class="layout"><section class="pane padding"><div class="panehead"><strong>Ngọc Giản đang bố trí</strong><span class="muted">1 Chủ · 2 Phụ (xem thử)</span></div><div class="loadout">${slots.map(([id,label])=>{const bid=state.preview[`${state.disciple}:${id}`];return `<button class="slot ${state.slot===id?'active':''}" data-slot="${id}">${media('slot:'+id,'PNG','small')}<span><b>${label}</b><span class="selected-name">${bid?esc(BOOKS.find(x=>x.id===bid)?.name):'Chưa gán'}</span></span></button>`}).join('')}</div></section><div class="two"><section class="pane padding column"><div class="panehead"><strong>Tàng Kinh · Bí Kíp</strong><span class="muted">${rows.length} quyển · Xem catalogue</span></div><div class="scrollbox"><div class="cardlist">${rows.map(x=>`<button class="bookcard ${x.id===t.id?'active':''}" data-book="${esc(x.id)}">${media('book:'+x.id,'Ảnh','small')}<span class="text"><b>${esc(x.name)}</b><small>${gen[x.generation]} · Chưa xác minh sở hữu</small></span></button>`).join('')}</div></div></section><section class="pane padding column"><div class="panehead"><strong>Xem Bí Kíp</strong><span class="muted">Ảnh PNG / WebP</span></div><div class="item-hero"><div class="hero-art">${media('book:'+t.id,'Ảnh bìa Bí Kíp','book')}</div><div class="hero-copy"><span class="eyebrow">${gen[t.generation]} Giai · ${esc(branch().name)}</span><h2>${esc(t.name)}</h2><div class="chips"><span class="chip green">${gen[t.generation]}</span><span class="chip">${t.ticks} ticks</span><span class="chip">${t.cost[0].toLocaleString('vi-VN')} cống hiến</span></div><span class="compact-note">Chưa kiểm tra sở hữu · Không thể học trong HTML mẫu.</span><div class="hero-bottom">${attach('book:'+t.id,'Gắn PNG Bí Kíp')}<button class="btn primary" data-preview="1">Thử vào ô</button></div>${bookDetail(t)}</div></div></section></div></div>`}
function showSkills(){const all=skillsForBranch(),rows=state.skillFilter==='all'?all:all.filter(x=>x.type===state.skillFilter),sel=all.find(x=>x.id===state.selectedSkill)||rows[0]||all[0];state.selectedSkill=sel.id;return `<div class="layout"><div class="two"><section class="pane padding column"><div class="panehead"><strong>Chiêu Thức · ${esc(branch().name)}</strong><span class="muted">Nhân giai · Catalogue</span></div><div class="skillfilter">${Object.entries(skillTypes).map(([id,label])=>`<button class="btn ${state.skillFilter===id?'active':''}" data-filter="${id}">${label}</button>`).join('')}</div><div class="scrollbox"><div class="skillboard">${rows.map(s=>`<button class="skillcard ${s.id===sel.id?'active':''}" data-skill="${esc(s.id)}">${media('icon:'+s.id,'Icon','skill')}<b>${esc(s.name)}</b></button>`).join('')}</div></div></section><section class="pane padding column"><div class="panehead"><strong>Xem trước chiêu thức</strong><span class="muted">VFX · APNG / GIF / WebP</span></div><div class="vfx-player">${media('vfx:'+sel.id,'Hoạt ảnh kỹ năng đặt tại đây','vfx')}</div><div class="vfx-label"><h2>${esc(sel.name)}</h2><button class="btn small" data-replay="1">Phát lại</button></div><div class="quick-stats"><span>${skillTypes[sel.type]}</span>${sel.ratio!==null?`<span>Hệ số <b>×${sel.ratio}</b></span>`:''}${sel.cd!==null?`<span>Hồi chiêu <b>${sel.cd}s</b></span>`:''}</div><div class="btn-row" style="margin-top:7px">${attach('vfx:'+sel.id,'Gắn VFX')}${attach('icon:'+sel.id,'Gắn icon PNG')}<button class="btn small" data-more="1">Chi tiết</button></div><details class="detail-toggle" id="skillDetails" ${state.details?'open':''}><summary>Thông tin kỹ năng · Catalogue candidate</summary><p>Loại: ${skillTypes[sel.type]}; hiệu ứng: ${esc(sel.effect)}; tỉ lệ và CD đang là dữ liệu thiết kế, chưa duyệt cân bằng. Sở hữu và trang bị chưa được xác minh.</p><p>${esc(sel.id)}</p></details></section></div></div>`}
function stages(){const b=branch(),lane=state.lineage,laneName=lane==='a'?b.lineageA:b.lineageB;const base=BOOKS.find(x=>x.branch===b.id&&x.generation==='human');const steps=BOOKS.filter(x=>x.branch===b.id&&x.lineage===lane&&x.generation!=='human');return [base,...steps].filter(Boolean)}
function showEvolution(){const b=branch(),lane=state.lineage,seq=stages(),idx=Math.max(0,Math.min(4,state.stageIndex)),s=seq[idx];return `<div class="layout"><section class="pane padding"><div class="evo-path"><div><strong>Con đường truyền thừa</strong><div class="micro">Mỗi mốc có ô riêng cho ảnh PNG/hoạt ảnh</div></div><div class="btn-row"><button data-lineage="a" class="btn ${lane==='a'?'active':''}">A · ${esc(b.lineageA)}</button><button data-lineage="b" class="btn ${lane==='b'?'active':''}">B · ${esc(b.lineageB)}</button></div></div></section><section class="pane padding"><div class="evo-stages">${seq.map((t,i)=>`<button class="evo-card ${idx===i?'active':''}" data-stage="${i}">${media('book:'+t.id,'Ảnh tiến hóa','stage')}<b>${['Nhân','Tiên','Thần I','Thần II','Thần III'][i]}</b><small>${esc(t.name)}</small></button>`).join('')}</div></section><div class="evo-bottom"><section class="pane padding column"><div class="panehead"><strong>Xem hoạt ảnh tiến hóa</strong><span class="muted">Dành chỗ cho VFX chuyển cảnh</span></div>${media('evolve:'+b.id+':'+lane+':'+idx,'VFX tiến hóa tại đây','vfx evo-vfx')}<div class="btn-row" style="margin-top:7px">${attach('evolve:'+b.id+':'+lane+':'+idx,'Gắn hoạt ảnh')}<button class="btn small" data-replay="1">Phát lại</button></div></section><section class="pane padding stage-details"><span class="eyebrow">MỐC ${['NHÂN','TIÊN','THẦN I','THẦN II','THẦN III'][idx]}</span><h3>${esc(s.name)}</h3><div class="chips"><span class="chip green">${gen[s.generation]}</span><span class="chip">${s.ticks} ticks</span></div><div class="direction">Điều kiện · Xem trước</div><span class="compact-note">${s.prereq.length?'Cần học đủ tiền đề.':'Mốc khởi đầu.'} ${s.gateRealm?'Mốc cảnh giới: '+s.gateRealm+'.':''}</span><span class="compact-note">Hướng A/B là lựa chọn xem trước; không thay đổi truyền thừa thật.</span><div class="btn-row">${attach('book:'+s.id,'Gắn ảnh mốc')}<button data-jumpbook="${esc(s.id)}" class="btn primary">Xem Bí Kíp</button></div>${bookDetail(s)}</section></div></div>`}
function showStudy(){return `<div class="layout"><div class="study-layout"><section class="pane padding"><div class="panehead"><strong>Ngọc giản nghiên tu</strong><span class="muted">Chờ ảnh PNG</span></div>${media('study:'+state.disciple,'Ảnh công pháp đang nghiên tu','book study-preview')}<div class="btn-row" style="margin-top:7px">${attach('study:'+state.disciple,'Gắn PNG')}</div></section><section class="pane padding study-data"><span class="eyebrow">Nghiên tu · ${esc(actor().name)}</span><h2>Chưa có tiến độ thực</h2><div class="chips"><span class="chip">Active Job: chưa xác minh</span><span class="chip">Gate: OFF</span></div><div class="bar"><i></i></div><span class="compact-note">Không hiển thị % giả; chỉ có khi nạp snapshot từ Save/SimulationState.</span><div class="direction">Điều kiện bắt đầu</div><div class="chips"><span class="chip">Bí Kíp</span><span class="chip">Tiền đề</span><span class="chip">Đủ tài nguyên</span><span class="chip">Không bận</span></div><button class="btn" data-hint="1">Xem luật nghiên tu</button></section></div><section class="pane padding"><div class="panehead"><strong>Quy trình nghiên tu</strong><span class="muted">5 bước</span></div><div class="steps">${['Có Bí Kíp','Đủ điều kiện','Nghiên Tu','Tinh Thông','Trang Bị'].map((n,i)=>`<div class="step">${media('flow:'+i,'PNG','small')}<b>${n}</b></div>`).join('')}</div></section></div>`}
function render(){const b=branch(),d=actor();$('actorName').textContent=d.name;$('actorMeta').textContent=`${d.realm} · Tầng ${d.floor} · ${d.status}`;$('roster').innerHTML=disciples.map(x=>`<button data-actor="${x.id}" class="rosterbtn ${x.id===d.id?'on':''}"><span class="avatar">${x.name.split(' ').map(p=>p[0]).slice(-2).join('')}</span><span><b>${x.name}</b><small>${x.realm} · ${x.status}</small></span></button>`).join('');$('heading').textContent={tech:'Công Pháp & Bí Kíp',skills:'Kỹ Năng',evolve:'Tiến Hóa',study:'Nghiên Tu'}[state.tab];$('school').innerHTML=Object.entries(DATA.schools).map(([id,row])=>`<option value="${id}" ${id===b.school?'selected':''}>${esc(row[0])}</option>`).join('');$('branch').innerHTML=DATA.branches.filter(x=>x.school===b.school).map(x=>`<option value="${x.id}" ${x.id===b.id?'selected':''}>${esc(x.name)}</option>`).join('');$('tier').value=state.tier;$('tierWrap').style.display=state.tab==='tech'?'flex':'none';document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===state.tab));$('content').innerHTML=state.tab==='tech'?showBooks():state.tab==='skills'?showSkills():state.tab==='evolve'?showEvolution():showStudy()}
function changeBranch(id){if(!DATA.branches.some(b=>b.id===id))return;state.branch=id;state.tier='all';state.selectedTechnique=null;state.selectedSkill=null;state.skillFilter='all';state.stageIndex=1;render()}
function notify(t){document.querySelector('.status-toast')?.remove();const toast=document.createElement('div');toast.className='status-toast';toast.setAttribute('role','status');toast.textContent=t;document.body.append(toast);setTimeout(()=>toast.remove(),2600)}
let pendingKey=null;
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;const x=el.dataset;if(x.tab){state.tab=x.tab;render()}else if(x.actor){state.disciple=x.actor;changeBranch(actor().branch);$('app').classList.remove('showroster')}else if(x.book){state.selectedTechnique=x.book;render()}else if(x.slot){state.slot=x.slot;render()}else if(x.skill){state.selectedSkill=x.skill;render()}else if(x.filter){state.skillFilter=x.filter;state.selectedSkill=null;render()}else if(x.lineage){state.lineage=x.lineage;state.stageIndex=1;render()}else if(x.stage!==undefined){state.stageIndex=Number(x.stage);render()}else if(x.jumpbook){state.selectedTechnique=x.jumpbook;state.tier='all';state.tab='tech';render()}else if(x.preview){const t=selectedBook();state.preview[`${state.disciple}:${state.slot}`]=t.id;notify('Chỉ bố trí thử trong HTML, không ghi Save.');render()}else if(x.upload){pendingKey=x.upload;$('picker').click()}else if(x.replay){const img=el.closest('.pane')?.querySelector('.asset.vfx img');if(!img){notify('Chưa gắn hoạt ảnh VFX vào ô này.');return}const src=img.src;img.src='';requestAnimationFrame(()=>{img.src=src});notify('Đã yêu cầu phát lại tệp hoạt ảnh (tùy định dạng).')}else if(x.more){state.details=!state.details;const el=$('skillDetails');if(el)el.open=state.details}else if(x.hint){notify('Cần có Bí Kíp, đủ tiền đề, tài nguyên và Active Job trống; chỉ bắt đầu khi feature gate được bật.')}});
$('rosterToggle').addEventListener('click',()=>$('app').classList.toggle('showroster'));
$('school').addEventListener('change',e=>changeBranch(DATA.branches.find(b=>b.school===e.target.value)?.id));
$('branch').addEventListener('change',e=>changeBranch(e.target.value));
$('tier').addEventListener('change',e=>{state.tier=e.target.value;state.selectedTechnique=null;render()});
$('picker').addEventListener('change',e=>{const file=e.target.files?.[0];if(!file||!pendingKey)return;if(!/image\/(?:png|gif|webp|apng)/.test(file.type)){notify('Chỉ hỗ trợ ảnh PNG/GIF/APNG/WebP.');return}if(state.assets[pendingKey])URL.revokeObjectURL(state.assets[pendingKey]);state.assets[pendingKey]=URL.createObjectURL(file);e.target.value='';render();notify('Đã gắn tệp cục bộ. Tải lại HTML sẽ cần gắn lại.');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('app').classList.remove('showroster')});
render();
</script>
</body></html>
