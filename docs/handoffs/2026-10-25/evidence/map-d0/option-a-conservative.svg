  <g transform="translate(1180 530)"><path d="M0 -13L17 0 0 13 -17 0Z" class="site"/><text x="0" y="30" text-anchor="middle" class="tiny" font-weight="700">CỔNG</text></g>
  <g transform="translate(42 558)"><rect width="268" height="61" rx="9" fill="#f5eed9" stroke="#8e815f"/><text x="12" y="23" class="label">Ưu: không động bố trí đang chơi.</text><text x="12" y="42" class="small">Nhược: trung tâm / tuyến công việc vẫn rời.</text></g>
  <text x="1244" y="620" text-anchor="end" class="tiny">Dải đứt = lối nối chỉ là ý tưởng, chưa có trong runtime.</text>
